  const DIE_RARITY_COLOR = { legendary:"#f2c96b", ultra_rare:"#c48bde", rare:"#8ec6e6", common:"#c9bba3" };
  function dieRarityColorFor(dieKind){
    if(DICE_SHOP_LEGENDARY_POOL.includes(dieKind)) return DIE_RARITY_COLOR.legendary;
    if(DICE_SHOP_ULTRA_RARE_POOL.includes(dieKind)) return DIE_RARITY_COLOR.ultra_rare;
    if(DICE_SHOP_RARE_POOL.includes(dieKind)) return DIE_RARITY_COLOR.rare;
    return DIE_RARITY_COLOR.common;
  }
  const RARE_DIE_CHANCE = 0.15; // per offer slot, each shop visit -- see pickDieKind
  const ULTRA_RARE_DIE_CHANCE = 0.04; // per offer slot, each shop visit -- checked before RARE_DIE_CHANCE, see pickDieKind
  const LEGENDARY_DIE_CHANCE = 0.02; // per offer slot, each shop visit -- checked before ULTRA_RARE_DIE_CHANCE, see pickDieKind

  // Real bet winnings, not abstract points -- rescaled to match what a scene
  // of actual craps payouts can plausibly bank (a first-balance pass; easy to
  // retune here in one place since every scene target still funnels through
  // this one function).
  function targetFor(ante, tierIdx){
    const base = Math.round(12 * Math.pow(ante, 1.4)) + 8;
    return Math.round(base * BLIND_TIERS[tierIdx].mult / 5) * 5;
  }

  // Scandal's own payout cap (see BOSS_BLINDS) -- a flat fraction of
  // whatever this scene's actual Target is, floored at the original flat
  // 6u so an early scene (where 1/8 of Target would round below that)
  // never gets a WEAKER cap than the boss originally had.
  function scandalCapFor(st){
    return Math.max(6, Math.round((st.target||0)/8));
  }

  // Payroll only ever grows outside the shop (scene stipend, a scene-clear/
  // skip payout, interest, a Per Diem Die or an Econ felt zone's per-roll
  // trickle -- see beginScreening/settleRound/skipRound/resolveOnRoll) and
  // nothing ever drains it back down on its own, so left alone across a
  // long run it just kept climbing into numbers with no real ceiling. A
  // flat cap, same spirit as Score's own hard floor at 0 (see
  // checkBudgetOut) but on the other end: every add-site below routes
  // through here instead of touching state.payroll directly, so the cap
  // can't quietly get missed by a future one. First-balance pass, easy to
  // retune here in one place.
  const PAYROLL_CAP = 500;
  function addPayroll(amount){
    state.payroll = Math.max(0, Math.min(PAYROLL_CAP, state.payroll + amount));
  }

  // Every other boss's desc is a fixed string -- Scandal's own (see
  // BOSS_BLINDS) is the one exception, a function of the live scene state
  // now that its cap scales with Target instead of sitting flat, so both
  // places that show a boss's description read it through here rather than
  // assuming desc is always plain text.
  function bossDescFor(boss){
    return boss ? (typeof boss.desc==="function" ? boss.desc(state) : boss.desc) : "";
  }

  // The shop's base payout for clearing a scene -- grows gently with how far
  // into the run you are, in the same spirit as targetFor's own ante/tier
  // curve. First-balance pass, easy to retune here in one place. (See
  // settleRound for the Heat and interest bonuses stacked on top of this.)
  function shopBaseFor(ante, tierIdx){
    return 3 + ante + tierIdx;
  }

  // Small-number-only Roman numeral formatter -- Act I/II/III never needed
  // this (see the plain ternary this replaced), but Endless (state.
  // endlessMode, see actInfo below) can reach Act IV, V, VI... with no
  // ceiling, so this covers that range too rather than hand-listing more
  // ternaries. Never needs to represent 0 or a negative -- actInfo's own
  // act is always >=1.
  function toRoman(n){
    const steps = [[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];
    let out = "";
    steps.forEach(([v,sym])=>{ while(n>=v){ out += sym; n -= v; } });
    return out;
  }
  // Screenplay-style Act structure: Act I = Ante 1-3, Act II = 4-6, Act III
  // = 7-8. Ante can run past MAX_ANTE (8) in Endless (see state.endlessMode,
  // set from the win screen's Keep Rolling button) -- rather than stop the
  // Act/Scene readout at Act III forever, every further 3 antes forms
  // another Act (IV, V, VI, ...), same 3-scene shape Act I/II already use,
  // with no ceiling on how many. Nothing else about a run's difficulty
  // curve is defined per-Act any more once past Act III -- see
  // DIE_LOSS_CHANCE_BY_ACT/SCENE_STIPEND_BY_ACT, both of which plateau at
  // their own Act 3 numbers instead of trying to extend a 1/2/3 table
  // forever -- Target (targetFor) is what actually keeps climbing in
  // Endless, straight off the ante number itself, not off the Act.
  function actInfo(ante){
    let act, sceneStart, sceneCount;
    if(ante<=3){ act=1; sceneStart=1; sceneCount=3; }
    else if(ante<=6){ act=2; sceneStart=4; sceneCount=3; }
    else if(ante<=MAX_ANTE){ act=3; sceneStart=7; sceneCount=2; }
    else {
      const pastAntes = ante - MAX_ANTE - 1; // 0-based antes into Endless
      const actsPast = Math.floor(pastAntes/3);
      act = 4 + actsPast;
      sceneStart = MAX_ANTE + 1 + actsPast*3;
      sceneCount = 3;
    }
    return { act, roman: toRoman(act), scene: ante-sceneStart+1, sceneCount };
  }

  // Scene Stipend: does double duty at the START of every scene (see
  // beginScreening). It's the fresh Score you're handed to bet with this
  // scene -- Score never carries over from one scene to the next any more,
  // so there's always SOMETHING to bet with the moment a scene starts,
  // never 0u and locked out. And the exact same amount lands in Payroll too,
  // permanently -- Payroll is the separate, persistent currency the shop
  // spends (see settleRound/skipRound for the rest of what feeds it, and
  // interestFor for what saving it up earns). Scales by Act (see actInfo)
  // rather than every scene, so it climbs in the same three broad steps the
  // run's own story structure already uses. Cut down from the original
  // 10/15/20 -- Payroll used to start too flush for the shop's own prices to
  // feel like real decisions; a scene-clear payout and interest (see
  // settleRound/interestFor) are still what actually builds it up over a run.
  const SCENE_STIPEND_BY_ACT = { 1:6, 2:10, 3:14 };
  function sceneStipendFor(ante){
    // Same Act-3 plateau as dieLossChanceFor, and for the same reason: an
    // unclamped lookup misses on Act 4+ (Endless, see actInfo) and falls
    // back to the ||6 below, which would actually CUT Endless's stipend
    // back down from Act 3's 14 to Act 1's 6 the moment Ante 9 hits --
    // clamping to Act 3 keeps it flat at the run's highest stipend instead.
    let s = SCENE_STIPEND_BY_ACT[Math.min(actInfo(ante).act, 3)] || 6;
    const character = CHARACTERS[state.characterId];
    if(character && character.stipendMult) s = Math.round(s*character.stipendMult);
    return s;
  }

  // Interest on saved Payroll -- paid out alongside every scene-clear/skip
  // payout (see settleRound/skipRound), same spirit as the old money-based
  // formula this replaces, just reading the persistent currency instead of
  // the live in-scene number. Base rate is 1u per 5 Payroll saved, capped at
  // 5u a scene -- a Cast-slot "interest perk" (see EQUIPMENT_POOL) can
  // widen either side of that, but never both at once since only one Cast
  // item is ever equipped.
  function interestFor(){
    let cap = 5, rate = 5;
    const cast = state.equipped.cast;
    if(cast && cast.id==="cast_bean_counter") rate = 3;
    if(cast && cast.id==="cast_line_producer") cap = 10;
    return Math.min(cap, Math.floor(state.payroll/rate));
  }

  /* ============ STATE ============ */

  function freshState(){
    let nextUid = 1;
    const pool = [];
    for(let i=0;i<5;i++){ pool.push({ uid:"die"+(nextUid++), kind:"standard" }); }
    return {
      screen:"title",
      // Chosen once, before the run starts, via renderCharacterSelect and
      // renderDifficultySelect -- see startRun, which reads pendingCharacterId/
      // pendingDifficulty off of THIS (the title-screen) state object before
      // replacing it wholesale with a fresh one, then reapplies them onto
      // the new state. null/"blockbuster" here (rather than picking a
      // default character outright) is also what a save from before this
      // feature existed backfills to via loadState's generic migration --
      // "blockbuster" (Era 6) is the one Era whose Heat-cap/boss-pool
      // numbers exactly match this game's original, pre-Era behavior (see
      // heatMaxFor/bossPoolFor) -- a "no character trait, original
      // difficulty" run, i.e. exactly how the game already played.
      characterId:null,
      difficulty:"blockbuster",
      pendingCharacterId:null,
      pendingDifficulty:null,
      ante:1, tierIdx:0,
      // Score and Payroll are two completely separate pools now (see
      // beginScreening/sceneStipendFor) -- Score is the live number you bet
      // with and chase this scene's Target with, reset fresh every single
      // scene and never carried anywhere; Payroll is the persistent shop
      // currency, only ever touched by the scene stipend, a scene-clear
      // payout (settleRound/skipRound) and interest (interestFor), never by
      // a bet win or loss. Both start at 0 here -- beginScreening (always
      // called immediately after, see startRun) seeds Score and grants
      // Payroll's first stipend before a single bet is ever placed.
      score:0,
      payroll:0,
      equipped:{ film:null, script:null, lens:null, cast:null },   // one item per type, never more
      // Player-set resolution/display order for the 4 Production Kit slots
      // above -- see perkOrderSafe(), which every scoring hook and both
      // perkBar()/kitStrip() read instead of the fixed EQUIP_SLOTS array
      // directly, and wirePerkDrag() (perkBar's drag-to-reorder). Always a
      // permutation of all 4 slot ids, filled or not -- reordering just
      // changes WHERE an empty slot's turn comes up, not whether it fires.
      perkOrder: [...EQUIP_SLOTS],
      // Unified shop, one shared roll: 3 slots, each independently a Felt,
      // Dice or Perk (Production Kit) offer -- see rollShopOffers. Replaces
      // the old equipOffers/feltOffers/diceShopOffers three-separate-
      // sections layout. Each entry is null (sold/empty) or
      // { kind:"perk", slot, item } / { kind:"felt", zoneId } /
      // { kind:"die", dieKind }.
      shopOffers:[null,null,null],
      // Shuffled draw-bags, one per equipment type -- guarantees every item of a
      // type gets offered once before any of them repeats, instead of an
      // independent random pick each shop visit (which could -- and did --
      // hand back the same item over and over, especially in the smaller
      // Script/Cast pools). Refilled and reshuffled whenever a bag runs dry.
      equipOfferBags:{ film:[], script:[], lens:[], cast:[] },
      // The one shared reroll cost for all 3 shop slots at once -- see
      // rerollShop(). Never actually shown before the first real shop visit --
      // settleRound() overwrites this via rerollBaseCostFor() before the
      // shop first renders; kept in sync with the real base cost rather
      // than re-hardcoded.
      shopRerollCost:REROLL_BASE_COST,
      pendingDiceBuy:null, // index into shopOffers, while the "write off which die?" picker is up for a die-kind offer
      // The Hustler's own payout hook (see CHARACTERS) -- how many shop
      // rerolls have been bought so far THIS RUN. Incremented in
      // rerollShop, never reset scene to scene (same "carries for the whole
      // run" shape as retakesLeft below), only back to 0 on a brand-new run.
      hustlerRerollsBought:0,
      feltLevels:{},   // { [zoneId]: level } -- per-bet-zone felt upgrades; missing or 0 = not upgraded (see FELT_ZONES)
      feltOfferBag:[], // shuffled draw-bag backing drawFeltOffer, same anti-repeat trick as equipOfferBags
      econFeltOfferBag:[], // separate shuffled draw-bag for the rare Econ felt zones, see drawEconFeltOffer
      // Retakes are no longer a free per-scene baseline -- they're bought at
      // the lot (see buyRetake/retakeBuyCost) and, once bought, the stock
      // carries with you scene to scene for the rest of the run instead of
      // resetting; only a brand-new run starts back at 0. See canRetake/
      // doRetake for how a stocked Retake gets spent.
      retakesLeft:0,
      retakeBuyCost:RETAKE_SHOP_BASE_COST, // resets to base every shop visit, climbs 1u per Retake bought that same visit -- see settleRound/buyRetake
      // The Time Traveler's free-first-Retake-of-the-scene trait -- see
      // canRetake/doRetake. Reset false every scene in beginScreening, same
      // cadence as freeRetakeUsedThisScene always has been (retakesLeft
      // itself no longer resets, see above).
      freeRetakeUsedThisScene:false,
      // Time Traveler's own payout hook (see CHARACTERS) -- set true the
      // instant the free Retake above actually gets spent (doRetake), read
      // and cleared by the very next winning bet's onPayout (resolvePayout).
      // Same reset cadence as freeRetakeUsedThisScene: false every fresh
      // scene (beginScreening), so an unspent boost never lingers into one
      // where the free Retake hasn't even been used yet.
      timeTravelerBoostPending:false,
      // Target is an ABSOLUTE line, seed (this scene's Score-and-stipend
      // amount, see beginScreening) plus targetFor's growth curve: win bets
      // and Score climbs toward it, lose bets and it falls back, same units,
      // same number, the whole way. See checkRoundEnd (win check) and
      // checkBudgetOut (0u Score is a hard loss on its own, independent of
      // this -- Payroll hitting 0 is never a loss condition at all).
      target:10+targetFor(1,0),
      // This Act's Director's Cut boss for the CURRENT ante -- drawn once,
      // at the very start of the ante (tierIdx 0, Read Through -- see
      // beginScreening), not withheld until the boss round itself. Stays
      // set through Read Through and Rehears-Roll so both of this ante's
      // shop visits and Next Up screens can preview it (renderShop/
      // renderBlindSelect), same as a Balatro run showing every blind for
      // the ante up front. null between an ante wrap and that draw (see
      // settleRound) -- there is deliberately a brief window, the one shop
      // visit right after beating a boss, where the NEXT ante's boss isn't
      // known yet either, same as it never used to be known before this.
      bossId:null,
      // Every boss id drawn so far this run (see beginScreening's own
      // no-repeat draw and bossPoolFor) -- cleared back to empty once every
      // currently-unlocked boss has come up, so a long or endless run never
      // runs dry, it just starts a fresh lap through the same pool instead
      // of ever repeating a boss it could still avoid.
      seenBossIds:[],
      // Set once, from the win screen's "Keep Rolling" button (see
      // renderEnd/settleRound) -- true means Ante 9+ no longer ends the run,
      // it just keeps going: Target (targetFor), the boss pool and the
      // Act/Scene readout (actInfo) all already scale cleanly past
      // MAX_ANTE on their own, so this flag is the only thing settleRound
      // actually needs to check.
      endlessMode:false,
      rollNumber:0,
      log:[],
      lastRoll:null,      // {a,b,hand,netThisRoll} -- hand is flavor color-commentary only; netThisRoll is this roll's real net units across every bet resolved
      lastRollSnapshot:null, // for retake: full state snapshot taken before a roll
      screeningsWon:0,
      highestAnte:1,
      won:false,
      rolling:false,
      // dice pool / craps flow
      dicePool: pool,
      nextDieUid: nextUid,
      selectedDiceIds: [],
      pendingSelect: [],
      // Body Double's own manual roll values (see DIE_KINDS' comment on
      // manual/fillsBothSlots) -- what rollOneDie reads instead of
      // randomizing, for whichever of the two active slots it's asked
      // about. Never reset scene to scene; whatever you last set carries
      // over as the default, same as a real prop you keep dialing in.
      manualPick: { a:1, b:1 },
      sidelinedDice: [],  // [{uid,kind}] original kind stashed while a die is swapped to Standard for THIS scene only -- restored fresh every beginScreening()
      dieLostPrompt: null, // {name} while the "a die went off the table" interrupt is up; null otherwise
      dieLostReturnPhase: null, // 'comeout'|'point' stashed by maybeLoseDie so confirmLineup can put the board back exactly where it was, instead of restarting the come-out
      phase: "select", // 'select' | 'comeout' | 'point'
      point: null,
      roundComplete: false,      // target hit AND table clear -- paused on a "Take 5" screen instead of auto-wrapping; see checkRoundEnd()
      roundCompleteEarly: false, // which settleRound() bonus rule applies once Take 5 is clicked
      lineBet: null, // {type:'pass'|'dontpass', amount} - only placed pre-point; rides through the point once set
      fieldBet: 0,    // units riding on Field this roll; independent one-roll bet, re-toggled every roll
      stake: 1,       // vestigial -- kept only so old saves keep loading; bets are now built by tapping (+1/tap) and held to clear, not a pre-set amount
      hardBets: { 4:0, 6:0, 8:0, 10:0 }, // independent side bets, ride until they resolve
      hardResolutions: [],
      propBets: { anySeven:0, anyCraps:0, snakeEyes:0, boxcars:0 }, // one-roll props -- a loss clears the zone, a win leaves it riding
      propResolutions: [],
      placeBets: { 4:0, 5:0, 6:0, 8:0, 9:0, 10:0 }, // "dealer bets" -- the dealer sets these for you
      placeResolutions: [],
      // Come: real craps' answer to "how do I get new money working on a
      // number once the point's already on" -- see resolveComeBets. comeBet
      // is whatever's freshly in the come box, not yet assigned a number;
      // the very next roll acts as ITS OWN come-out (7/11 wins, 2/3/12
      // loses, a point number moves it into comeBets[that number]).
      // comeBets then rides there like a Place bet, but pays even money and
      // is taken down the moment it wins, rather than staying up -- true to
      // the real bet, not a Place bet with a different name.
      comeBet: { amount:0 },
      comeBets: { 4:0, 5:0, 6:0, 8:0, 9:0, 10:0 },
      comeResolutions: [],
      comeBetNote: null,
      // Don't Come: the "don't" mirror of Come -- see resolveDontComeBets.
      // Same box-then-point shape, but rooting for the seven instead of
      // against it: the box's own come-out loses on 7/11, wins on 2/3,
      // pushes on 12 (bar the 12, same convention Don't Pass already uses),
      // and a point number moves it into dontComeBets[that number] as a lay
      // against that number ever repeating -- wins on any seven, loses if
      // its own number comes back first.
      dontComeBet: { amount:0 },
      dontComeBets: { 4:0, 5:0, 6:0, 8:0, 9:0, 10:0 },
      dontComeResolutions: [],
      dontComeBetNote: null,
      lastBetNote: null,
      lastFieldNote: null,
      lastDieLostMsg: null,
      lastSceneStipend: 0, // this scene's guaranteed start-of-scene payout, for display on the Next Up screen -- see sceneStipendFor/beginScreening
      lastAct: 1,
      gameOverReason: null, // one-line explanation shown on the end screen for why a run ended -- see gameOver()
      eraUnlockNote: null, // one-line "Era N unlocked for <character>!" set on a win by maybeUnlockNextEra -- see settleRound's win branch
      characterUnlockNote: null, // one-line "<name> joins the cast!" set on a win by maybeUnlockNextCharacter -- see settleRound's win branch
      rollsSincePoint: 0,   // Chekhov's Gun: neutral rolls since the current point was set
      plotArmorUsed: false, // Plot Armor: only survives one seven-out per scene
      // Franchise Fatigue: whether the last roll that actually happened
      // (not one erased by a die going off the table -- see the lostDie
      // branch in doRoll, "this roll never happened") summed to seven.
      // Deliberately its OWN flag rather than reading state.lastRoll --
      // lastRoll gets unconditionally nulled by a Retake (see doRetake) so
      // the dice well blanks back to "tap to roll", which is the right call
      // for THAT display, but would also wrongly let this perk forget a
      // seven that genuinely happened and wasn't itself the roll undone.
      // This flag is restored from the snapshot on a Retake instead (see
      // doRoll's lastRollSnapshot and doRetake), same "full time-jump back"
      // treatment Heat/stuntDoubleUsed already get, just kept off lastRoll
      // entirely so the Retake button's own re-enable logic (which keys off
      // lastRoll being non-null) is untouched.
      lastRollWasSeven: false,
      // The growing half of the die-loss mechanic (see DIE_RISK_STREAK_
      // GROWTH/maybeLoseDie): dieRiskStreak counts consecutive REAL rolls
      // this scene (a roll a die falling off erases doesn't count -- same
      // "never happened" treatment rollNumber/rollsSincePoint already get)
      // that landed on neither a seven nor a sum already in
      // dieRiskSeenSums. Either one resets both fields back to their
      // freshState defaults; otherwise the sum gets added and the streak
      // grows by one. Reset every fresh scene (beginScreening) and rolled
      // back on a Retake (see doRoll's lastRollSnapshot/doRetake), same
      // full time-jump-back treatment rollsSincePoint/lastRollWasSeven get.
      dieRiskStreak: 0,
      dieRiskSeenSums: [],
      scriptNote: null,     // one-line callout when an equipped Script item fires
      bossDisabledSlot: null, // which equip slot ("film"/"script"/"lens"/"cast") the Director's Notes boss shut down this roll -- null otherwise
      bossNote: null,          // one-line callout when a boss blind's own effect fires (parallel to scriptNote/castNote)
      doublesThisScene: 0,     // running count of doubles rolled this scene -- feeds Double Feature's stacking payout mult
      photoFinishUsed: false,  // per-scene: has Photo Finish already doubled this scene's first winning bet? resets in beginScreening
      // The three "permanent stacker" counters -- Studio Legacy (Felt
      // purchases), New Talent (Dice Shop purchases) and Scene Stealer (a
      // die rolling off the table). Deliberately NOT reset in
      // beginScreening -- unlike doublesThisScene/photoFinishUsed above,
      // these carry for the whole run, same as heat/winStreak do. Each only
      // increments while its matching item is the one actually equipped at
      // the moment its trigger fires -- see buyFeltZone/completeBuyDie/
      // maybeLoseDie and each item's own comment in EQUIPMENT_POOL.
      studioLegacyStacks: 0,
      newTalentStacks: 0,
      sceneStealerStacks: 0,
      // The Extra (Cast, see EQUIPMENT_POOL): true once its one-time +1
      // dicePool slot has been handed out this run. Unlike the three
      // stack counters just above, this never increments further -- it's
      // a single flag guarding a single grant, checked in buyShopOffer.
      extraDieSlotGranted: false,
      heat: 1,                 // 0-HEAT_MAX checkpoints banked; each cushions one crap-out. Persists across scenes, resets only on a new run. Starts at 1, not 0 -- so a brand-new run can never end on its very first crap-out, before the player's made a single shop choice.
      stuntDoubleUsed: false, // Stunt Double: only shields one crap-out per run, not per scene
      castNote: null,          // one-line callout for a Heat event -- a gain, a crap-out cushion, or a Cast item's effect
      winStreak: 0,          // consecutive net-positive rolls this run (not per scene); every 3rd extends Heat -- see doRoll
      betUnit: 1,             // how many units each tap adds to a bet zone -- the chip denomination picker on the felt lets you bump this to 5/10/25 so hot scenes don't need 100 taps
      // Remove Bets toggle: since a press-and-hold on a bet zone now shows
      // what it does (see wireHoldTip) instead of pulling the bet back, a
      // plain tap is the only gesture left on a zone -- this flag decides
      // what that tap DOES. Off (the default): tap adds a bet, same as
      // always. On: tap instead calls that zone's own clear* function (see
      // renderPlay's click-wiring, right where wireHoldTip's onTap is
      // chosen) -- Clear All Bets is still there too for wiping everything
      // in one go, this is for pulling back just one zone at a time. Reset
      // to off at the start of every scene (see beginScreening) so it never
      // silently carries into a fresh table with nothing on it yet.
      removeMode: false,
    };
  }
  let state = loadState() || freshState();

  function saveState(){
    try{ localStorage.setItem("leadingRoll.save", JSON.stringify(state)); }catch(e){}
  }
  function loadState(){
    try{
      const raw = localStorage.getItem("leadingRoll.save");
      if(!raw) return null;
      return migrateLoadedState(JSON.parse(raw));
    }catch(e){}
    return null;
  }
  // Split out of loadState() so a Save Code import (see buildSaveCode/
  // applySaveCode) can run an already-parsed object through the exact same
  // migration/backfill path a returning browser tab's own localStorage save
  // gets -- a code exported from an older published version of this game
  // shouldn't need its own separate, easier-to-drift-out-of-sync migration
  // logic. Takes an already-JSON.parsed object (loadState itself does the
  // parsing before calling this); returns null for anything unmigratable.
  function migrateLoadedState(s){
      // Saves from before the units-only, multi-bet rework lack `stake` (or can be
      // stuck mid the old single-slot "betting" phase) -- start those runs fresh
      // rather than trying to migrate a bet model that no longer exists.
      if(s && typeof s==="object" && "stake" in s && s.phase!=="betting"){
        // This build replaced the old 5-slot Crew & Cast joker rack with three
        // exclusive Film/Script/Lens slots. There's no sound way to map old
        // jokers onto slots that no longer exist, so a save from before this
        // rework starts fresh here rather than corrupting the new equip model.
        if(Array.isArray(s.jokers) || !s.equipped || typeof s.equipped!=="object"){
          return null;
        }
        // A save can predate a field this build now relies on (a returning tab may
        // still hold state written by an earlier version of this game). Backfill
        // anything missing from a fresh state rather than let a bet silently no-op
        // because e.g. state.placeBets was undefined. Captured BEFORE that backfill
        // runs, since the backfill itself would otherwise always hand payroll/score
        // a placeholder value and make this look like a post-split save either way.
        const hadScorePayrollSplit = typeof s.payroll==="number";
        const fresh = freshState();
        Object.keys(fresh).forEach(k=>{ if(!(k in s)) s[k] = fresh[k]; });
        // A save from before this rebalance split the single combined
        // "money" number into Score (the live in-scene number, resets every
        // scene) and Payroll (the persistent shop currency, see
        // beginScreening/interestFor) has no sound way to know retroactively
        // which part of that old number "was" which. Generous one-time
        // migration: the whole thing becomes Payroll (nothing lost from the
        // shop-currency side), and Score gets reseeded to this scene's
        // stipend amount, the same fresh baseline beginScreening always
        // hands out -- costs whatever mid-scene betting progress this save
        // was sitting on, same trade-off the old sceneStartMoney migration
        // this replaces already made once before.
        if(!hadScorePayrollSplit && typeof s.money==="number"){
          s.payroll = s.money;
        }
        delete s.money;
        delete s.sceneStartMoney;
        // Target is this scene's stipend seed plus targetFor's growth curve
        // -- recomputed unconditionally (not just for a migrating save) so
        // an in-progress save never strands itself on a target computed by
        // an older formula after a rebalance like this one.
        if(typeof s.ante==="number" && typeof s.tierIdx==="number"){
          // A pre-split save's lastSceneStipend (if the generic backfill
          // above just handed it the fresh-state default of 0) means
          // nothing -- recompute a real seed for it. A save that already
          // had payroll on record earned its lastSceneStipend for real, via
          // an actual beginScreening call, so that recorded value is the
          // one to trust.
          const seed = hadScorePayrollSplit ? s.lastSceneStipend : sceneStipendFor(s.ante);
          if(!hadScorePayrollSplit){
            s.score = seed;
            s.lastSceneStipend = seed;
          }
          s.target = seed + targetFor(s.ante, s.tierIdx);
        }
        if(!s.placeBets || typeof s.placeBets!=="object") s.placeBets = fresh.placeBets;
        else [4,5,6,8,9,10].forEach(n=>{ if(typeof s.placeBets[n]!=="number") s.placeBets[n]=0; });
        if(!s.hardBets || typeof s.hardBets!=="object") s.hardBets = fresh.hardBets;
        else [4,6,8,10].forEach(n=>{ if(typeof s.hardBets[n]!=="number") s.hardBets[n]=0; });
        if(!s.propBets || typeof s.propBets!=="object") s.propBets = fresh.propBets;
        else ["anySeven","anyCraps","snakeEyes","boxcars"].forEach(k=>{ if(typeof s.propBets[k]!=="number") s.propBets[k]=0; });
        if(typeof s.stake!=="number" || s.stake<1) s.stake = 1;
        // The equipped Film/Script/Lens items (and this scene's shop offers)
        // were spread in from EQUIPMENT_POOL, which includes their onPayout/
        // onLoss/onRoll FUNCTIONS -- JSON.stringify silently drops function-valued fields,
        // so an item that survives a save/reload keeps its name and cost but
        // loses its actual effect, with no error to show for it. Re-merge each
        // saved item's own fields back over a fresh EQUIPMENT_POOL lookup by
        // id so the behavior comes along too.
        // A save from before the Supporting Cast slot existed has an `equipped`
        // object with no `cast` key at all -- explicitly default it to null
        // (rather than leaving it undefined) so this stays a clean, non-wiping
        // upgrade instead of needing the jokers-style reset above.
        EQUIP_SLOTS.forEach(slot=>{
          const owned = s.equipped[slot];
          if(owned){
            const def = EQUIPMENT_POOL.find(p=>p.id===owned.id);
            s.equipped[slot] = def ? { ...def, ...owned } : null;
          } else {
            s.equipped[slot] = null;
          }
        });
        // A save from before drag-to-reorder existed (or one with a
        // corrupted array) has no perkOrder at all -- back it onto the
        // original fixed film/script/lens/cast order, same order every run
        // used to resolve/display in before this feature. perkOrderSafe()
        // (see there) would catch this at read time regardless, but writing
        // a real value back here keeps state.perkOrder itself always valid
        // rather than leaning on the fallback forever.
        if(!(Array.isArray(s.perkOrder) && s.perkOrder.length===EQUIP_SLOTS.length && EQUIP_SLOTS.every(sl=>s.perkOrder.includes(sl)))){
          s.perkOrder = [...EQUIP_SLOTS];
        }
        // Same dropped-functions problem applies to a "perk" shop offer's
        // item -- re-merge it against a fresh EQUIPMENT_POOL lookup too. A
        // save from before the unified 3-slot shop existed (still on the
        // old equipOffers/feltOffers/diceShopOffers shape) doesn't get a
        // hand-written migration here -- same precedent as the jokers-rack
        // rework above: structurally incompatible shop state just falls
        // back to a fresh (empty) shop via the generic backfill loop below,
        // rather than trying to translate three old offer shapes into one.
        if(Array.isArray(s.shopOffers)){
          s.shopOffers = s.shopOffers.map(off=>{
            if(!off || off.kind!=="perk" || !off.item) return off;
            const def = EQUIPMENT_POOL.find(p=>p.id===off.item.id);
            return def ? { ...off, item:{ ...def, ...off.item } } : off;
          });
        }
        return s;
      }
    return null;
  }

  // Era progression: separate from the run save entirely (its own
  // localStorage key, untouched by restart()/a new run/a loss) -- think
  // "deck stakes" in Balatro terms. Each character (deck) tracks its own
  // furthest-unlocked Era (stake) independently, starting everyone at Era 1
  // (index 0) with nobody else's progress shared. Beating a run (see
  // settleRound's win branch) at exactly your character's current
  // furthest-unlocked Era bumps that character's own record by one; a
  // won run at an Era you'd already unlocked earlier doesn't advance
  // anything further, same as replaying a cleared stake in Balatro.
  function loadMeta(){
    try{
      const raw = localStorage.getItem("leadingRoll.meta");
      if(!raw) return {};
      const m = JSON.parse(raw);
      return (m && typeof m==="object") ? m : {};
    }catch(e){ return {}; }
  }
  function saveMeta(meta){
    try{ localStorage.setItem("leadingRoll.meta", JSON.stringify(meta)); }catch(e){}
  }

  // Save Code: a portable text export/import of BOTH localStorage keys this
  // game uses -- the in-progress run (state, "leadingRoll.save") and the
  // persistent per-character Era/character-unlock record (meta,
  // "leadingRoll.meta", see loadMeta's own comment). Autosave alone only
  // ever lives in one browser, in one tab -- there's no way to back a run
  // up or carry it to a different browser/device without an explicit
  // export like this. A version-tagged prefix (SAVE_CODE_VERSION) lets a
  // pasted-in code get sanity-checked before it ever touches localStorage,
  // and the actual save payload is run through migrateLoadedState (see its
  // own comment) exactly like a returning tab's own save would be, so a
  // code exported from an older published version of this game still loads
  // cleanly on a newer one. See renderTitle for the UI this backs, and
  // saveCodeOut/saveCodeIn/saveCodeMsg (closure-scoped, not on `state` --
  // this is pure UI state for that screen, not anything worth persisting or
  // rolling into the very save code it's building) for what it wires up to.
  const SAVE_CODE_VERSION = 1;
  const SAVE_CODE_PREFIX = "LR"+SAVE_CODE_VERSION+":";
  let saveCodeOut = null;   // the code currently on display after "Get Save Code", or null
  let saveCodeIn = "";      // whatever's currently typed/pasted into the "Load Save Code" field
  let saveCodeMsg = null;   // {ok:bool, text} -- result of the last load attempt, or null
  let saveCodePanelOpen = false; // whether the title screen's Backup/Restore card is expanded
  // Arbitrary pasted text (saveCodeIn) has to round-trip back into a
  // template-literal innerHTML rebuild if a load attempt fails and the
  // screen re-renders with the player's own text still sitting in the box --
  // unlike everything else this file ever prints, that text is NOT ours, so
  // it isn't safe to trust it contains no "<", "&", etc. Nothing else in the
  // game needed this (every other on-screen string is either static copy or
  // a number), hence there's no shared helper for it already.
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, ch=>({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch]));
  }
  function buildSaveCode(){
    try{
      const bundle = { v: SAVE_CODE_VERSION, save: state, meta: loadMeta() };
      return SAVE_CODE_PREFIX + btoa(unescape(encodeURIComponent(JSON.stringify(bundle))));
    }catch(e){ return null; }
  }
  // Returns {ok:true} on success (state/meta are already swapped in and
  // saved by the time this returns) or {ok:false, text} with a
  // player-facing reason otherwise. Never throws -- every step that could
  // fail on a hand-edited or corrupted paste is guarded.
  function applySaveCode(code){
    if(typeof code!=="string" || !code.trim()) return { ok:false, text:"Paste a Save Code first." };
    const trimmed = code.trim();
    if(!trimmed.startsWith(SAVE_CODE_PREFIX)){
      return { ok:false, text: trimmed.startsWith("LR") && trimmed.includes(":")
        ? "That Save Code is from a different version of the game and can't be read here."
        : "That doesn't look like a Leading Roll Save Code." };
    }
    let bundle;
    try{
      bundle = JSON.parse(decodeURIComponent(escape(atob(trimmed.slice(SAVE_CODE_PREFIX.length)))));
    }catch(e){ return { ok:false, text:"That Save Code is corrupted -- couldn't read it." }; }
    if(!bundle || typeof bundle!=="object" || typeof bundle.save!=="object" || typeof bundle.meta!=="object"){
      return { ok:false, text:"That Save Code is corrupted -- couldn't read it." };
    }
    let migrated;
    try{ migrated = migrateLoadedState(bundle.save); }catch(e){ migrated = null; }
    if(!migrated) return { ok:false, text:"That Save Code's run couldn't be loaded -- it may be from an incompatible version." };
    state = migrated;
    saveMeta(bundle.meta);
    saveState();
    return { ok:true, text:"Save Code loaded -- your run and Era/cast progress are both restored." };
  }
  // The bucket key for a character's progress record. A run with no
  // character chosen at all (characterId null -- e.g. an old save from
  // before this feature, mid-run) gets its own shared bucket rather than
  // colliding with any real character's record.
  function metaKeyFor(characterId){ return characterId || "__none__"; }
  function unlockedEraIdxFor(characterId){
    const meta = loadMeta();
    const idx = meta[metaKeyFor(characterId)];
    return (typeof idx==="number" && idx>=0 && idx<DIFFICULTY_ORDER.length) ? idx : 0;
  }
  // Called right where a run is won (settleRound). Only advances the record
  // when the just-won run was played at EXACTLY this character's current
  // furthest-unlocked Era -- winning at an already-unlocked lower Era is a
  // valid (and sometimes strategic) replay, but it doesn't grant progress
  // toward the next one. Returns the newly-unlocked Era's id, or null if
  // nothing changed (already at the top, or the win didn't advance anything).
  function maybeUnlockNextEra(characterId, difficultyId){
    const key = metaKeyFor(characterId);
    const curIdx = unlockedEraIdxFor(characterId);
    const wonIdx = DIFFICULTY_ORDER.indexOf(difficultyId);
    if(wonIdx!==curIdx) return null;               // replayed a lower/older Era -- no change
    if(curIdx>=DIFFICULTY_ORDER.length-1) return null; // already at the top Era -- nothing left to unlock
    const meta = loadMeta();
    meta[key] = curIdx+1;
    saveMeta(meta);
    return DIFFICULTY_ORDER[curIdx+1];
  }

  // Casting gauntlet: the roster itself is gated now, on top of each
  // character's own Era progress above. Lives in the same "leadingRoll.meta"
  // store, under a reserved key that can never collide with a real character
  // id (every character id is a bare lowercase word; metaKeyFor's own
  // "__none__" fallback establishes the same double-underscore convention
  // for a non-character bucket) or with "__none__" itself.
  //
  // Only Gunslinger -- CHARACTER_ORDER[0] -- starts available; every other
  // lead is flat-out hidden from Casting Call (see renderCharacterSelect)
  // until unlocked. Unlocking is a strict one-at-a-time gauntlet, not a
  // shared pool: winning a Silent Film (Era 1, the easiest Era) run with
  // your CURRENT LAST lead -- and only that lead -- reveals the next name on
  // the list. Winning easy with an earlier, already-"spent" lead doesn't
  // skip you ahead, and there's nothing to win toward once every lead's
  // already been cast.
  const CHAR_UNLOCK_META_KEY = "__unlockedCharacterCount";
  function unlockedCharacterCount(){
    const meta = loadMeta();
    const n = meta[CHAR_UNLOCK_META_KEY];
    return (typeof n==="number" && n>=1 && n<=CHARACTER_ORDER.length) ? n : 1;
  }
  function characterUnlocked(characterId){
    const idx = CHARACTER_ORDER.indexOf(characterId);
    return idx>=0 && idx<unlockedCharacterCount();
  }
  // Called alongside maybeUnlockNextEra, right where a run is won. Returns
  // the newly-revealed character's id, or null if this particular win
  // didn't earn one (wrong lead, wrong Era, or the roster's already full).
  function maybeUnlockNextCharacter(characterId, difficultyId){
    const count = unlockedCharacterCount();
    if(count>=CHARACTER_ORDER.length) return null; // every lead's already cast
    if(difficultyId!==DIFFICULTY_ORDER[0]) return null; // has to be Era 1 specifically -- the "easiest difficulty"
    if(characterId!==CHARACTER_ORDER[count-1]) return null; // only your newest, still-unproven lead advances the gauntlet
    const meta = loadMeta();
    meta[CHAR_UNLOCK_META_KEY] = count+1;
    saveMeta(meta);
    return CHARACTER_ORDER[count];
  }

  /* ============ VECTOR ART (SVG, crisp at any size) ============ */

  const DIE_PIPS = {
    1:[[32,32]],
    2:[[20,20],[44,44]],
    3:[[20,20],[32,32],[44,44]],
    4:[[20,20],[44,20],[20,44],[44,44]],
    5:[[20,20],[44,20],[32,32],[20,44],[44,44]],
    6:[[20,17],[44,17],[20,32],[44,32],[20,47],[44,47]],
  };
  // Era-themed by default (see ERA_THEMES.dice); a tinted special die keeps
  // its own kind color so it still reads as that die at a glance.
  function dieFaceSVG(value, tint){
    let th = null; try{ th = ERA_THEMES[CUR_ERA].dice; }catch(e){}
    const face = tint || (th ? th.bg : '#f6ede0');
    const pip = tint ? '#1a0f14' : (th ? th.pip : '#241319');
    const edge = tint ? '#1c1016' : (th ? th.edge : '#1c1016');
    let rx = th ? th.rx : 14;
    if(document.documentElement.classList.contains("eight-bit")) rx = 2;
    const glow = !tint && th && th.glow;
    const flat = !tint && th && th.flat;
    const pts = DIE_PIPS[value] || DIE_PIPS[1];
    const pips = pts.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="6.2" fill="${pip}"${glow?` style="filter:drop-shadow(0 0 3px ${pip})"`:""}/>`).join("");
    return `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <rect x="3" y="3" width="58" height="58" rx="${rx}" fill="${face}" stroke="${edge}" stroke-width="3"${glow?` style="filter:drop-shadow(0 0 4px ${edge})"`:""}/>
      ${flat ? "" : `<ellipse cx="21" cy="16" rx="18" ry="9" fill="#fff" opacity="${th&&th.shine?0.4:0.22}"/><ellipse cx="43" cy="49" rx="20" ry="11" fill="#000" opacity="0.1"/>`}
      ${pips}
    </svg>`;
  }

  function chipSVG(tint){
    const c = tint || '#d8a94c';
    return `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <circle cx="32" cy="32" r="29" fill="${c}" stroke="#1c1016" stroke-width="3"/>
      <circle cx="32" cy="32" r="29" fill="none" stroke="#f3e7d2" stroke-opacity="0.4" stroke-width="2.5" stroke-dasharray="5 7"/>
      <circle cx="32" cy="32" r="19" fill="none" stroke="#1c1016" stroke-width="2" opacity="0.45"/>
      <ellipse cx="24" cy="21" rx="13" ry="7" fill="#fff" opacity="0.2"/>
    </svg>`;
  }

  // Lighten (pct>0) or darken (pct<0) a #rrggbb color for gradient stops.
  function shadeHex(hex, pct){
    const n = parseInt(hex.slice(1), 16);
    let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
    const t = pct<0 ? 0 : 255, p = Math.abs(pct);
    r = Math.round(r+(t-r)*p); g = Math.round(g+(t-g)*p); b = Math.round(b+(t-b)*p);
    return `#${((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}`;
  }

  // Shared bust illustration for table-side characters -- one silhouette,
  // dressed differently per role, shaded with soft gradients for depth.
  function bustSVG(o){
    const id = o.gradId||'x';
    const skinLt=shadeHex(o.skin,0.26), skinDk=shadeHex(o.skin,-0.16);
    const jktLt=shadeHex(o.jacket,0.24), jktDk=shadeHex(o.jacket,-0.32);
    const hairLt=shadeHex(o.hair,0.24), hairDk=shadeHex(o.hair,-0.1);
    return `<svg viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="sk${id}" x1="0.1" y1="0" x2="1" y2="0.9">
          <stop offset="0" stop-color="${skinLt}"/><stop offset="1" stop-color="${skinDk}"/>
        </linearGradient>
        <linearGradient id="jk${id}" x1="0.05" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="${jktLt}"/><stop offset="0.5" stop-color="${o.jacket}"/><stop offset="1" stop-color="${jktDk}"/>
        </linearGradient>
        <radialGradient id="hr${id}" cx="0.34" cy="0.2" r="0.9">
          <stop offset="0" stop-color="${hairLt}"/><stop offset="1" stop-color="${o.hair}"/>
        </radialGradient>
      </defs>
      <ellipse cx="60" cy="146" rx="48" ry="7" fill="#000" opacity="0.28"/>
      <path d="M15 150 C15 106 33 85 60 85 C87 85 105 106 105 150 Z" fill="url(#jk${id})"/>
      <path d="M15 150 C15 106 33 85 60 85 L60 150 Z" fill="#000" opacity="0.15"/>
      <path d="M44 89 L60 119 L76 89 L65 83 L55 83 Z" fill="#f6ede0"/>
      <path d="M60 119 L60 150 L47 150 Z" fill="#000" opacity="0.08"/>
      <path d="M44 89 L55 83 L60 92 Z" fill="${jktDk}"/>
      <path d="M76 89 L65 83 L60 92 Z" fill="${jktDk}"/>
      <rect x="49" y="63" width="22" height="27" rx="8" fill="url(#sk${id})"/>
      <ellipse cx="60" cy="38" rx="32" ry="26" fill="url(#hr${id})"/>
      <circle cx="60" cy="45" r="29" fill="url(#sk${id})"/>
      ${o.headwear||""}
      ${o.neckwear||""}
      <path d="M41 41 Q46 37 52 40" stroke="${hairDk}" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>
      <path d="M68 40 Q74 37 79 41" stroke="${hairDk}" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>
      <circle cx="49" cy="47" r="2.8" fill="#201018"/><circle cx="71" cy="47" r="2.8" fill="#201018"/>
      <path d="M49 61 Q60 67 71 61" stroke="#201018" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.7"/>
      <path d="M31 52 A29 29 0 0 1 34 34" stroke="#fff" stroke-width="1.8" fill="none" opacity="0.16" stroke-linecap="round"/>
      <path d="M17 145 C17 108 33 88 58 86" stroke="${jktLt}" stroke-width="1.6" fill="none" opacity="0.4" stroke-linecap="round"/>
      ${o.extra||""}
    </svg>`;
  }
  /* ============ SCORING ============ */

  // A die kind with a `faces` list (e.g. an even-only or a fixed-all-6s die)
  // draws uniformly from exactly those faces instead of a plain 1-6 -- see
  // DIE_KINDS. No face list falls back to the standard uniform d6. rollMod
  // (Loaded's reroll-a-low-value trick) still applies afterward either way.
  // `slot` ('a' or 'b') only matters for a manual die (Body Double) -- it's
  // which of state.manualPick's two values to read, since a manual die's
  // single dicePool entry gets asked about BOTH active slots (see
  // getActiveDice/fillsBothSlots). Every other die kind ignores it
  // entirely and rolls exactly as it always has.
  function rollOneDie(die, slot){
    const kind = die && DIE_KINDS[die.kind];
    let v;
    if(kind && kind.manual){
      const picked = state.manualPick && state.manualPick[slot];
      v = Math.max(1, Math.min(6, picked || 1));
    } else if(kind && kind.faces && kind.faces.length){
      v = kind.faces[Math.floor(Math.random()*kind.faces.length)];
    } else {
      v = 1+Math.floor(Math.random()*6);
    }
    if(kind && kind.rollMod) v = kind.rollMod(v);
    return v;
  }

  // What values a die is even allowed to land on -- the same face list
  // rollOneDie draws from, exposed separately so a scripted/forced roll
  // (Cold Open, Chekhov's Gun below) can pick from what's actually possible
  // instead of assuming a plain 1-6, which is exactly how a Tri Die could
  // land a scripted 6 before this fix.
  function dieFaces(die){
    const kind = die && DIE_KINDS[die.kind];
    return (kind && kind.faces && kind.faces.length) ? kind.faces : [1,2,3,4,5,6];
  }
  // (single-die roller above replaces the old fixed two-die rollDice() helper)

  function getActiveDice(){
    return state.selectedDiceIds.map(uid=>state.dicePool.find(d=>d.uid===uid)).filter(Boolean);
  }

  // True whenever Body Double is this scene's lineup -- gates the manual
  // Take A/Take B picker in renderPlay (see setManualPick) and nothing
  // else; rollOneDie itself just reads state.manualPick directly off
  // kind.manual, it doesn't call this.
  function bodyDoubleActive(){
    return getActiveDice().some(d=>{ const k = DIE_KINDS[d.kind]; return k && k.manual; });
  }

  function setManualPick(slot, val){
    if(!state.manualPick) state.manualPick = { a:1, b:1 };
    state.manualPick[slot] = Math.max(1, Math.min(6, val));
    render();
  }

  // Every winning bet -- Pass Line, odds, Field, Hardways, Dealer Bets --
  // pays out through here. It's the one place items and boss blinds can
  // react to a real payout: they mutate ctx.amount (a discount is negative,
  // a boost is positive or multiplicative) or tighten ctx.payoutCap. The
  // resolved amount is what actually lands in Score -- the live number
  // chasing this scene's Target -- never in Payroll; a bet win or loss
  // never touches Payroll at all (see beginScreening).
  function resolvePayout(opts){
    const baseAmount = opts.amount;
    if(!baseAmount) return 0;
    const ctx = {
      amount: baseAmount,
      stake: opts.stake!=null ? opts.stake : baseAmount,
      betType: opts.betType, number: opts.number, rolledSum: opts.rolledSum,
      // isDouble mirrors ctx.a===ctx.b from onRoll's own ctx, but a payout/
      // loss ctx never carried the individual dice -- only doRoll's shared
      // `roll` object did (see doRoll, which stamps roll.isDouble once up
      // front). Reading it back off opts.roll here is what lets a boss twist
      // like Doubles Off the Table react to a double at payout time, same as
      // it reacts to rolledSum for the parity/snake-eyes/boxcars twists.
      isDouble: !!(opts.roll && opts.roll.isDouble),
      isRepeatHand: !!opts.isRepeatHand, state, payoutCap: Infinity,
    };
    // Score-chain trace (cosmetic, see playChain): mark() only READS
    // ctx.amount after each hook and records how it moved -- it never
    // writes a number, so payouts are identical with or without it.
    const steps = []; let prevAmt = ctx.amount;
    const mark = (kind, label, key)=>{ if(ctx.amount!==prevAmt){ steps.push({ kind, label, key, from:prevAmt, to:ctx.amount }); prevAmt = ctx.amount; } };
    const boss = state.tierIdx===2 ? BOSS_BLINDS.find(x=>x.id===state.bossId) : null;
    if(boss && boss.onPayout){ boss.onPayout(ctx); mark("boss", boss.name, "boss"); }
    // Scoring order from here down is deliberately dice, then felt, then
    // perks (in whatever order the player's dragged them to, see
    // perkOrderSafe), then character (boss twists always go first, same as
    // every resolve function -- see resolveOnRoll's own comment on
    // state.bossDisabledSlot for why boss can never move). A rare die's own
    // payout multiplier (e.g. Payday Sixes, Odd Fortune) applies whenever
    // it's in the active lineup -- see DIE_KINDS' payoutMult.
    getActiveDice().forEach(d=>{
      const kind = DIE_KINDS[d.kind];
      if(kind && kind.payoutMult){ ctx.amount *= kind.payoutMult; mark("die", kind.name, "die"); }
      // Steel Die's own flat bonus -- kept as a separate field/step from
      // payoutMult above specifically so Leading Man (a Cast item) can
      // amplify just this one die's bonus without also touching Payday
      // Sixes/Odd Fortune/Tentpole Release, which use payoutMult for an
      // unrelated reason (their own face-pattern tradeoff). "Tripling the
      // bonus" means tripling the PORTION over 1x (0.5 -> 1.5, so 1.5x
      // becomes 2.5x), not the raw multiplier itself -- multiplying the raw
      // number by 3 would make a single Steel Die (1.5x) worth more than
      // TWO of them stacked together without Leading Man (2.25x), which
      // would make owning fewer Steel Dice better than owning more.
      if(kind && kind.steelMult){
        const leadingMan = state.equipped.cast && state.equipped.cast.id==="cast_leading_man";
        const bonusPortion = (kind.steelMult - 1) * (leadingMan ? 3 : 1);
        ctx.amount *= (1 + bonusPortion);
        mark("die", kind.name, "die");
      }
    });
    // Felt Upgrade: each bet zone has its own felt piece (see FELT_ZONES) --
    // a payout only gets a boost if THIS zone has been upgraded, not the
    // whole table at once. Independent of equipment, and stacks linearly
    // with every purchase of that zone (see feltCost/buyFeltZone). Runs
    // right after dice now -- it used to be the very last hook, after
    // perks and the character trait, moved up here so the table itself
    // (dice, then felt) always finishes shaping a payout before any
    // equipped perk or the character's own trait gets a turn.
    ctx.amount += feltBonusFor(ctx.betType, ctx.number);
    mark("felt", "Felt", "felt");
    // Director's Notes can shut down one equipped slot for this whole roll
    // (see BOSS_BLINDS/resolveOnRoll, which picks state.bossDisabledSlot
    // before any bet resolves) -- that slot's hooks just don't fire here.
    perkOrderSafe().forEach(slot=>{
      const item = state.equipped[slot];
      // ctx.triggers: how many perks/traits have already boosted this bet
      // (read by Hype Man, see EQUIPMENT_POOL) -- boss twists don't count,
      // but the dice and felt steps above now do, since both run before
      // perks.
      if(item && item.onPayout && slot!==state.bossDisabledSlot){ ctx.triggers = steps.filter(s=>s.kind!=="boss").length; item.onPayout(ctx); mark("slot", item.name, slot); }
    });
    // A character's own passive trait (see CHARACTERS), if it's payout-
    // shaped, runs last of all -- after dice, felt and every perk, same
    // order as resolveOnRoll -- it's not tied to any slot, so
    // state.bossDisabledSlot never touches it.
    const character = CHARACTERS[state.characterId];
    if(character && character.onPayout){ character.onPayout(ctx); mark("lead", character.name.replace(/^The /,""), "lead"); }
    const amount = Math.max(0, Math.round(Math.min(ctx.amount, ctx.payoutCap)));
    if(ctx.payoutCap < ctx.amount) steps.push({ kind:"cap", label:"Cap", key:"boss", from:ctx.amount, to:amount });
    state.score += amount;
    if(opts.roll){
      opts.roll.grossWin += amount;
      (opts.roll.trace = opts.roll.trace || []).push({ win:true, betType:opts.betType, bet:betLabelFor(opts.betType, opts.number), base:baseAmount, steps, final:amount });
    }
    return amount;
  }

  // Every losing bet pays out through here too -- items and boss blinds can
  // shrink ctx.amount (a discount on what you're about to lose) or set
  // ctx.push=true to cushion it into a full push instead (stake returns,
  // nothing lost). A loss pulls state.score straight back down -- since
  // Score IS the live number tracked toward the scene Target (see
  // beginScreening/checkRoundEnd), a big loss can undo real progress
  // toward the target, not just fail to add to it. Payroll is never at risk
  // here, whatever happens to Score.
  function resolveLossAmount(opts){
    const baseAmount = opts.amount;
    if(!baseAmount) return { amount:0, pushed:false };
    const ctx = {
      amount: baseAmount,
      stake: opts.stake!=null ? opts.stake : baseAmount,
      betType: opts.betType, number: opts.number, rolledSum: opts.rolledSum,
      isDouble: !!(opts.roll && opts.roll.isDouble),
      isRepeatHand: !!opts.isRepeatHand, state, push:false,
    };
    // Same read-only trace as resolvePayout: which hook (if any) turned
    // this loss into a push, for the score chain to show.
    let pushSrc = null;
    const boss = state.tierIdx===2 ? BOSS_BLINDS.find(x=>x.id===state.bossId) : null;
    if(boss && boss.onLoss){ boss.onLoss(ctx); if(ctx.push && !pushSrc) pushSrc = { label:boss.name, key:"boss" }; }
    // Perks (in the player's own drag order, see perkOrderSafe) before the
    // character's own trait, same as resolvePayout/resolveOnRoll -- this
    // used to run character-before-perks, the one resolve function out of
    // step with the other two, fixed here to match.
    perkOrderSafe().forEach(slot=>{
      const item = state.equipped[slot];
      if(item && item.onLoss && slot!==state.bossDisabledSlot){ item.onLoss(ctx); if(ctx.push && !pushSrc) pushSrc = { label:item.name, key:slot }; }
    });
    const character = CHARACTERS[state.characterId];
    if(character && character.onLoss){ character.onLoss(ctx); if(ctx.push && !pushSrc) pushSrc = { label:character.name.replace(/^The /,""), key:"lead" }; }
    if(ctx.push){
      if(opts.roll) (opts.roll.trace = opts.roll.trace || []).push({ push:true, bet:betLabelFor(opts.betType, opts.number), base:baseAmount, src:pushSrc });
      return { amount:0, pushed:true };
    }
    const amount = Math.max(0, Math.round(ctx.amount));
    state.score = Math.max(0, state.score - amount);
    if(opts.roll){
      opts.roll.grossLoss += amount;
      (opts.roll.trace = opts.roll.trace || []).push({ loss:true, bet:betLabelFor(opts.betType, opts.number), final:amount });
    }
    return { amount, pushed:false };
  }

  // Fires once per roll, regardless of any bet placed -- a die's own economy
  // effect (Gilded Die) and a handful of items/boss blinds pay out (or cost)
  // flat units here, untied to any specific bet. This is the only place a
  // number that was never bet on can still put units in the Budget.
  function resolveOnRoll(a, b, sum, hand, isRepeatHand, activeDice, roll){
    const ctx = { a, b, sum, hand, isRepeatHand, state, bonusAmount: 0 };
    // payrollGain accumulates separately from ctx.bonusAmount -- everything
    // ABOVE this line's sibling (bonusPerRoll et al) lands in Score, same as
    // a bet win would; a Per Diem Die and an Econ felt zone (see ECON_FELT_
    // ZONES below) are the only two things that ever put units straight into
    // Payroll from a roll, and neither runs through ctx.bonusAmount at all --
    // Payroll must never move just because betting had a good roll.
    let payrollGain = 0;
    // Read-only score-chain trace, same idea as resolvePayout's mark().
    const rsteps = []; let prevB = 0;
    const markB = (kind, label, key)=>{ if(ctx.bonusAmount!==prevB){ rsteps.push({ kind, label, key, from:prevB, to:ctx.bonusAmount }); prevB = ctx.bonusAmount; } };
    (activeDice||[]).forEach(d=>{
      const kind = DIE_KINDS[d.kind];
      if(kind && kind.bonusPerRoll){ ctx.bonusAmount += kind.bonusPerRoll; markB("die", kind.name, "die"); }
      if(kind && kind.payrollPerRoll) payrollGain += kind.payrollPerRoll;
    });
    // Econ felt zones: the "help Econ" half of the felt system (see
    // FELT_ZONES's score-boosting half, and ECON_FELT_ZONES's own comment) --
    // pays Payroll on a specific roll OUTCOME, independent of any bet riding
    // on it. Both kinds of felt level up completely independently, so a
    // single scene can trigger several of these on one roll.
    ECON_FELT_ZONES.forEach(zone=>{
      const lvl = feltLevelOf(zone.id);
      if(lvl>0 && zone.matches(a,b,sum,hand)) payrollGain += lvl*zone.rate;
    });
    if(payrollGain>0){
      addPayroll(payrollGain);
      if(roll) roll.payrollGain = (roll.payrollGain||0) + payrollGain;
    }
    const boss = state.tierIdx===2 ? BOSS_BLINDS.find(x=>x.id===state.bossId) : null;
    // Director's Notes (if this scene's boss) picks state.bossDisabledSlot
    // HERE, before the EQUIP_SLOTS loop just below -- resolveOnRoll always
    // fires first in doRoll, ahead of every resolvePayout/resolveLossAmount
    // call for this same roll, so the pick is already locked in by the time
    // any bet resolves.
    if(boss && boss.onRoll){ boss.onRoll(ctx); markB("boss", boss.name, "boss"); }
    // Same dice-then-perks-then-character order as resolvePayout (dice
    // already ran first, right at the top of this function, ahead of even
    // boss -- see that block's own comment; there's no felt step here since
    // Econ felt zones pay Payroll directly, above, rather than feeding
    // ctx.bonusAmount). Perks fire in the player's own drag order (see
    // perkOrderSafe) before the character's own onRoll (see CHARACTERS --
    // e.g. The Lovers stashing "was this roll a double" for their own
    // onPayout to read back).
    perkOrderSafe().forEach(slot=>{
      const item = state.equipped[slot];
      if(item && item.onRoll && slot!==state.bossDisabledSlot){ item.onRoll(ctx); markB("slot", item.name, slot); }
    });
    const character = CHARACTERS[state.characterId];
    if(character && character.onRoll){ character.onRoll(ctx); markB("lead", character.name.replace(/^The /,""), "lead"); }
    const amt = Math.round(ctx.bonusAmount);
    if(roll && rsteps.length) (roll.trace = roll.trace || []).push({ roll:true, win:amt>0, bet:"Every roll", base:0, steps:rsteps, final:amt });
    if(amt>0){
      state.score += amt;
      if(roll) roll.grossWin += amt;
    } else if(amt<0){
      state.score = Math.max(0, state.score + amt);
      if(roll) roll.grossLoss += -amt;
    }
    return amt;
  }

  /* ============ ACTIONS ============ */

  const HEAT_MAX = 6; // checkpoints cap out at 6 -- the Normal-difficulty, no-character default; see heatMaxFor for the actual cap in play
  const BIG_WIN_HEAT_THRESHOLD = 10; // net units in a single roll big enough to kick in a Heat checkpoint on its own -- first-pass number, easy to retune

  // Every checkpoint of Heat funnels through here, whatever the source --
  // clearing a scene, a rare hand, a hardway hit, a hot streak, a big payout
  // -- so Word of Mouth's doubling applies uniformly instead of being
  // hard-coded into just one gain site. Returns how much Heat actually
  // landed (0 if already capped, see heatMaxFor), so callers can tell
  // whether it's worth a callout.
  function gainHeat(amount){
    if(amount<=0) return 0;
    const cast = state.equipped.cast;
    const wordOfMouth = cast && cast.id==="cast_stand_in";
    const before = state.heat;
    state.heat = Math.min(heatMaxFor(), state.heat + (wordOfMouth ? amount*2 : amount));
    return state.heat - before;
  }

  // Called from the Difficulty Select screen, the last step before the run
  // actually begins -- state at this point is still the TITLE-screen state,
  // holding whatever pendingCharacterId/pendingDifficulty the two setup
  // screens before this one wrote onto it. Those have to be read off before
  // state gets replaced wholesale by freshState() (which zeroes them back
  // to null/"blockbuster"), then reapplied onto the new state.
  function startRun(){
    // A staged pick has to name a real character AND one this player's
    // actually unlocked -- renderCharacterSelect only ever wires up a click
    // handler for a visible (unlocked) tile, but a stale save/localStorage
    // edit could still leave pendingCharacterId pointing at a lead who
    // hasn't been cast yet. Falls back to no character trait rather than
    // honoring a pick nobody earned.
    const chosenCharacter = (state.pendingCharacterId && CHARACTERS[state.pendingCharacterId] && characterUnlocked(state.pendingCharacterId)) ? state.pendingCharacterId : null;
    // Default (nothing staged) is this character's own furthest-unlocked
    // Era, not a fixed "Normal" -- matches renderDifficultySelect's own
    // default. Clamped defensively against that same unlocked range even
    // when something WAS staged, in case pendingDifficulty is left over
    // from a different, further-progressed character (see
    // renderCharacterSelect, which normally clears it on every character
    // switch) or otherwise stale -- a run can never start at an Era this
    // character hasn't actually earned.
    const unlockedIdx = unlockedEraIdxFor(chosenCharacter);
    const stagedIdx = state.pendingDifficulty ? DIFFICULTY_ORDER.indexOf(state.pendingDifficulty) : -1;
    const chosenDifficulty = (stagedIdx>=0 && stagedIdx<=unlockedIdx) ? state.pendingDifficulty : DIFFICULTY_ORDER[unlockedIdx];
    beginRunAs(chosenCharacter, chosenDifficulty);
  }

  // Shared by startRun (fresh pick off the Casting Call / Era Select
  // screens) and retryRun (same lead, same Era, straight back onto the lot
  // after a loss) -- everything a run needs seeded before its first scene,
  // in one place, so the character-trait application below only ever lives
  // once.
  function beginRunAs(characterId, difficulty){
    state = freshState();
    state.characterId = characterId;
    state.difficulty = difficulty;
    // Starting-Payroll and starting-Heat traits apply once, right here,
    // before a single scene's stipend or Heat gain has happened --
    // everything else a character trait does (Retakes, Heat cap, Scene
    // Stipend, payouts/losses) is read dynamically off state.characterId
    // wherever it applies, so it never needs its own one-time setup step.
    // startPayroll (not startMoney -- no character uses this hook yet, but
    // a starting-cash trait belongs on the persistent currency, not on
    // Score, which beginScreening resets to the stipend seed a moment from
    // now regardless) is safe to set here since Payroll only ever grows
    // from here on, via +=.
    const character = CHARACTERS[characterId];
    if(character){
      if(character.startPayroll!=null) state.payroll = character.startPayroll;
      if(character.startHeatBonus) state.heat = Math.min(heatMaxFor(), state.heat + character.startHeatBonus);
    }
    state.screen="play";
    beginScreening();
    render(); saveState();
  }

  // Retry: same lead, same Era that just wrapped, straight back into a
  // fresh run -- no trip back through Casting Call / Era Select. Only ever
  // wired up from the loss screen (see renderEnd), so there's always a
  // characterId/difficulty on state to carry over.
  function retryRun(){
    beginRunAs(state.characterId, state.difficulty);
  }

  // Restores every sidelined die's real kind (see maybeLoseDie -- it swaps a
  // die to a Standard stand-in for the rest of the scene it rolled off the
  // table in) and clears the sideline list. Safe to call more than once --
  // an empty (or already-restored) list is a no-op -- so both settleRound
  // (right before the shop offers get rolled -- see its own call below) and
  // beginScreening (the original, only call site) can each call it without
  // stepping on the other. Pulling this in at settleRound matters because
  // the Dice Shop's own "write off which die?" picker (renderShop) reads
  // straight off state.dicePool[*].kind -- without this, a die lost last
  // scene still shows there as a plain Standard Die (looking gone for good)
  // for the whole shop visit, since beginScreening's own restore doesn't
  // run until the NEXT scene actually starts, well after the shop closes.
  function restoreSidelinedDice(){
    (state.sidelinedDice||[]).forEach(s=>{
      const d = state.dicePool.find(x=>x.uid===s.uid);
      if(d) d.kind = s.kind;
    });
    state.sidelinedDice = [];
  }

  function beginScreening(){
    try{ onSceneStartEgg(); }catch(e){}
    // retakesLeft is deliberately NOT reset here any more -- it's a bought
    // stock now (see buyRetake), not a free per-scene baseline, and carries
    // over from whatever it was at the end of the last scene.
    state.freeRetakeUsedThisScene = false;
    state.timeTravelerBoostPending = false;
    state.rollNumber = 0;
    state.lastRoll = null;
    state.log = [];
    // NOT reset to null here any more -- see freshState's comment on
    // state.bossId. It's drawn once below, at tierIdx 0, and deliberately
    // left alone for the rest of the ante (tierIdx 1 and 2) so it survives
    // this same per-scene reset at Rehears-Roll and the boss round itself.
    state.point = null;
    state.roundComplete = false;
    state.roundCompleteEarly = false;
    state.lineBet = null;
    state.fieldBet = 0;
    state.hardBets = { 4:0, 6:0, 8:0, 10:0 };
    state.hardResolutions = [];
    state.propBets = { anySeven:0, anyCraps:0, snakeEyes:0, boxcars:0 };
    state.propResolutions = [];
    state.placeBets = { 4:0, 5:0, 6:0, 8:0, 9:0, 10:0 };
    state.placeResolutions = [];
    state.comeBet = { amount:0 };
    state.comeBets = { 4:0, 5:0, 6:0, 8:0, 9:0, 10:0 };
    state.comeResolutions = [];
    state.comeBetNote = null;
    state.dontComeBet = { amount:0 };
    state.dontComeBets = { 4:0, 5:0, 6:0, 8:0, 9:0, 10:0 };
    state.dontComeResolutions = [];
    state.dontComeBetNote = null;
    state.lastBetNote = null;
    state.lastFieldNote = null;
    state.lastDieLostMsg = null;
    state.pendingSelect = [];
    // Restore every sidelined die's real kind before wiping the list -- see
    // restoreSidelinedDice(). Usually already a no-op by the time this runs
    // now: settleRound calls it first, right when the shop opens, so this
    // is just the defensive second call for any path into a new scene that
    // doesn't go through the shop.
    restoreSidelinedDice();
    state.dieLostPrompt = null;
    state.dieLostReturnPhase = null;
    // Scene Stipend does double duty here -- see sceneStipendFor. It's the
    // fresh Score you're handed to bet with this scene, REPLACING whatever
    // Score was left over (Score never carries from one scene to the next,
    // by design -- that's what keeps it, and the Target it chases, from
    // compounding into the huge numbers a run used to grow into). And the
    // same amount also lands in Payroll, permanently, on top of whatever
    // Payroll you already had (Payroll only ever grows outside the shop).
    // Runs before clampStake so this scene's stake ceiling reflects it.
    state.lastSceneStipend = sceneStipendFor(state.ante);
    state.score = state.lastSceneStipend;
    addPayroll(state.lastSceneStipend);
    // Target is an ABSOLUTE line drawn from that same seed using the same
    // growth curve targetFor always used. Win bets and Score climbs toward
    // that line; lose bets and it falls back -- same number the whole way,
    // see checkRoundEnd.
    state.target = state.lastSceneStipend + targetFor(state.ante, state.tierIdx);
    state.stake = clampStake(state.stake || 1);
    state.rollsSincePoint = 0;
    state.plotArmorUsed = false;
    state.scriptNote = null;
    state.castNote = null;
    state.bossDisabledSlot = null;
    state.bossNote = null;
    state.doublesThisScene = 0;
    state.photoFinishUsed = false;
    state.lastRollWasSeven = false; // Franchise Fatigue resets per scene, same as Cold Open/Chekhov's Gun/Plot Armor above
    // Same per-scene reset as lastRollWasSeven just above, for the same
    // reason: a fresh table means the "how long since a seven or a repeat"
    // clock (see maybeLoseDie/DIE_RISK_STREAK_GROWTH) starts back at zero
    // rather than carrying a hot streak in from the scene that just ended.
    state.dieRiskStreak = 0;
    state.dieRiskSeenSums = [];
    state.removeMode = false; // see freshState's own comment -- never carries into a fresh table
    state.betUnit = 1; // chip denomination never carries into a fresh table either -- see freshState's own comment on betUnit
    // Heat, stuntDoubleUsed and winStreak are run-wide, not scene-wide --
    // deliberately not reset here.
    if(state.dicePool.length<=2){
      state.selectedDiceIds = state.dicePool.map(d=>d.uid);
      state.phase = "comeout";
    } else {
      state.selectedDiceIds = [];
      state.phase = "select";
    }
    if(state.tierIdx===0){
      // Draw THIS ANTE's boss now, at Read Through, instead of waiting
      // until the Director's Cut round itself -- see freshState's comment
      // on state.bossId. It's revealed here so every screen for the rest
      // of the ante (both shop visits, all three Next Up previews) can show
      // it, giving you the whole ante -- not just the boss round's own
      // last-second preview -- to actually shop for it.
      const pool = bossPoolFor();
      // Never draw a boss this run has already seen while there's still an
      // unseen one available (the actual bug report this fixes: the same
      // boss coming up more than once in one run) -- same "bag, refill on
      // empty" shape as drawEquipOffer's own no-repeat draw. The bag empties
      // once every currently-unlocked boss has shown up (which, in Endless
      // -- see state.endlessMode -- it eventually will, repeatedly), and
      // clearing it back to [] just starts a fresh lap through the same
      // pool rather than ever forcing a true repeat while an unseen option
      // still exists.
      let unseen = pool.filter(b=>!state.seenBossIds.includes(b.id));
      if(!unseen.length){ state.seenBossIds = []; unseen = pool; }
      const boss = unseen[Math.floor(Math.random()*unseen.length)];
      state.bossId = boss.id;
      state.seenBossIds.push(boss.id);
    } else if(state.tierIdx===2 && state.bossId){
      // This ante's boss was already picked back at Read Through (above)
      // and has just been sitting in state.bossId, previewed but otherwise
      // inert, through Rehears-Roll -- this is the moment its twist
      // actually takes hold, so a retake-adjusting boss (Recast Rumors and
      // the like) doesn't quietly cost or grant a Retake during either of
      // the two earlier rounds it was only being ADVERTISED in.
      const boss = BOSS_BLINDS.find(b=>b.id===state.bossId);
      if(boss && boss.retakeAdjust) state.retakesLeft = Math.max(0, state.retakesLeft + boss.retakeAdjust);
    }
  }

  // A die whose kind is fillsBothSlots (Body Double, the one legendary --
  // see DIE_KINDS) answers for the WHOLE "Pick 2" lineup by itself, so
  // selecting it replaces whatever else was pending instead of sharing a
  // slot alongside it, and picking anything else while it's pending bumps
  // it back out first.
  function toggleDieSelect(uid){
    if(state.phase!=="select") return;
    const die = state.dicePool.find(d=>d.uid===uid);
    const kind = die && DIE_KINDS[die.kind];
    const idx = state.pendingSelect.indexOf(uid);
    if(idx>=0){ state.pendingSelect.splice(idx,1); }
    else if(kind && kind.fillsBothSlots){
      state.pendingSelect = [uid];
    } else {
      const doubleIdx = state.pendingSelect.findIndex(id=>{
        const d = state.dicePool.find(x=>x.uid===id);
        const k = d && DIE_KINDS[d.kind];
        return k && k.fillsBothSlots;
      });
      if(doubleIdx>=0) state.pendingSelect = [];
      if(state.pendingSelect.length>=2) state.pendingSelect.shift();
      state.pendingSelect.push(uid);
    }
    render();
  }

  function confirmLineup(){
    const soloPick = state.pendingSelect.length===1 ? state.dicePool.find(d=>d.uid===state.pendingSelect[0]) : null;
    const soloKind = soloPick && DIE_KINDS[soloPick.kind];
    const fillsBoth = !!(soloKind && soloKind.fillsBothSlots);
    if(!(state.pendingSelect.length===2 || fillsBoth)) return;
    state.selectedDiceIds = fillsBoth ? [soloPick.uid, soloPick.uid] : [...state.pendingSelect];
    // A die-loss interrupt reuses this same picker mid-scene (see
    // maybeLoseDie), so only fall back to a fresh come-out when this is
    // genuinely the start of a scene. Otherwise put the board back exactly
    // where the lost roll found it -- still on the same point, mid-point --
    // instead of wiping it back to "no point is on".
    if(state.dieLostReturnPhase){
      state.phase = state.dieLostReturnPhase;
      state.dieLostReturnPhase = null;
    } else {
      state.phase = "comeout";
    }
    render(); saveState();
  }

  // Betting uses plain units throughout -- there is no dollar conversion
  // anywhere in the game, and placing/holding a bet never actually spends
  // Score (only a shop purchase spends Payroll).
  function clampStake(v){
    const maxUnits = Math.max(0, state.score);
    return Math.max(maxUnits>0?1:0, Math.min(maxUnits, v));
  }

  // Score is the total units allowed on the TABLE at once, not a per-zone
  // allowance -- every zone shares one pool. totalExposure() sums every
  // unit currently riding anywhere on the layout (Pass/Don't Pass, odds
  // behind it, Field, every Hardway, every Prop, every Dealer Bet);
  // roomLeft() is what's still free to bet with, table-wide, right now.
  // Read fresh every time a bet is about to grow -- nothing here mutates
  // state.
  function totalExposure(){
    let total = 0;
    if(state.lineBet){ total += state.lineBet.amount||0; total += state.lineBet.odds||0; }
    total += state.fieldBet||0;
    [4,6,8,10].forEach(n=>{ total += (state.hardBets && state.hardBets[n]) || 0; });
    ["anySeven","anyCraps","snakeEyes","boxcars"].forEach(k=>{ total += (state.propBets && state.propBets[k]) || 0; });
    [4,5,6,8,9,10].forEach(n=>{ total += (state.placeBets && state.placeBets[n]) || 0; });
    total += (state.comeBet && state.comeBet.amount) || 0;
    [4,5,6,8,9,10].forEach(n=>{ total += (state.comeBets && state.comeBets[n]) || 0; });
    total += (state.dontComeBet && state.dontComeBet.amount) || 0;
    [4,5,6,8,9,10].forEach(n=>{ total += (state.dontComeBets && state.dontComeBets[n]) || 0; });
    return total;
  }
  function roomLeft(){
    return Math.max(0, state.score - totalExposure());
  }

  // Every bet zone's tap adds a unit; a press-and-hold instead shows what
  // that zone does (see wireHoldTip in the RENDER section) rather than
  // clearing it -- "Clear All Bets" in the bet panel is the one way to pull
  // bets back off the table now. The clear* functions below still exist and
  // are still exercised directly by tests, they're just no longer wired to
  // an individual zone's own hold gesture. A tap adds state.betUnit units at
  // once (bumped via the chip-denomination picker on the felt, which scales
  // with the Budget -- see betUnitTiers) rather than always just 1, so
  // building up a big bet doesn't mean tapping dozens of times.
  // Clamped against roomLeft() -- the shared table-wide ceiling, not this
  // zone's own balance -- so a tap that would push the WHOLE layout past
  // the Budget only adds as much as still fits, and a tap with no room
  // left anywhere does nothing at all.
  function addBetUnit(getAmount, setAmount){
    const inc = Math.max(1, Math.round(state.betUnit)||1);
    const grow = Math.min(inc, roomLeft());
    if(grow<=0) return;
    setAmount(getAmount()+grow);
    render(); saveState();
  }
  function setBetUnit(n){
    state.betUnit = Math.max(1, Math.round(n)||1);
    render(); saveState();
  }
  // The chip-denomination picker on the felt (see betunit-row in renderPlay)
  // scales with Score instead of sitting at flat 1/5/10/25 forever -- a
  // Score seeded well into a later Act's stipend can be sizable, and still
  // tapping in units of 25 there means dozens of taps to build up a real
  // bet. Four rough tiers -- 1u, then 5%/10%/25% of Score -- deduped and
  // floored at 1u each, so a small Score just collapses down to however
  // many distinct steps actually make sense (often just 1u early on)
  // rather than offering four buttons that all round to the same tiny
  // number.
  function betUnitTiers(){
    const m = Math.max(0, state.score);
    const raw = [1, Math.round(m*0.05), Math.round(m*0.10), Math.round(m*0.25)];
    const out = [];
    let last = 0;
    raw.forEach(v=>{
      v = Math.max(1, m>0 ? Math.min(m, v) : 1);
      if(v>last){ out.push(v); last = v; }
    });
