    // beginScreening() can put that back at the start of the NEXT scene.
    // Buying a new kind for that exact slot should overwrite it for good --
    // drop the stale sidelined entry too, or beginScreening would flip this
    // die right back to its pre-sideline kind the moment the next scene
    // starts, silently discarding the purchase.
    state.sidelinedDice = (state.sidelinedDice||[]).filter(s=>s.uid!==dieUid);
    state.shopOffers[idx] = null;
    state.pendingDiceBuy = null;
    render(); saveState();
  }

  // A perk carrying requiresDieKind (e.g. Leading Man -- see its own
  // comment in EQUIPMENT_POOL) does nothing at all until you own a die of
  // that kind, so it has no business showing up in the shop before then --
  // it would just be a dead slot. True the instant a real die of that kind
  // sits anywhere in state.dicePool, sidelined-this-scene ones included
  // (settleRound restores those before the shop even rolls -- see
  // restoreSidelinedDice -- so this never sees the temporary Standard
  // stand-in maybeLoseDie leaves behind mid-scene).
  function dieOwnedFor(item){
    return !item.requiresDieKind || state.dicePool.some(d=>d.kind===item.requiresDieKind);
  }
  // Draws one item id for `slot` from its shuffled bag, refilling and
  // reshuffling from the full pool for that type whenever the bag runs dry.
  // Skips the currently-equipped item when another option is available in
  // the bag, so the shop doesn't immediately re-offer what you're already
  // wearing -- a soft preference, not a hard rule, so the equipped item can
  // still come back up once nothing else in the bag is eligible. A
  // die-locked perk you don't own (dieOwnedFor) is a hard rule instead: it
  // never gets drawn, full stop, even as a last resort. It stays in the bag
  // rather than getting discarded, so buying that die later puts it right
  // back in the running on some future draw. Tries the current bag first,
  // then one fresh full reshuffle if that pass found nothing eligible at
  // all (every remaining entry either equipped or an unowned die-lock) --
  // one retry is enough given how small a slice of any pool is ever
  // die-locked. If even a fresh reshuffle comes up empty (every item in the
  // whole pool for this slot is a die-locked perk for a die nobody owns),
  // this slot simply offers no perk this visit rather than break the rule
  // -- rollShopOffers/buyShopOffer already treat a null item as "sold".
  function drawEquipOffer(slot, excludeId){
    if(!state.equipOfferBags) state.equipOfferBags = { film:[], script:[], lens:[], cast:[] };
    const idOf = id => EQUIPMENT_POOL.find(i=>i.id===id);
    const freshBag = ()=>{
      const b = EQUIPMENT_POOL.filter(i=>i.type===slot).map(i=>i.id);
      for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; }
      return b;
    };
    if(!state.equipOfferBags[slot] || !state.equipOfferBags[slot].length) state.equipOfferBags[slot] = freshBag();
    for(let pass=0; pass<2; pass++){
      const bag = state.equipOfferBags[slot];
      let idx = bag.findIndex(id=>id!==excludeId && dieOwnedFor(idOf(id)));
      if(idx<0) idx = bag.findIndex(id=>dieOwnedFor(idOf(id))); // equipped item OK as a last resort; an unowned die-lock never is
      if(idx>=0){ const id = bag.splice(idx,1)[0]; return idOf(id) || null; }
      state.equipOfferBags[slot] = freshBag();
    }
    return null;
  }

  // The unified shop roll: exactly 3 slots, each independently landing on a
  // Felt, Dice or Production Kit (perk) offer -- replaces the old
  // rollEquipOffers/rollFeltOffers/rollDiceOffers three-separate-sections
  // roll with one shared one. usedFeltIds/usedDieKinds/usedEquipTypes keep
  // this one visit from offering the same underlying zone/die/equip-type
  // twice across its 3 slots (equip types can't collide anyway -- only 4
  // types exist and at most 3 slots ever roll "perk" -- but felt/die pools
  // are drawn from the same anti-repeat machinery either way).
  function rollShopOffers(){
    const usedFeltIds = [], usedDieKinds = [], usedEquipTypes = [];
    const kinds = ["felt","die","perk"];
    return [0,1,2].map(()=>{
      const kind = kinds[Math.floor(Math.random()*kinds.length)];
      if(kind==="felt"){
        const zoneId = pickFeltZone(usedFeltIds);
        if(!zoneId) return null;
        usedFeltIds.push(zoneId);
        return { kind:"felt", zoneId };
      }
      if(kind==="die"){
        const dieKind = pickDieKind(usedDieKinds);
        if(!dieKind) return null;
        usedDieKinds.push(dieKind);
        return { kind:"die", dieKind };
      }
      const available = EQUIP_SLOTS.filter(s=>!usedEquipTypes.includes(s));
      const slot = (available.length ? available : EQUIP_SLOTS)[Math.floor(Math.random()*(available.length ? available.length : EQUIP_SLOTS.length))];
      usedEquipTypes.push(slot);
      const current = state.equipped[slot];
      const item = drawEquipOffer(slot, current ? current.id : null);
      if(!item) return null;
      return { kind:"perk", slot, item:{...item} };
    });
  }

  // Dispatches a shop-slot purchase by offer kind. Felt offers stay on the
  // card after buying (same "repurchase to level up further, same visit"
  // behavior the old Felt section always had -- see buyFeltZone); perk and
  // die offers clear the slot once bought, same as the old sections did.
  function buyShopOffer(idx){
    const offer = state.shopOffers[idx];
    if(!offer) return;
    if(offer.kind==="felt"){
      buyFeltZone(offer.zoneId); // buyFeltZone does its own payroll check and doesn't clear the slot
      return;
    }
    if(offer.kind==="die"){
      startBuyDie(idx); // opens the "write off which die?" picker; completeBuyDie clears the slot
      return;
    }
    if(offer.kind==="perk"){
      const item = offer.item;
      if(state.payroll < item.cost) return;
      state.payroll -= item.cost;
      state.equipped[offer.slot] = {...item};
      // The Extra's one-time dicePool grant -- see its own comment in
      // EQUIPMENT_POOL for why this is a permanent push here rather than a
      // while-equipped hook. extraDieSlotGranted keeps a second purchase
      // (after swapping it back out and it coming up again) from stacking
      // a second bonus die.
      if(item.id==="cast_the_extra" && !state.extraDieSlotGranted){
        state.dicePool.push({ uid:"die"+state.nextDieUid, kind:"standard" });
        state.nextDieUid += 1;
        state.extraDieSlotGranted = true;
      }
      state.shopOffers[idx] = null;
      render(); saveState();
    }
  }

  // The one shared reroll for all 3 shop slots at once -- replaces the old
  // dice-only rerollShop (Production Kit and Felt used to be one-offer-per-
  // visit, take it or leave it; now every slot can be rerolled together).
  function rerollShop(){
    if(state.payroll < state.shopRerollCost) return;
    state.payroll -= state.shopRerollCost;
    state.shopRerollCost += 1;
    state.hustlerRerollsBought = (state.hustlerRerollsBought||0) + 1; // Hustler's own payout hook reads this back -- see CHARACTERS; a no-op for anyone else
    state.pendingDiceBuy = null;
    state.shopOffers = rollShopOffers();
    render(); saveState();
  }

  // Buy one Retake, shop-only -- same "buy, cost climbs" shape as
  // rerollShop() just above (see RETAKE_SHOP_BASE_COST). What you buy stays
  // bought: retakesLeft carries into the next scene rather than resetting,
  // so stocking up here is the only way to have one on hand mid-scene.
  function buyRetake(){
    if(state.screen!=="shop") return;
    if(state.payroll < state.retakeBuyCost) return;
    state.payroll -= state.retakeBuyCost;
    state.retakesLeft += 1;
    state.retakeBuyCost += 1;
    render(); saveState();
  }

  // From the shop, the run doesn't drop straight back into rolling -- it
  // stops on a "Next Up" screen first (see renderBlindSelect) so you can see
  // what the upcoming round is before committing. beginScreening() already
  // computes the round's target and (on a boss round) its boss ahead of
  // time, so the preview screen just reads off state, same as the play
  // screen would.
  function nextScreening(){
    state.screen = "blindselect";
    beginScreening();
    render(); saveState();
  }

  // "Action!" on the Next Up screen -- commits to the round just previewed
  // and drops into the actual play screen. beginScreening() has already run
  // (in nextScreening), so there's nothing left to set up here.
  function actionRoll(){
    if(state.screen!=="blindselect") return;
    state.screen = "play";
    render(); saveState();
  }

  function gameOver(reason){
    state.screen = "end";
    state.won = false;
    if(reason) state.gameOverReason = reason;
    render(); saveState();
  }

  function restart(){
    try{ localStorage.removeItem("leadingRoll.save"); }catch(e){}
    state = freshState();
    render(); saveState();
  }

  // Called the instant the round ends with something still unresolved on
  // the table -- a point-riding line bet (and any odds behind it), a
  // hardway, or a dealer bet the point cycle never got back around to.
  // Those only resolve on their own number or a seven, so once the target's
  // hit we're not going to force more rolls just to wait one out -- it gets
  // pushed instead: stake back, no win or loss, same as barring the 12.
  // (Score itself is untouched here -- a bet's stake is only ever deducted
  // at the moment it LOSES, never when it's placed, so a push that never
  // resolves either way simply never touches state.score.)
  function pushOutstandingBets(){
    if(state.lineBet){
      state.lastBetNote = { push:true, amount:state.lineBet.amount, odds:state.lineBet.odds||0, label: state.lineBet.type==="pass"?"Pass Line":"Don't Pass", reason:"scene wrapped" };
      state.lineBet = null;
    }
    [4,6,8,10].forEach(n=>{
      const amount = state.hardBets[n];
      if(!amount) return;
      state.hardResolutions.push({ push:true, number:n, amount });
      state.hardBets[n] = 0;
    });
    [4,5,6,8,9,10].forEach(n=>{
      const amount = state.placeBets[n];
      if(!amount) return;
      state.placeResolutions.push({ push:true, number:n, amount });
      state.placeBets[n] = 0;
    });
    [4,5,6,8,9,10].forEach(n=>{
      const amount = state.comeBets && state.comeBets[n];
      if(!amount) return;
      state.comeResolutions.push({ push:true, number:n, amount });
      state.comeBets[n] = 0;
    });
    if(state.comeBet && state.comeBet.amount){
      state.comeBetNote = { push:true, amount:state.comeBet.amount };
      state.comeBet = { amount:0 };
    }
    [4,5,6,8,9,10].forEach(n=>{
      const amount = state.dontComeBets && state.dontComeBets[n];
      if(!amount) return;
      state.dontComeResolutions.push({ push:true, number:n, amount });
      state.dontComeBets[n] = 0;
    });
    if(state.dontComeBet && state.dontComeBet.amount){
      state.dontComeBetNote = { push:true, amount:state.dontComeBet.amount };
      state.dontComeBet = { amount:0 };
    }
  }

  /* Called after every roll. The instant the target's cleared, the
     scene is over -- full stop, whatever's still out on the table.
     A seven-out already resolves every bet as part of its own handling
     above (that's what a seven-out IS), so there's nothing left to push in
     that case; short of a seven-out, ending on the spot can still catch a
     bet mid-flight, which pushOutstandingBets() returns rather than
     dragging the scene out over an incidental side bet.
     Clearing the target no longer jumps straight to the shop mid-render
     either -- that landed as abrupt, easy to hit the target and not even
     notice before the shop's already on screen. Instead we pause here: the
     dice and Roll/Retake controls disappear, the final roll's result stays
     up, and a "Take 5" button (see takeFive() below) is what actually calls
     settleRound() and moves on, whenever the player's ready.

     A crap-out short of the target no longer hands the dice to a Stand-In
     either. Once betting was the only thing that could ever move Score, an
     NPC auto-rolling with nothing riding on the table couldn't actually
     make progress, so there was no real point pretending it could. Heat
     cushions the crap-out when it can: a checkpoint (or a free Stunt Double
     shield) gets spent and a note shows it happened -- but it's flavor and
     a resource cost (Breakout Role still pays out on it, Word of Mouth
     still snowballs toward it), not a survival mechanic any more. What this
     roll's bets just lost stays lost either way (state.score already
     reflects it, from resolveLossAmount/resolveOnRoll above); Score IS the
     scene's live progress toward Target (see beginScreening), so that loss
     can genuinely set it back, the same as it would on any other roll.

     A seven can no longer end the run by itself. Running out of Heat (and
     any shield) on a crap-out used to risk a hard game over on the spot,
     with a Retake as the only possible reprieve -- that whole branch is
     gone. Now a seven-out with nothing left to cushion it just plays out
     exactly like any other lost roll: the point's already reset to
     come-out (see doRoll, above, before this function is even called), and
     the scene carries straight on to the next roll. A run now ends one of
     two ways: checkBudgetOut, just below -- Score (Budget) hitting 0 -- or
     checkRollCapOut, further down -- MAX_ROLLS_PER_SCENE rolls spent
     without ever reaching Target. A seven-out can still be what drains
     Score to 0, or what eats up the rolls that run out the cap, same as
     any other lost bet can, but it's never the seven-out ITSELF that ends
     the run. None of this ever touches Payroll either way. */
  function checkRoundEnd(sevenOut, roll){
    if(state.screen!=="play") return;
    if(sevenOut){
      if(state.score>=state.target){
        pushOutstandingBets();
        state.roundComplete = true;
        state.roundCompleteEarly = false; // used all your rolls to get there -- no unused-retake bonus
        onSceneCleared();
        render(); saveState();
      } else {
        const cast = state.equipped.cast;
        const shielded = cast && cast.id==="cast_veteran" && !state.stuntDoubleUsed;
        if(shielded) state.stuntDoubleUsed = true;
        if(shielded || state.heat>0){
          if(!shielded) state.heat -= 1;
          let note = shielded
            ? "Stunt Double takes the fall — no checkpoint spent"
            : "Heat cushions the crap-out — "+state.heat+" left on the board";
          if(cast && cast.id==="cast_breakout"){
            const bonus = 2*state.heat;
            state.score += bonus;
            note += " &middot; Breakout Role pays out +"+fmtU(bonus)+"u";
          }
          // Append rather than overwrite: an Any 7 prop bet can now win on
          // this very roll (it's the one bet that pays out BECAUSE of the
          // seven), so doRoll may already have set a mid-roll Heat note
          // (e.g. a big payout) before we ever got here -- don't clobber it.
          const cushionNote = note+".";
          state.castNote = state.castNote ? (state.castNote+" &middot; "+cushionNote) : cushionNote;
        }
        // No Heat and no shield: nothing to spend, nothing to cushion --
        // and, per this function's own header comment, nothing to end
        // either. The seven-out already did whatever it was going to do to
        // Score (see doRoll, before this function was ever called); the
        // scene just carries on to the next roll from here.
        render(); saveState();
      }
      return;
    }
    if(state.score < state.target) return;
    pushOutstandingBets();
    state.roundComplete = true;
    state.roundCompleteEarly = true; // wrapped clean, with rolls to spare -- unused retakes pay a bonus
    onSceneCleared();
    render(); saveState();
  }

  // A Score of exactly 0 is one of the two ways a run ends now -- see
  // checkRoundEnd's own header comment: a seven-out can no longer end the
  // run by itself, whatever Heat is or isn't on the board, so running out
  // of Budget is a real loss condition (the other is checkRollCapOut, just
  // below). Score only ever drops from an actual bet LOSING (see
  // resolveLossAmount) or a negative resolveOnRoll effect (e.g. Budget
  // Cuts), never from placing a bet -- so this only ever fires off a real
  // loss, not a voluntary shop spend (which draws on Payroll, an entirely
  // separate pool that has no bearing on this check at all). Call this once
  // per roll, after every bet's resolved AND after checkRoundEnd has had
  // its own turn -- Heat's cushion (when it applies at all) doesn't refund
  // anything, so a crap-out that drains Score all the way to 0 still ends
  // the run right here even with Heat to spare. Skipped while the scene you
  // just finished is paused on "Take 5" (state.roundComplete) -- the next
  // scene's own fresh Score seed is about to replace this one, not another
  // empty table.
  function checkBudgetOut(){
    if(state.screen==="play" && !state.roundComplete && state.score<=0){
      gameOver("Ran out of Budget — no units left to bet.");
    }
  }

  // The pacing backstop (see MAX_ROLLS_PER_SCENE) -- called right after
  // checkBudgetOut, same as checkBudgetOut is called right after
  // checkRoundEnd, so a genuine bust on the roll that also happens to hit
  // the cap still ends the run via the budget check instead of this one
  // (checkBudgetOut already flipped state.screen away from "play" by the
  // time this runs, so the guard below skips it automatically).
  //
  // This used to just wrap the scene short -- same shop-base/interest
  // payout a real clear pays, straight on to the next scene -- with
  // whatever Score had been built standing in for a real clear. That made
  // grinding out the cap a complete non-event: no penalty for never
  // reaching Target, same reward either way. It's a real loss now, the
  // same shape as checkBudgetOut: reaching this many rolls without ever
  // reaching Target ends the run on the spot, exactly like Score hitting 0
  // does. checkRollCapOut only ever fires when Score is still short of
  // Target (checkRoundEnd already wraps the scene as a genuine clear, and
  // returns before this can run, the moment Score reaches Target -- see its
  // own final branch above), so there's no "hit the cap after already
  // winning" case to special-case here.
  function checkRollCapOut(){
    if(state.screen==="play" && !state.roundComplete && state.rollNumber>=MAX_ROLLS_PER_SCENE){
      gameOver("Ran out of takes — " + MAX_ROLLS_PER_SCENE + " rolls spent without wrapping the scene.");
    }
  }

  // Every scene cleared banks a Heat checkpoint too, on top of whatever
  // doRoll's mid-roll triggers already earned this scene -- routine enough
  // that it doesn't need its own callout. Breakout Role no longer lives
  // here -- it now pays out whenever Heat actually cushions a crap-out (see
  // checkRoundEnd), which is the moment that calls for a "breakout" any more.
  function onSceneCleared(){
    gainHeat(1);
  }

  // The only way out of a completed round: hands off to settleRound() with
  // whichever bonus rule checkRoundEnd decided applied the moment the target
  // cleared. Nothing else may call settleRound() directly any more.
  function takeFive(){
    if(!state.roundComplete) return;
    settleRound(state.roundCompleteEarly);
  }

  function triggerEgg(id){
    if(eggBusy || !EGG_FX[id]) return;
    const m0 = loadEggs();
    // Every egg here is a one-time collectible -- meet its trigger condition
    // again later (three scenes deep in the Silent era rolling snake eyes on
    // the first roll, say, for "meanwhile") and it used to replay the whole
    // animation every single time, forever, which is the opposite of a
    // surprise. 8-bit mode is the one exception: the Konami code is a mode
    // TOGGLE, not a find, so it's meant to fire (and flip on/off) every time
    // it's entered, same as before.
    if(m0[id] && id!=="eight_bit") return;
    eggBusy = true;
    const m = m0; const fresh = !m[id]; m[id] = 1; if(id==="eight_bit") m.eightBit = !m.eightBit; saveEggs(m);
    popQueue.then(async ()=>{
      try{ await EGG_FX[id](); }catch(e){ const l=eggLayer(); if(l) l.innerHTML=""; }
      const l=eggLayer();
      if(l){ const b=document.createElement("div"); b.className="egg-found"; b.textContent=(fresh?"Easter egg found: ":"Easter egg: ")+EGG_NAMES[id]+" · "+eggsFound()+"/"+EGG_TOTAL; l.appendChild(b); setTimeout(()=>b.remove(),2700); }
      eggBusy = false;
      if(id==="eight_bit") { appliedEra=null; render(); }
    });
  }

  /* ---- score chain: replays how each payout was built, Balatro-style ----
     Reads roll.trace (recorded read-only in resolvePayout/resolveLossAmount/
     resolveOnRoll). Each winning bet gets one row of tokens that appear one
     at a time: the bet, its base payout, then every hook that moved it --
     blue for +, red for x -- while the perk card that fired pulses at the
     top of the screen. Tap the row to skip. A new roll cancels it. */
  function betLabelFor(betType, number){
    if(betType==="line") return (state.lineBet && state.lineBet.type==="dontpass") ? "Don't Pass" : "Pass Line";
    if(betType==="odds") return "Odds";
    if(betType==="field") return "Field";
    if(betType==="hard") return "Hard "+number;
    if(betType==="place") return "Place "+number;
    if(betType==="come") return number ? "Come "+number : "Come";
    if(betType==="dontcome") return number ? "Don't Come "+number : "Don't Come";
    if(betType==="prop") return PROP_NAMES[number] || "Prop";
    return "Bet";
  }
  let chainGen = 0, chainSkip = false;
  function stepOp(s){
    const from = s.from, to = s.to;
    if(s.kind==="cap") return { cls:"zero", txt:"cap "+fmtU(to) };
    if(to===0 && from!==0) return { cls:"zero", txt:"×0" };
    if(from>0){
      const r = to/from;
      const nice = [1.08,1.1,1.2,1.3,1.5,2,2.5,3,4,0.5,0.25];
      const rr = Math.round(r*100)/100;
      const isMult = nice.some(n=>Math.abs(n-rr)<0.001) && (Math.abs((to-from)-Math.round(to-from))>1e-9 || rr===2 || rr===3 || rr===1.5 || rr===0.5);
      if(isMult) return { cls:"mul", txt:"×"+(+rr.toFixed(2)) };
    }
    const d = to-from;
    return { cls: d<0 ? "neg" : "add", txt:(d<0?"−":"+")+fmtU(Math.abs(Math.round(d*10)/10)) };
  }
  function firePerk(key, badge){
    let el = null;
    if(key==="boss") el = document.getElementById("boss-strip");
    else if(key==="die") el = document.querySelector(".dice-tray");
    else if(key) el = document.querySelector(`[data-perk="${key}"]`);
    if(!el) return;
    el.classList.remove("fire"); void el.offsetWidth; el.classList.add("fire");
    if(badge && el.dataset.perk){ el.dataset.badge = badge; clearTimeout(el._bt); el._bt = setTimeout(()=>{ delete el.dataset.badge; }, 900); }
    if((sfxGain()>0)){ const a=ac(); if(a) tone(midi(72+Math.min(12,(firePerk.n=(firePerk.n||0)+1))),a.currentTime,.09,"triangle",.05); }
  }
  async function playChain(trace, gen){
    const rows = (trace||[]).filter(t=>(t.win && t.final>0) || t.push || (t.roll && t.steps && t.steps.length));
    if(!rows.length) return;
    firePerk.n = 0; chainSkip = false;
    // Options' Game Speed (see speedMult) is a second, independent pacing
    // knob on top of `pace` below -- `pace` already speeds up a long chain
    // so it doesn't outstay its welcome; speedMult scales whatever `pace`
    // lands on down further for a player who wants every chain snappier,
    // long or short.
    const wait = ms => chainSkip||reduceMotion ? Promise.resolve() : sleepMs(ms*speedMult());
    const pace = rows.length>4 ? 0.6 : 1.25;
    let running = 0;
    const netEl = ()=>document.getElementById("roll-net");
    for(const r of rows){
      if(gen!==chainGen || state.screen!=="play") return;
      const box = document.getElementById("chain"); if(!box) return;
      box.classList.add("playing");
      box.innerHTML = `<div class="chain-row"><span class="tok bet">${r.bet}</span></div>`;
      const row = box.firstChild;
      const add = (html, cls)=>{ const s=document.createElement("span"); s.className="tok "+cls; s.innerHTML=html; const cur=document.getElementById("chain"); if(cur && cur.firstChild) cur.firstChild.appendChild(s); return s; };
      if(r.push){
        await wait(160*pace);
        add(`push${r.src?` <small>${r.src.label}</small>`:""}`, "push");
        if(r.src) firePerk(r.src.key, "push");
        await wait(420*pace); continue;
      }
      if(r.retrigger){
        await wait(180*pace);
        add(`↻ again <small>${r.src.label}</small>`, "retrig");
        firePerk(r.src.key, "↻");
        await wait(240*pace);
        add("= +"+fmtU(r.final), "total");
        running += r.final;
        const n0 = netEl(); if(n0){ n0.textContent = "+"+fmtU(running)+"u"; n0.classList.remove("bump"); void n0.offsetWidth; n0.classList.add("bump"); }
        await wait(460*pace); continue;
      }
      await wait(120*pace);
      if(!r.roll) add(fmtU(r.base), "base");
      for(const s of (r.steps||[])){
        if(gen!==chainGen) return;
        await wait(200*pace);
        const op = stepOp(s);
        add(`${op.txt} <small>${String(s.label).length>13?String(s.label).slice(0,12)+"…":s.label}</small>`, op.cls);
        firePerk(s.key, op.txt);
      }
      await wait(200*pace);
      add("= "+(r.final>0?"+":"")+fmtU(r.final), r.final<0?"neg total":"total");
      running += r.final;
      const n = netEl(); if(n){ n.textContent = (running>0?"+":"")+fmtU(running)+"u"; n.classList.remove("bump"); void n.offsetWidth; n.classList.add("bump"); }
      await wait(420*pace);
    }
    const box = document.getElementById("chain");
    if(box && gen===chainGen){ box.classList.remove("playing"); box.innerHTML = lastTickerHtml; }
    const n = netEl(); if(n && state.lastRoll && state.lastRoll.netThisRoll!=null){ const v=state.lastRoll.netThisRoll; n.textContent=(v>0?"+":"")+fmtU(v)+"u"; }
  }
  let lastTickerHtml = "";
  document.addEventListener("click", e=>{ if(e.target.closest && e.target.closest("#chain.playing")) chainSkip = true; });

  /* ---- the crowd: more people and more noise the hotter the table ----
     Hotness blends Heat (vs this run's cap) with the current win streak.
     Fans drift in as it climbs and wander off as it cools; the mood sets
     how much they move. Lives outside #app (render() rebuilds #app every
     tap) and is pinned over #crowd-slot so its animations never restart. */
  const CROWD_MAX = 14;
  const CROWD_POS = (()=>{ // fill order: centre first, then outward; two depth rows
    const r = mulberry(42), out = [];
    const xs = [50,38,62,26,74,44,56,15,85,32,68,6,94,20];
    xs.forEach((x,i)=>out.push({ x: x + (r()*4-2), back: i%3===2, s: 0.82 + r()*0.3, d: r()*0.8, shirt: Math.floor(r()*6), skin: Math.floor(r()*4) }));
    return out;
  })();
  const SHIRTS = ["#b8453a","#3a6fb8","#d9a441","#4f9f80","#8a5cc2","#e0e0e0"];
  const SKINS = ["#f1c9a5","#c98e62","#8d5a3b","#5e3a24"];
  const crowd = { el:null, fans:[] };
  function tableHotness(){
    const hm = Math.max(1, heatMaxFor());
    const h = 0.55*Math.min(1, state.heat/hm) + 0.45*Math.min(6, state.winStreak||0)/6;
    return Math.max(0, Math.min(1, h));
  }
  function syncCrowd(){
    if(!crowd.el){ crowd.el = document.createElement("div"); crowd.el.id = "crowd"; crowd.el.setAttribute("aria-hidden","true"); document.body.appendChild(crowd.el); }
    const slot = document.getElementById("crowd-slot");
    if(state.screen!=="play" || !slot){ crowd.el.hidden = true; return; }
    crowd.el.hidden = false;
    const r = slot.getBoundingClientRect();
    Object.assign(crowd.el.style, { left:(r.left+scrollX)+"px", top:(r.top+scrollY)+"px", width:r.width+"px", height:r.height+"px" });
    const h = tableHotness();
    const want = 2 + Math.round(h*(CROWD_MAX-2));
    while(crowd.fans.length < want){
      const p = CROWD_POS[crowd.fans.length];
      const f = document.createElement("div");
      f.className = "fan arrive"+(p.back?" back":"");
      f.style.cssText = `left:${p.x}%; --s:${p.back?p.s*0.82:p.s}; --d:${p.d}s; --shirt:${SHIRTS[p.shirt]}; --skin:${SKINS[p.skin]}`;
      f.innerHTML = `<div class="fb"><i class="al"></i><i class="ar"></i><i class="bd"></i><i class="hd"></i></div>`;
      crowd.el.appendChild(f); crowd.fans.push(f);
      setTimeout(()=>f.classList.remove("arrive"), 700);
    }
    while(crowd.fans.length > want){
      const f = crowd.fans.pop(); f.classList.add("leave"); setTimeout(()=>f.remove(), 650);
    }
    crowd.el.dataset.mood = h<0.2 ? "cold" : h<0.45 ? "warm" : h<0.75 ? "hot" : "fire";
  }
  function crowdReact(kind){
    if(!crowd.el || crowd.el.hidden) return;
    crowd.el.classList.remove("cheer","roar","groan"); void crowd.el.offsetWidth;
    crowd.el.classList.add(kind);
    clearTimeout(crowd._t); crowd._t = setTimeout(()=>crowd.el && crowd.el.classList.remove(kind), kind==="roar"?1500:1000);
    if(kind==="roar" && crowd.el.dataset.mood==="fire"){ // phone-camera flashes
      for(let i=0;i<5;i++){ const fl=document.createElement("i"); fl.className="flash"; fl.style.left=(10+Math.random()*80)+"%"; fl.style.animationDelay=(i*0.18)+"s"; crowd.el.appendChild(fl); setTimeout(()=>fl.remove(),1600); }
    }
    if((sfxGain()>0)){ const a=ac(); if(a){ try{
      const dur = kind==="groan"?0.9:kind==="roar"?1.6:0.9, len=Math.floor(a.sampleRate*dur);
      const buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<len;i++){ const t=i/len; d[i]=(Math.random()*2-1)*Math.sin(Math.PI*t)*(kind==="groan"?1-t*0.5:1); }
      const src=a.createBufferSource(); src.buffer=buf; const f=a.createBiquadFilter(); f.type="bandpass"; f.frequency.value=kind==="groan"?380:900; f.Q.value=0.7;
      const g=a.createGain(); g.gain.value=(kind==="roar"?0.35:0.18)*(0.4+tableHotness())*sfxGain(); src.connect(f); f.connect(g); g.connect(a.destination); src.start();
    }catch(e){} } }
  }
  window.addEventListener("resize", ()=>syncCrowd());
  window.addEventListener("scroll", ()=>syncCrowd(), {passive:true});

  /* Called once at the end of every settled roll (see doRoll). Reads what
     the engine already decided -- never writes a number back. */
  function afterRollFx(info){
    if(!info) return;
    if(state.screen!=="play") return; // game over / end screen is its own moment
    const gap = Math.max(1, state.target - (state.lastSceneStipend||0));
    const bigLine = Math.max(BIG_WIN_HEAT_THRESHOLD+2, Math.round(gap*0.25));
    const streak = state.winStreak||0;
    const gen = chainGen;
    if(info.sevenOut || info.net < -Math.max(3, gap*0.15)) crowdReact("groan");
    popQueue = popQueue.then(()=>playChain(info.trace, gen)).then(()=>{
      if(gen!==chainGen) return;
      const b = document.getElementById("hud-budget"); if(b){ b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump"); }
      if(info.net>=bigLine) crowdReact("roar");
      else if(info.net>0){ crowdReact("cheer"); const [x,y]=tableCenter(); burst(curTheme().parts,x,y,14); }
    }).catch(()=>{});
    if(info.sevenOut) popCard("out");
    else if(info.net>=bigLine) popCard("big", info.net);
    if(info.net>0 && (streak===3 || streak===5 || streak===7 || (streak>=10 && streak%5===0))) popCard("streak", null, streak+" in a row");
    const hmax = heatMaxFor();
    if(state.heat>=hmax && (info.heatBefore==null || info.heatBefore<hmax)) popCard("heat");
    if(state.roundComplete && state.score>=state.target) popCard("clear");
    checkRollEggs(info);
  }

  function checkRollEggs(info){
    const {a,b,sum,hand,net,sevenOut} = info;
    const ch = state.characterId, era = state.difficulty;
    // Gunslinger -- three sevens in a row
    eggTrack.sevens = sum===7 ? eggTrack.sevens+1 : 0;
    if(ch==="gunslinger" && eggTrack.sevens===3) return triggerEgg("high_noon");
    // Lovers -- the same double twice running
    const dbl = a===b ? a : null;
    const lovers = dbl!=null && eggTrack.lastDouble===dbl;
    eggTrack.lastDouble = dbl;
    if(ch==="lovers" && lovers) return triggerEgg("meet_cute");
    if(ch==="time_traveler" && state.score===88) return triggerEgg("eighty_eight");
    if(ch==="prankster" && hand.id==="snake" && net<0) return triggerEgg("pie");
    if(ch==="general" && net>0 && state.winStreak===10) return triggerEgg("promotion");
    if(ch==="survivor" && state.score===13) return triggerEgg("final_girl");
    if(state.rollNumber>0 && state.rollNumber%3===0){ eggTrack.beatWins = net>0 ? eggTrack.beatWins+1 : 0; if(ch==="conductor" && eggTrack.beatWins===3) return triggerEgg("showstopper"); }
    // Era eggs
    if(era==="silent" && state.rollNumber===1 && hand.id==="snake") return triggerEgg("meanwhile");

  const HOLD_MS = 480;

      cancelTimer();

    el.addEventListener("pointerup", release);
    el.addEventListener("pointerleave", release);
    el.addEventListener("pointercancel", release);

  function perkBar(){

  // Drag-to-reorder for perkBar's 4 Production Kit tiles (Lead is excluded
  // by markup -- it has no data-perk-slot). A plain hold still shows the
  // same tooltip wireHoldTip would (reusing showHoldTip/hideHoldTip
  // directly) -- the two gestures share one pointerdown, disambiguated by
  // movement: past DRAG_PX before HOLD_MS elapses, it's a drag and the
  // tooltip timer never fires; still within DRAG_PX when HOLD_MS elapses,
  // it's a hold and the tooltip shows, same feel as everywhere else this
  // gesture is used. Reordering itself is index-swap-on-drop, not a live
  // shuffle while dragging -- simpler to get right with exactly 4 tiles,
  // and `drag-over` still tells you where you're about to drop.
  const DRAG_PX = 10;
  // pointermove/pointerup/pointercancel are wired on `document`, not on the
  // tile that got the pointerdown -- setPointerCapture alone turned out NOT
  // to reliably keep a drag scoped to one tile (verified with a Playwright
  // pointer-drag test: without this, every tile the cursor physically
  // passes over fires its OWN pointermove listener too, each computing its
  // own bogus delta off a downX/downY it never actually recorded, and
  // multiple tiles end up "dragging" at once). One shared listener pair,
  // torn down on drop, avoids depending on capture semantics at all.
  function wirePerkDrag(){
    const tiles = Array.from(root.querySelectorAll('.perk[data-perk-slot]'));
    let activeTile=null, activeSlot=null, downX=0, downY=0, dragging=false, holdTimer=null;
    const cancelHold = ()=>{ if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; } };
    const clearVisuals = ()=>{ tiles.forEach(t=>{ t.style.transform=""; t.style.zIndex=""; t.classList.remove("dragging","drag-over"); }); };
    // The dragged tile itself sits visually on top of whatever it's hovering
    // (it's the one being translated) -- document.elementFromPoint would
    // otherwise just find the dragged tile again at its own cursor position,
    // never the tile underneath. Hiding it from hit-testing for the single
    // elementFromPoint call is the standard workaround.
    const tileUnderPointer = (x,y)=>{
      if(!activeTile) return null;
      const prevPE = activeTile.style.pointerEvents;
      activeTile.style.pointerEvents = "none";
      const el = document.elementFromPoint(x,y);
      activeTile.style.pointerEvents = prevPE;
      return el && el.closest('.perk[data-perk-slot]');
    };
    const stopTracking = ()=>{
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      document.removeEventListener("pointercancel", onCancel);
      activeTile=null; activeSlot=null; dragging=false;
    };
    const onMove = e=>{
      if(!activeTile) return;
      const dx = e.clientX-downX, dy = e.clientY-downY;
      if(!dragging && Math.hypot(dx,dy)>DRAG_PX){
        dragging = true; cancelHold(); hideHoldTip(); activeTile.classList.add("dragging");
      }
      if(!dragging) return;
      e.preventDefault();
      activeTile.style.transform = `translate(${dx}px, ${dy}px)`;
      activeTile.style.zIndex = 5;
      const overTile = tileUnderPointer(e.clientX, e.clientY);
      tiles.forEach(t=>t.classList.remove("drag-over"));
      if(overTile && overTile!==activeTile) overTile.classList.add("drag-over");
    };
    const onUp = e=>{
      if(!activeTile) return;
      cancelHold();
      const tile = activeTile, slot = activeSlot, wasDragging = dragging;
      if(wasDragging){
        const overTile = tileUnderPointer(e.clientX, e.clientY);
        if(overTile && overTile!==tile){
          const order = perkOrderSafe().slice();
          const fromIdx = order.indexOf(slot), toIdx = order.indexOf(overTile.dataset.perkSlot);
          if(fromIdx>-1 && toIdx>-1 && fromIdx!==toIdx){
            order.splice(fromIdx,1);
            order.splice(toIdx,0,slot);
            state.perkOrder = order;
            saveState();
            clearVisuals();
            stopTracking();
            render();
            return;
          }
        }
      }
      clearVisuals();
      stopTracking();
    };
    const onCancel = ()=>{ cancelHold(); hideHoldTip(); clearVisuals(); stopTracking(); };
    tiles.forEach(tile=>{
      const slot = tile.dataset.perkSlot;
      tile.addEventListener("pointerdown", e=>{
        if(e.button!=null && e.button!==0) return; // left click / primary touch only
        activeTile = tile; activeSlot = slot;
        downX = e.clientX; downY = e.clientY; dragging = false;
        cancelHold();
        const item = state.equipped[slot];
        if(item) holdTimer = setTimeout(()=>{ showHoldTip(item.name, item.desc); }, HOLD_MS);
        document.addEventListener("pointermove", onMove);
        document.addEventListener("pointerup", onUp);
        document.addEventListener("pointercancel", onCancel);
      });
    });
  }

  // Base craps rules, in plain English, for anyone who's never seen a table
  // before -- deliberately doesn't touch anything this production's own
  // roguelike layer adds on top (Heat, Retakes, the Shop, Production Kit

  function renderTutorial(){
    root.innerHTML = `
      <div class="marquee">
        <div class="marquee-top">
          <div class="brand">LEADING ROLL<small>How to Play</small></div>
        </div>
        <div class="screen-title">The Rules of the Table</div>
        <div class="screen-sub">Straight craps, underneath everything else this production adds. Every round starts the same way and everything below builds off it.</div>
      </div>
      <div class="grid">
        <div class="card">
          <h3 style="margin:0 0 6px;">The Come-Out Roll</h3>
          <p class="screen-sub" style="margin:0;">Every round opens with a come-out roll. Roll a 7 or 11 and the Pass Line wins outright; roll 2, 3, or 12 ("craps") and it loses outright. Any other number (4, 5, 6, 8, 9, or 10) becomes the <b style="color:var(--cream);">point</b> instead -- nothing's decided yet, and the table moves into the point phase.</p>
        </div>
        <div class="card">
          <h3 style="margin:0 0 6px;">Once a Point Is On</h3>
          <p class="screen-sub" style="margin:0;">Now the table's just watching for two numbers: the point itself, or a 7. Roll the point again before a 7 shows and the Pass Line wins; roll a 7 first (a "seven-out") and it loses -- and the round ends either way, win or lose. Everything else that rolls in between (any other number) just doesn't resolve anything and the shooter keeps rolling.</p>
        </div>
        <div class="card">
          <h3 style="margin:0 0 6px;">Pass Line &amp; Don't Pass Bar</h3>
          <p class="screen-sub" style="margin:0;">The table's two main bets, and opposites of each other. <b style="color:var(--cream);">Pass Line</b> bets with the shooter: wins on a come-out 7 or 11, loses on 2, 3, or 12, then needs the point again before a 7. <b style="color:var(--cream);">Don't Pass Bar</b> bets against the shooter: wins on a come-out 2 or 3 (12 just pushes -- stake back, no win or loss), loses on 7 or 11, then needs a 7 before the point. Both can only be placed before a point is on.</p>
        </div>
        <div class="card">
          <h3 style="margin:0 0 6px;">Come &amp; Don't Come</h3>
          <p class="screen-sub" style="margin:0;">The same two bets again, but for a shooter already mid-point -- each one runs its own private come-out roll on your very next roll, sets its own number, and then plays out exactly like a Pass Line (or Don't Pass) chasing that number. Only open once the table's own point is already on.</p>
        </div>
        <div class="card">
          <h3 style="margin:0 0 6px;">Odds</h3>
          <p class="screen-sub" style="margin:0;">Once a point is on, back up a Pass Line or Don't Pass bet with an Odds bet riding alongside it -- the one corner of the table with no house edge at all, paid out at the true mathematical odds for that point number.</p>
        </div>
        <div class="card">
          <h3 style="margin:0 0 6px;">Dealer Bets (Place Bets)</h3>
          <p class="screen-sub" style="margin:0;">Bet directly on a number (4, 5, 6, 8, 9, or 10) hitting again before a 7, without needing it to be the table's own point. Only open once a point is on, can be dropped any time, and each number pays its own odds -- 6 and 8 the best, 4 and 10 the longest.</p>
        </div>
        <div class="card">
          <h3 style="margin:0 0 6px;">Field</h3>
          <p class="screen-sub" style="margin:0;">A one-roll bet open the whole time: wins if the very next roll is 3, 4, 9, 10, or 11 (even money), or 2 or 12 (double). Any other roll loses -- win or lose, it's settled in a single roll either way.</p>
        </div>
        <div class="card">
          <h3 style="margin:0 0 6px;">Hardways</h3>
          <p class="screen-sub" style="margin:0;">Bet that a 4, 6, 8, or 10 rolls as a matching pair (like 3-3 for a hard 6) before it rolls the easy way (like 4-2) or a 7 shows. Stays riding across many rolls, same as a Dealer Bet.</p>
        </div>
        <div class="card">
          <h3 style="margin:0 0 6px;">Props</h3>
          <p class="screen-sub" style="margin:0;">One-roll side bets settled on the very next roll and nothing after: Snake Eyes (1-1), Boxcars (6-6), Any Craps (2, 3, or 12), and Any 7. High payouts, long odds.</p>
        </div>
        <div class="card">
          <h3 style="margin:0 0 6px;">Everything Else on the Table</h3>
          <p class="screen-sub" style="margin:0;">Heat, Retakes, the Shop, Felt upgrades, and your Production Kit are all this production's own additions on top of the rules above -- hold any bet zone, Perk, or Felt card in play to see exactly what it does.</p>
        </div>
        <div class="controls">
          <button class="btn btn-gold" id="btn-tutorial-back">Back to Title</button>
        </div>

  // Everything the last roll resolved, as one compact colored line.
  function rollTicker(boss){
    const it = [];
    const cls = r=> r.push?"push":r.win?"win":"loss";
    const sign = (r,amt)=> r.push?"push":(r.win?"+":"−")+fmtU(amt)+"u";
    const n = state.lastBetNote;
    if(n) it.push(`<span class="${cls(n)}">${n.label} ${sign(n,n.amount)}${n.odds?(n.push?"":n.win?` · odds +${fmtU(n.oddsWin)}u`:` · odds −${fmtU(n.odds)}u`):""}</span>`);
    const f = state.lastFieldNote;
    if(f) it.push(`<span class="${cls(f)}">Field ${sign(f,f.amount)}</span>`);
    (state.hardResolutions||[]).forEach(r=>{ const zeroed = r.win && r.amount===0; it.push(`<span class="${cls(r)}">Hard ${r.number} ${zeroed?"hit, paid 0":sign(r,r.amount)}</span>`); });
    (state.propResolutions||[]).forEach(r=>it.push(`<span class="${cls(r)}">${PROP_NAMES[r.key]||r.key} ${sign(r,r.amount)}</span>`));
    (state.placeResolutions||[]).forEach(r=>it.push(`<span class="${cls(r)}">Place ${r.number} ${sign(r,r.amount)}</span>`));
    (state.comeResolutions||[]).forEach(r=>it.push(`<span class="${cls(r)}">Come ${r.number} ${sign(r,r.amount)}</span>`));
    const cn = state.comeBetNote;
    if(cn) it.push(`<span class="${cn.moved?"note":cls(cn)}">${cn.moved?`Come → ${cn.number}`:"Come "+sign(cn,cn.amount)}</span>`);
    (state.dontComeResolutions||[]).forEach(r=>it.push(`<span class="${cls(r)}">Don't Come ${r.number} ${sign(r,r.amount)}</span>`));
    const dn = state.dontComeBetNote;
    if(dn) it.push(`<span class="${dn.moved?"note":cls(dn)}">${dn.moved?`Don't Come → ${dn.number}`:"Don't Come "+sign(dn,dn.amount)}</span>`);
    if(state.lastDieLostMsg) it.push(`<span class="loss">${state.lastDieLostMsg}</span>`);
    if(state.scriptNote) it.push(`<span class="note">${state.scriptNote}</span>`);
    if(state.castNote) it.push(`<span class="note">${state.castNote}</span>`);
    if(state.bossNote) it.push(`<span class="loss">${state.bossNote}</span>`);
    return it.join(" · ");
  }

  function renderPlay(){
    if(state.rolling) chainGen++; // a new roll cancels any score chain still playing
    const boss = state.tierIdx===2 ? BOSS_BLINDS.find(x=>x.id===state.bossId) : null;
    const lr = state.lastRoll;
    // Color each settled die in the tray to whatever kind actually rolled
    // it (lr.kindA/kindB, stamped by doRoll) -- same tint Dice Select shows
    // that die in, so a Loaded Die's gold or a Tri Die's red is still
    // readable after the roll, not just during doRoll's own tumble. No
    // lastRoll yet (a fresh scene, before the first roll) falls back to
    // dieFaceSVG's own era-themed default, same as before this feature.
    const lrTintA = lr && lr.kindA && DIE_KINDS[lr.kindA] ? DIE_KINDS[lr.kindA].tint : null;
    const lrTintB = lr && lr.kindB && DIE_KINDS[lr.kindB] ? DIE_KINDS[lr.kindB].tint : null;
    const info = actInfo(state.ante);
    const rollDisabled = state.rolling || state.phase==="select" || state.roundComplete;
    const bettingOpen = state.phase!=="select" && !state.rolling && !state.roundComplete;
    const lineEligible = bettingOpen && state.phase==="comeout" && state.point===null;
    const oddsEligible = bettingOpen && state.phase==="point";
    const placeBettingOpen = bettingOpen && state.phase==="point";
    const fieldOpen = bettingOpen && !betBanned("field");
    const hardOpen = bettingOpen && !betBanned("hard");
    const placeOpen = placeBettingOpen && !betBanned("place");
    const comeOpen = placeBettingOpen && !betBanned("come");
    const dontComeOpen = placeBettingOpen && !betBanned("dontcome");
    const oddsBanned = betBanned("odds");
    const econActiveZones = ECON_FELT_ZONES.filter(z=>feltLevelOf(z.id)>0);
    const streak = state.winStreak||0;
    const character = CHARACTERS[state.characterId];
    const streakLbl = state.characterId==="general" ? (GENERAL_RANKS.find(([n])=>streak>=n)||[0,"Private"])[1]+" ×"+streak : "×"+streak;
    const streakChip = (streak>=2 || state.characterId==="general") && streak>0 ? `<span class="streak-chip" data-lvl="${streak>=7?3:streak>=5?2:1}"><i class="flame"></i>${streakLbl}</span>` : "";
    const ticker = lr ? rollTicker(boss) : "";
    const noRoom = roomLeft()<=0;
    const lineOn = !!state.lineBet;
    const pointOn = state.phase==="point";
    const canClear = (lineEligible && lineOn) || (pointOn && lineOn && state.lineBet.odds>0) || state.fieldBet>0 || [4,6,8,10].some(n=>state.hardBets[n]>0) || PROP_DEFS.some(p=>state.propBets[p.key]>0) || (pointOn && [4,5,6,8,9,10].some(n=>state.placeBets[n]>0)) || (pointOn && state.comeBet && state.comeBet.amount>0) || (pointOn && state.dontComeBet && state.dontComeBet.amount>0);
    const snap = state.lastRollSnapshot;
    const canRebet = !state.roundComplete && !!snap && (
      (snap.lineBet && !state.lineBet && lineEligible) || (snap.fieldBet>0 && !state.fieldBet) ||
      (snap.hardBets && [4,6,8,10].some(n=>snap.hardBets[n]>0 && !state.hardBets[n])) ||
      (snap.propBets && Object.keys(snap.propBets).some(k=>snap.propBets[k]>0 && !state.propBets[k])) ||
      (pointOn && snap.placeBets && [4,5,6,8,9,10].some(n=>snap.placeBets[n]>0 && !state.placeBets[n])) ||
      (pointOn && snap.comeBet && snap.comeBet.amount>0 && !(state.comeBet && state.comeBet.amount)) ||
      (pointOn && snap.dontComeBet && snap.dontComeBet.amount>0 && !(state.dontComeBet && state.dontComeBet.amount)));
    const freeRetake = character && character.freeRetakeEachScene && !state.freeRetakeUsedThisScene;
    const retakeLabel = (eggTrack.rewind?"Rewind":"Retake")+` ${state.retakesLeft}${freeRetake?"+1":""}`;
    const firstEverScene = !lr && state.screeningsWon===0 && state.ante===1 && state.tierIdx===0;

    root.innerHTML = `
      ${runHud({menu:true, perks:true})}
      <div class="play-col">
      ${state.phase==="select" ? renderDiceSelect() : `
        <div id="crowd-slot"></div>
        <div class="table-scene">
          <div class="felt${state.removeMode?" felt-removing":""}">
            <div class="felt-top">
              ${state.roundComplete ? `
                <div class="dice-well"><div class="dice-tray"><div class="die">${dieFaceSVG(lr?lr.a:1, lrTintA)}</div><div class="die">${dieFaceSVG(lr?lr.b:1, lrTintB)}</div></div></div>
              ` : `
                <button class="dice-well ${state.rolling?"":"selectable"}" data-action="roll" ${state.rolling?"disabled":""} aria-label="Roll the dice">
                  <div class="dice-tray"><div id="die-a" class="die ${state.rolling?"rolling":""}">${dieFaceSVG(lr?lr.a:1, lrTintA)}</div><div id="die-b" class="die ${state.rolling?"rolling":""}">${dieFaceSVG(lr?lr.b:1, lrTintB)}</div></div>
                </button>`}
              <div class="callout">
                ${state.roundComplete
                  ? `<div class="roll-line"><span class="roll-total">${lr&&!lr.noRoll?lr.a+lr.b:"—"}</span><span class="roll-sub">${state.score>=state.target?"Target hit":"25 rolls used"}<br>${streakChip}</span></div>`
                  : lr ? (lr.noRoll
                    ? `<div class="roll-line"><span class="roll-total">✕</span><span class="roll-sub">Die off the table<br>all bets push</span></div>`
                    : `<div class="roll-line"><span class="roll-total">${lr.a+lr.b}</span><span class="roll-sub">${lr.a} + ${lr.b}${state.point?` · point ${state.point}`:""}<br>${lr.netThisRoll!=null?`<b id="roll-net" style="color:${lr.netThisRoll>0?'var(--emerald-bright)':lr.netThisRoll<0?'var(--marquee-red-bright)':'var(--cream-dim)'}">${lr.netThisRoll>0?'+':''}${fmtU(lr.netThisRoll)}u</b>`:""} ${streakChip}</span></div>`)
                  : `<div class="roll-line"><span class="roll-total">${state.rolling?"…":"?"}</span><span class="roll-sub">${state.point?"Point "+state.point:"Come-out roll"}<br>tap the dice</span></div>`}
              </div>
            </div>
            <div class="chain" id="chain">${lastTickerHtml = (ticker ? `<div class="ticker">${ticker}</div>` : firstEverScene ? `<div class="ticker">Tap a zone to bet · hold any zone or perk to read it.</div>` : "")}</div>
            ${econActiveZones.length ? `<div class="econ-readout">${econActiveZones.map(z=>`+${fmtU(feltLevelOf(z.id)*z.rate)}u Payroll ${z.label.replace(/^On /,"").toLowerCase()}`).join(" · ")}</div>` : ""}
            ${(bodyDoubleActive() && !state.roundComplete) ? `
            <div class="betunit-row" role="group" aria-label="Body Double take A"><span class="felt-label" style="margin:0 6px 0 0;">A</span>${[1,2,3,4,5,6].map(n=>`<button class="betunit-btn ${(state.manualPick&&state.manualPick.a)===n?"active":""}" data-manualpick="a:${n}">${n}</button>`).join("")}</div>
            <div class="betunit-row" role="group" aria-label="Body Double take B"><span class="felt-label" style="margin:0 6px 0 0;">B</span>${[1,2,3,4,5,6].map(n=>`<button class="betunit-btn ${(state.manualPick&&state.manualPick.b)===n?"active":""}" data-manualpick="b:${n}">${n}</button>`).join("")}</div>` : ``}

            <div class="layout-sheet">
              <div class="sheet-row point-row" style="padding-top:0">
                <div class="point-track" style="border-top:none">
                  ${POINT_NUMBERS.map(n=>{
                    const [num,den] = PLACE_PAYOUTS[n];
                    const placed = state.placeBets[n]>0;
                    const comeOn = (state.comeBets||{})[n]>0;
                    const dontComeOn = (state.dontComeBets||{})[n]>0;
                    const zoneId = "place_"+n;
                    return `<button class="point-box ${state.point===n?"active":""} ${placeOpen?"selectable":""} ${placed?"placed":""}" data-placebet="${n}" ${placeOpen?"":"disabled"} style="${feltTileGlowStyle(zoneId)}">
                      <span class="point-num">${n}</span>
                      <span class="point-pay mono">${num}:${den}${feltPaySuffix(zoneId)}</span>
                      ${state.point===n?'<span class="puck">ON</span>':""}
                      ${(placed||comeOn||dontComeOn)?`<span class="pb-chips">${placed?`<span class="pb-chip mono">${fmtU(state.placeBets[n])}u</span>`:""}${comeOn?`<span class="pb-chip c mono">C${fmtU(state.comeBets[n])}</span>`:""}${dontComeOn?`<span class="pb-chip d mono">D${fmtU(state.dontComeBets[n])}</span>`:""}</span>`:""}
                      ${feltLevelBadge(zoneId)}
                    </button>`;
                  }).join("")}
                </div>
              </div>
              <button class="sheet-row zone-field ${fieldOpen?"selectable":""} ${state.fieldBet>0?"selected":""}" data-bettype="field" ${fieldOpen?"":"disabled"} style="${feltTileGlowStyle("field")}">
                <span class="zone-title pixel">FIELD${betBanned("field")?' ✕':""}</span>
                <span class="field-nums mono">2 · 3 · 4 · 9 · 10 · 11 · 12</span>
                <span class="field-pays mono">2 ×2 · 12 ×3${feltPaySuffix("field")}</span>
                ${barChip("field")}
                ${feltLevelBadge("field")}
              </button>
              <div class="sheet-row zone-hardways">
                <div class="hard-row">
                  ${[4,6,8,10].map(n=>{
                    const half = n/2, active = state.hardBets[n]>0, zoneId = "hard_"+n;
                    return `<button class="hard-tile ${hardOpen?"selectable":""} ${active?"active":""}" data-hardbet="${n}" ${hardOpen?"":"disabled"} style="${feltTileGlowStyle(zoneId)}">
                      <div class="hard-dice"><span class="die die-tiny">${dieFaceSVG(half)}</span><span class="die die-tiny">${dieFaceSVG(half)}</span></div>
                      <span class="hard-payout mono">Hard ${n} · ${HARDWAY_PAYOUTS[n]}:1${feltPaySuffix(zoneId)}</span>
                      ${active?`<span class="hard-chip-badge mono">${fmtU(state.hardBets[n])}u</span>`:""}
                      ${feltLevelBadge(zoneId)}
                    </button>`;
                  }).join("")}
                </div>
                <div class="hard-row" style="margin-top:5px">
                  ${PROP_DEFS.map(p=>{
                    const active = state.propBets[p.key]>0, zoneId = "prop_"+p.key;
                    return `<button class="hard-tile ${bettingOpen?"selectable":""} ${active?"active":""}" data-propbet="${p.key}" ${bettingOpen?"":"disabled"} style="${feltTileGlowStyle(zoneId)}">
                      ${p.dice ? `<div class="hard-dice"><span class="die die-tiny">${dieFaceSVG(p.dice[0])}</span><span class="die die-tiny">${dieFaceSVG(p.dice[1])}</span></div>` : `<span class="hard-num mono" style="font-size:10px">${p.label}</span>`}
                      <span class="hard-payout mono">${p.payout}:1${feltPaySuffix(zoneId)}</span>
                      ${active?`<span class="hard-chip-badge mono">${fmtU(state.propBets[p.key])}u</span>`:""}
                      ${feltLevelBadge(zoneId)}
                    </button>`;
                  }).join("")}
                </div>
              </div>
              <div class="sheet-row line-row">
                <button class="lz dp ${lineEligible?"selectable":""} ${state.lineBet&&state.lineBet.type==="dontpass"?"selected":""}" data-bettype="dontpass" ${lineEligible?"":"disabled"} style="${feltTileGlowStyle("line")}"><span class="lz-t">DON'T PASS</span>${barChip("dontpass")}${feltLevelBadge("line")}</button>
                <button class="lz ps ${lineEligible?"selectable":""} ${state.lineBet&&state.lineBet.type==="pass"?"selected":""}" data-bettype="pass" ${lineEligible?"":"disabled"} style="${feltTileGlowStyle("line")}"><span class="lz-t">PASS LINE</span>${barChip("pass")}</button>
                <button class="lz cm ${comeOpen?"selectable":""} ${state.comeBet.amount>0?"selected":""}" data-bettype="come" ${comeOpen?"":"disabled"} style="${feltTileGlowStyle("come")}"><span class="lz-t">COME${feltPaySuffix("come")}</span>${state.comeBet.amount>0?chipHTML("come",state.comeBet.amount):""}${feltLevelBadge("come")}</button>
                <button class="lz dc ${dontComeOpen?"selectable":""} ${state.dontComeBet.amount>0?"selected":""}" data-bettype="dontcome" ${dontComeOpen?"":"disabled"} style="${feltTileGlowStyle("dont_come")}"><span class="lz-t">DON'T COME${feltPaySuffix("dont_come")}</span>${state.dontComeBet.amount>0?chipHTML("dontcome",state.dontComeBet.amount):""}${feltLevelBadge("dont_come")}</button>
              </div>
              ${state.lineBet && oddsEligible ? `
              <button class="sheet-row zone-odds ${(!oddsBanned && state.lineBet.odds>0)?"selected":""}" id="btn-odds" ${oddsBanned?"disabled":""}>
                <span class="zone-title pixel">${state.lineBet.type==="pass"?"TAKE ODDS":"LAY ODDS"} <span class="odds-pays mono">(${oddsLabel(state.point,state.lineBet.type)})</span>${oddsBanned?' ✕':""}</span>
                ${(!oddsBanned && state.lineBet.odds>0)?chipHTML("odds",state.lineBet.odds):""}
              </button>` : ""}
            </div>
          </div>
        </div>

        ${state.roundComplete ? "" : `
        <div class="chipbar">
          <div class="betunit-row" role="group" aria-label="Chip size">
            ${betUnitTiers().map(n=>`<button class="betunit-btn ${(state.betUnit||1)===n?"active":""}" data-betunit="${n}">${n}u</button>`).join("")}
          </div>
          <div class="tool-row">
            <button class="tool-btn" id="btn-rebet" ${canRebet?"":"disabled"} aria-label="Place the same bets again">Rebet</button>
            <button class="tool-btn" id="btn-clear-bets" ${canClear?"":"disabled"}>Clear</button>
            <button class="tool-btn ${state.removeMode?"on":""}" id="btn-toggle-remove">${state.removeMode?"Done":"Remove"}</button>
          </div>
        </div>`}
        ${state.removeMode ? `<div class="hint">Tap a bet to pull it back.</div>` : noRoom && !state.roundComplete ? `<div class="hint">Whole bankroll is riding. Tap Remove to free some up.</div>` : ""}

        <div class="actionbar ${state.roundComplete?"two":""}">
          ${state.roundComplete ? `
            <span></span><button class="btn btn-gold btn-roll" id="btn-take-five">Take 5 &rarr;</button>
          ` : `
            <button class="btn btn-ghost" id="btn-retake" ${(!lr||!canRetake()||state.rolling)?"disabled":""}>${retakeLabel}</button>
            <button class="btn btn-primary btn-roll" id="btn-roll" ${rollDisabled?"disabled":""}>${state.rolling?"Rolling…":"Roll"}</button>
            ${state.tierIdx!==2 ? `<button class="btn btn-ghost" id="btn-skip" ${state.rolling?"disabled":""}>Skip</button>` : `<span></span>`}
          `}
        </div>`}
      </div>
      ${drawerOpen ? renderDrawer() : ""}`;

    wireOwnedTips(); wireCommon(); wireBossTip(); wireDrawer(); wireLeadTip(); wirePerkDrag();

    if(state.phase==="select"){
      root.querySelectorAll("[data-pick]").forEach(btn=>{
        btn.onclick = ()=>toggleDieSelect(btn.dataset.pick);
        const d = state.dicePool.find(x=>x.uid===btn.dataset.pick);
        if(d) wireHoldTip(btn, DIE_KINDS[d.kind].name, DIE_KINDS[d.kind].desc, ()=>{});
      });
      const confirmBtn = document.getElementById("btn-confirm-lineup");
      if(confirmBtn) confirmBtn.onclick = confirmLineup;
      return;
    }

    const rollBtn = document.getElementById("btn-roll");
    if(rollBtn) rollBtn.onclick = doRoll;
    const comeBtn = document.querySelector('[data-action="roll"]');
    if(comeBtn) comeBtn.onclick = doRoll;
    const retakeBtn = document.getElementById("btn-retake");
    if(retakeBtn) retakeBtn.onclick = doRetake;
    const takeFiveBtn = document.getElementById("btn-take-five");
    if(takeFiveBtn) takeFiveBtn.onclick = takeFive;
    const skipBtn = document.getElementById("btn-skip");
    if(skipBtn){ skipBtn.onclick = skipRound; }

    root.querySelectorAll("[data-bettype]").forEach(btn=>{
      const t = btn.dataset.bettype;
      if(t==="field") wireHoldTip(btn, "Field", FIELD_TIP_DESC, state.removeMode?clearFieldBet:tapFieldBet);
      else if(t==="come") wireHoldTip(btn, "Come", COME_TIP_DESC, state.removeMode?clearComeBet:tapComeBet);
      else if(t==="dontcome") wireHoldTip(btn, "Don't Come", DONT_COME_TIP_DESC, state.removeMode?clearDontComeBet:tapDontComeBet);
      else if(t==="pass") wireHoldTip(btn, "Pass Line", PASS_TIP_DESC, ()=> state.removeMode?clearLineBet(t):tapLineBet(t));
      else wireHoldTip(btn, "Don't Pass Bar", DONT_PASS_TIP_DESC, ()=> state.removeMode?clearLineBet(t):tapLineBet(t));
    });
    root.querySelectorAll("[data-hardbet]").forEach(btn=>{
      const n = +btn.dataset.hardbet;
      wireHoldTip(btn, "Hard "+n, hardTipDesc(n), ()=>{ if(state.removeMode) clearHardBet(n); else { tapHardBet(n); onHardBetEgg(n); } });
    });
    root.querySelectorAll("[data-propbet]").forEach(btn=>{
      const key = btn.dataset.propbet;
      wireHoldTip(btn, PROP_NAMES[key]||key, PROP_TIP_DESCS[key]||"", ()=> state.removeMode?clearPropBet(key):tapPropBet(key));
    });
    root.querySelectorAll("[data-placebet]").forEach(btn=>{
      const n = +btn.dataset.placebet;
      wireHoldTip(btn, "Dealer Bet: "+n, placeTipDesc(n), ()=> state.removeMode?clearPlaceBet(n):tapPlaceBet(n));
    });
    const oddsBtn = document.getElementById("btn-odds");
    if(oddsBtn) wireHoldTip(oddsBtn, state.lineBet&&state.lineBet.type==="pass"?"Take Odds":"Lay Odds", oddsTipDesc(), state.removeMode?clearOdds:tapOdds);
    const clearBetsBtn = document.getElementById("btn-clear-bets");
    if(clearBetsBtn) clearBetsBtn.onclick = clearAllBets;
    const rebetBtn = document.getElementById("btn-rebet");
    if(rebetBtn) rebetBtn.onclick = rebetLast;
    const toggleRemoveBtn = document.getElementById("btn-toggle-remove");
    if(toggleRemoveBtn) toggleRemoveBtn.onclick = toggleRemoveMode;
    root.querySelectorAll("[data-betunit]").forEach(btn=>{
      btn.onclick = ()=>setBetUnit(+btn.dataset.betunit);
    });
    root.querySelectorAll("[data-manualpick]").forEach(btn=>{
      const [slot,val] = btn.dataset.manualpick.split(":");
      btn.onclick = ()=>setManualPick(slot, +val);
    });
  }

  // Bottom sheet with the detail that used to sit under the table: full
  // stats, the dice on the lot, the roll log -- and doubling as the in-run
  // pause menu, so it's also where Abandon Run lives (see abandonConfirming
  // just above). There's nothing this menu actually pauses -- nothing on
  // the play screen runs on a clock or ticks while it's open -- it's a
  // "step away from the table" menu in the same spirit as one, not a
  // literal game-clock pause.
  function renderDrawer(){
    const info = actInfo(state.ante);
    return `<div class="drawer-back" id="drawer-back"><div class="drawer" role="dialog" aria-label="Production details">
      <div class="sec-h" style="margin:0"><h3>Call Sheet</h3><button class="icon-btn" id="btn-drawer-close" aria-label="Close">✕</button></div>
      <div class="stat-strip">
        <div class="stat money"><div class="label">Bankroll</div><div class="value mono">${fmtU(state.score)}u</div></div>
        <div class="stat payroll"><div class="label">Payroll</div><div class="value mono">${fmtU(state.payroll)}u</div></div>
        <div class="stat heat"><div class="label">Heat</div><div class="value mono">${state.heat}/${heatMaxFor()}</div></div>
        <div class="stat"><div class="label">Retakes</div><div class="value mono">${state.retakesLeft}</div></div>
        <div class="stat"><div class="label">Scenes Won</div><div class="value mono">${state.screeningsWon}</div></div>
        <div class="stat"><div class="label">Lead</div><div class="value" style="font-size:12px">${CHARACTERS[state.characterId]?CHARACTERS[state.characterId].name:"—"}</div></div>
      </div>
      <div><div class="sec-h">Dice on the Lot <small>Act ${info.roman} · ${state.dicePool.length} dice</small></div>
        <div class="dice-select-grid">${state.dicePool.map(d=>{ const k=DIE_KINDS[d.kind], on=state.selectedDiceIds.includes(d.uid);
          return `<div class="die-pick static ${on?"picked":""}" style="--tint:${k.tint||"var(--gold)"}" data-tip-pool="${d.uid}"><span class="die die-sm">${dieFaceSVG(6,k.tint)}</span><span class="die-pick-label">${k.name}${on?" · in play":""}</span></div>`; }).join("")}</div></div>
      <div><div class="sec-h">Dailies</div><div class="log">${state.log.length? state.log.map(r=>`<div class="log-row"><span class="lt">${r.t}</span><span class="ls">${r.s}</span></div>`).join("") : `<div class="log-row"><span class="lt">No rolls yet this scene.</span></div>`}</div></div>
      <div class="hint">Hold any bet, perk or die to read what it does. Eggs found: ${eggsFound()}/${EGG_TOTAL}</div>
      <div class="sec-h" style="margin-top:2px">Pause Menu</div>
      ${abandonConfirming ? `
        <div class="abandon-confirm">
          <p class="savecode-hint" style="margin:0 0 8px">Abandon this run? Bankroll, Payroll and everything built up this run are gone for good -- there's no undo.</p>
          <div class="bet-row">
            <button class="btn btn-ghost btn-sm" id="btn-abandon-cancel">Never Mind</button>
            <button class="btn btn-sm" id="btn-abandon-confirm" style="background:linear-gradient(180deg,var(--marquee-red-bright),var(--marquee-red));color:var(--cream);border-color:transparent">Yes, Abandon It</button>
          </div>
        </div>` : `
        <button class="btn btn-ghost btn-sm" id="btn-abandon-open" style="width:100%;color:var(--marquee-red-bright);border-color:var(--marquee-red-bright)">Abandon Run</button>`}
    </div></div>`;
  }
  function wireDrawer(){
    const open = document.getElementById("btn-drawer"); if(open) open.onclick = ()=>{ drawerOpen = true; render(); };
    const close = document.getElementById("btn-drawer-close"); if(close) close.onclick = ()=>{ abandonConfirming = false; drawerOpen = false; render(); };
    const back = document.getElementById("drawer-back"); if(back) back.addEventListener("click", e=>{ if(e.target===back){ abandonConfirming = false; drawerOpen=false; render(); } });
    root.querySelectorAll("[data-tip-pool]").forEach(el=>{ const d=state.dicePool.find(x=>x.uid===el.dataset.tipPool); if(d) wireHoldTip(el, DIE_KINDS[d.kind].name, DIE_KINDS[d.kind].desc); });
    const abandonOpen = document.getElementById("btn-abandon-open"); if(abandonOpen) abandonOpen.onclick = ()=>{ abandonConfirming = true; render(); };
    const abandonCancel = document.getElementById("btn-abandon-cancel"); if(abandonCancel) abandonCancel.onclick = ()=>{ abandonConfirming = false; render(); };
    const abandonConfirm = document.getElementById("btn-abandon-confirm"); if(abandonConfirm) abandonConfirm.onclick = ()=>{ abandonConfirming = false; drawerOpen = false; gameOver("You called it -- the run's abandoned."); };
  }

  function renderBlindSelect(){
    const tier = BLIND_TIERS[state.tierIdx];
    const boss = state.tierIdx===2 ? BOSS_BLINDS.find(x=>x.id===state.bossId) : null;
    root.innerHTML = `
      ${runHud({boss:false, right:`<div class="mini-stat"><span class="lbl">Retakes</span><b>${state.retakesLeft}</b></div>`})}
      <div class="screen">
        <div class="big-head">${boss ? boss.name : tier.label}</div>
        <div class="sub-c">${boss ? `<b style="color:var(--marquee-red-bright)">Director's Cut twist:</b> ${bossDescFor(boss)}` : "Hit the Target before your Bankroll runs dry."}</div>
        ${state.tierIdx<2 ? bossPreviewStrip() : ""}
        <div class="mini-stats">
          <div><span class="lbl">Target</span><b>${fmtU(state.target)}u</b></div>
          <div><span class="lbl">Stipend</span><b style="color:var(--emerald-bright)">+${state.lastSceneStipend||0}u</b></div>
          <div><span class="lbl">Dice</span><b>${state.dicePool.length}</b></div>
          <div><span class="lbl">Felt</span><b>${ALL_FELT_ZONES.filter(z=>feltLevelOf(z.id)>0).length}/${ALL_FELT_ZONES.length}</b></div>
        </div>
        ${kitStrip()}
        <div class="actionbar two"><span></span><button class="btn btn-primary btn-roll" id="btn-action">Action! &rarr;</button></div>
      </div>`;
    document.getElementById("btn-action").onclick = actionRoll;
    wireOwnedTips(); wireCommon(); wireBossPreviewTip();
  }

  // The shop -- named and dressed for the run's Era, every offer a compact
  // tile (hold one to read it), all on one screen.
  function renderShop(){
    const p = state.lastPayout || {base:4,heatBonus:0,interest:0,total:4};
    const th = curTheme();
    root.innerHTML = `
      <div class="hud">
        <div class="hud-row1">
          <div class="hud-left"><span class="hud-scene">Wrap Party · between scenes</span><span class="shop-name">${th.shop}</span></div>
          <div class="hud-tools">${optionsBtn()}</div>
        </div>
        <div class="hud-row2" style="grid-template-columns:auto auto auto minmax(0,1fr)">
          <div class="mini-stat payroll"><span class="lbl">Payroll</span><b style="font-size:17px">${fmtU(state.payroll)}u</b></div>
          <div class="mini-stat"><span class="lbl">Heat</span><span class="heat-meter">${heatPips()}</span></div>
          <div class="mini-stat"><span class="lbl">Retakes</span><b>${state.retakesLeft}</b></div>
          <div class="pay-line" style="text-align:right" title="${fmtU(p.base)} base + ${fmtU(p.heatBonus||0)} Heat + ${fmtU(p.interest)} interest"><span class="lbl">Wrap pay</span><b>+${fmtU(p.total)}u</b></div>
        </div>
      </div>
      <div class="screen" style="gap:8px">
        ${bossPreviewStrip()}
        <div class="sec">
          <div class="sec-h">Shop <small>hold a card for details</small><button class="tool-btn" id="btn-reroll-shop" ${state.payroll>=state.shopRerollCost?"":"disabled"}>Reroll ${state.shopRerollCost}u</button></div>
          ${state.pendingDiceBuy!=null ? `
            <div class="sec-h" style="margin-top:0"><small>Write off which die?</small><button class="tool-btn" id="btn-cancel-buy-die">Cancel</button></div>
            <div class="dice-select-grid">
              ${state.dicePool.map(d=>`<button class="die-pick" data-replace="${d.uid}" style="--tint:${DIE_KINDS[d.kind].tint||"var(--gold)"}"><span class="die die-sm">${dieFaceSVG(6, DIE_KINDS[d.kind].tint)}</span><span class="die-pick-label">${DIE_KINDS[d.kind].name}</span></button>`).join("")}
            </div>
          ` : `
          <div class="og g3">
            ${state.shopOffers.map((offer,idx)=>{
              if(!offer) return `<div class="offer sold">sold</div>`;
              if(offer.kind==="perk"){
                const meta = ITEM_TYPES[offer.slot], item = offer.item, current = state.equipped[offer.slot];
                return `<div class="offer" style="--genre-color:${meta.tint}" data-tip-shop="${idx}">
                  <span class="g-tag">${meta.name==="Supporting Cast"?"Cast":meta.name}</span>
                  <span class="o-name">${item.name}</span>
                  <span class="o-sub">${current?"replaces "+current.name:"empty slot"}</span>
                  <button class="buy" data-buy-shop="${idx}" ${state.payroll>=item.cost?"":"disabled"}>${item.cost}u</button>
                </div>`;
              }
              if(offer.kind==="felt"){
                const zone = FELT_ZONE_BY_ID[offer.zoneId];
                if(!zone) return `<div class="offer sold">sold</div>`;
                const isEcon = zone.group==="econ", cost = feltCost(offer.zoneId);
                const tint = FELT_GROUP_TINT[zone.group] || "var(--gold-bright)";
                return `<div class="offer" style="--genre-color:${tint}" data-tip-shop="${idx}">
                  <span class="g-tag">${isEcon?"Econ":"Felt"} ${feltLevelOf(offer.zoneId)?"· Lv "+feltLevelOf(offer.zoneId):""}</span>
                  <span class="o-name">${zone.label}</span>
                  <button class="buy" data-buy-shop="${idx}" ${state.payroll>=cost?"":"disabled"}>${fmtU(cost)}u</button>
                </div>`;
              }
              const def = DIE_KINDS[offer.dieKind];
              if(!def) return `<div class="offer sold">sold</div>`;
              // See dieRarityColorFor's own comment -- label is always just
              // "Die" now, the card's border color is what tells rarity
              // apart.
              return `<div class="offer" style="--genre-color:${dieRarityColorFor(offer.dieKind)}" data-tip-shop="${idx}">
                <span class="g-tag">Die</span>
                <span class="o-name">${def.name}</span>
                <button class="buy" data-buy-shop="${idx}" ${state.payroll>=def.cost?"":"disabled"}>${def.cost}u</button>
              </div>`;
            }).join("")}
          </div>`}
        </div>
        ${kitStrip()}
        <div class="actionbar two">
          <button class="btn btn-ghost" id="btn-buy-retake" ${state.payroll<state.retakeBuyCost?"disabled":""}>Retake ${state.retakeBuyCost}u</button>
          <button class="btn btn-primary btn-roll" id="btn-next">Next Scene &rarr;</button>
        </div>
      </div>`;
    document.getElementById("btn-next").onclick = nextScreening;
    const rbShop = document.getElementById("btn-reroll-shop");
    if(rbShop) rbShop.onclick = ()=>{ rerollShop(); onRerollEgg(); };
    const buyRetakeBtn = document.getElementById("btn-buy-retake");
    if(buyRetakeBtn) buyRetakeBtn.onclick = buyRetake;
    root.querySelectorAll("[data-buy-shop]").forEach(btn=>{ btn.onclick = ()=>buyShopOffer(+btn.dataset.buyShop); });
    const cancelBtn = document.getElementById("btn-cancel-buy-die");
    if(cancelBtn) cancelBtn.onclick = cancelBuyDie;
    root.querySelectorAll("[data-replace]").forEach(btn=>{ btn.onclick = ()=>completeBuyDie(btn.dataset.replace); });
    root.querySelectorAll("[data-tip-shop]").forEach(card=>{
      const offer = state.shopOffers[+card.dataset.tipShop];
      if(!offer) return;
      if(offer.kind==="perk") wireHoldTip(card, offer.item.name, offer.item.desc);
      else if(offer.kind==="felt"){ const zone = FELT_ZONE_BY_ID[offer.zoneId]; if(zone) wireHoldTip(card, zone.label, feltTipDesc(offer.zoneId)); }
      else if(offer.kind==="die"){ const def = DIE_KINDS[offer.dieKind]; if(def) wireHoldTip(card, def.name, def.desc); }
    });
    wireOwnedTips(); wireCommon(); wireBossPreviewTip();
  }

  function renderEnd(){
    const th = curTheme();
    root.innerHTML = `
      <div class="title-screen" style="padding-top:26px">
        <div class="now-playing">Era ${th.n} · ${th.name}</div>
        <h1 class="title-marquee" style="font-size:clamp(34px,10vw,58px); color:${state.won?'var(--gold-bright)':'var(--marquee-red-bright)'}">${state.won?"Awards Night":"That's a Wrap"}</h1>
        <p class="subtitle">${state.won ? "Eight antes wrapped. Your production made it through the whole shoot." : `Ended at Ante ${state.ante}, ${BLIND_TIERS[state.tierIdx].label}.${state.gameOverReason ? " "+state.gameOverReason : ""}`}</p>
        ${state.won && state.eraUnlockNote ? `<p class="subtitle" style="color:var(--gold-bright); font-weight:600;">${state.eraUnlockNote}</p>` : ""}
        ${state.won && state.characterUnlockNote ? `<p class="subtitle" style="color:var(--emerald-bright); font-weight:600;">${state.characterUnlockNote}</p>` : ""}
        <div class="mini-stats" style="width:100%">
          <div><span class="lbl">Ante</span><b>${state.highestAnte}</b></div>
          <div><span class="lbl">Scenes</span><b>${state.screeningsWon}</b></div>
          <div><span class="lbl">Heat</span><b>${state.heat}/${heatMaxFor()}</b></div>
          <div><span class="lbl">Payroll</span><b>${fmtU(state.payroll)}u</b></div>
        </div>
        <div class="title-btns">
          ${state.won && !state.endlessMode ? `<button class="btn btn-emerald" id="btn-endless">Keep Rolling &infin;</button>` : ""}
          ${!state.won ? `<button class="btn btn-primary" id="btn-retry">Retry</button>` : ""}
          <button class="btn ${state.won?'btn-gold':'btn-ghost'}" id="btn-restart">Roll Again</button>
        </div>
        ${state.won && !state.endlessMode ? `<p class="subtitle" style="font-size:11.5px">No more antes after this one -- Keep Rolling lets the same run carry on past Ante ${MAX_ANTE} instead, Target and the boss pool both still climbing, for as long as you can hold on.</p>` : ""}
      </div>`;
    document.getElementById("btn-restart").onclick = restart;
    const retryBtn = document.getElementById("btn-retry");
    if(retryBtn) retryBtn.onclick = retryRun;
    // Keep Rolling: same run, same equipment and Payroll, just doesn't stop
    // here -- flips endlessMode on (see settleRound's own comment) and
    // drops straight into the next ante's shop, same tail a real scene
    // clear lands on (enterShop, see settleRound).
    const endlessBtn = document.getElementById("btn-endless");
    if(endlessBtn) endlessBtn.onclick = ()=>{ state.endlessMode = true; enterShop(); };
    if(state.won && !renderEnd._burst){ renderEnd._burst = true; setTimeout(()=>{ burst(th.parts, innerWidth/2, innerHeight*.35, 90); sting("big"); }, 200); }
    if(!state.won) renderEnd._burst = false;
  }

  function render(){
    if(state.screen!=="play"){ drawerOpen = false; abandonConfirming = false; }
    applyTheme();
    if(state.dieLostPrompt){ renderDieLostPrompt(); renderOptionsBack(); try{ syncCrowd(); }catch(e){} return; }
    if(state.screen==="title") renderTitle();
    else if(state.screen==="tutorial") renderTutorial();
    else if(state.screen==="character") renderCharacterSelect();
    else if(state.screen==="difficulty") renderDifficultySelect();
    else if(state.screen==="play") renderPlay();
    else if(state.screen==="blindselect") renderBlindSelect();
    else if(state.screen==="shop"){ renderShop(); if(render._shopKey!==state.ante+":"+state.tierIdx){ render._shopKey=state.ante+":"+state.tierIdx; armPostCredits(); } }
    else if(state.screen==="end") renderEnd();
    if(state.screen!=="shop") render._shopKey = null;
    // Rendered unconditionally, same as applyTheme above -- #options-back
    // lives outside #app (see its static HTML) so it survives whichever
    // screen's renderX() just replaced #app's innerHTML, and needs its own
    // refresh call here to stay in sync (open/closed, current slider/speed
    // values) regardless of which screen that was.
    renderOptionsBack();
    try{ syncCrowd(); }catch(e){}
  }


  /* live-open viewers: keep state across a hot republish */
  try{
    if(window.claude && window.claude.hot){
      window.claude.hot.snapshot(()=>state);
      const boot = (data)=>{
        if(data && data.screen) state = data;
        render();
      };
      window.claude.hot.ready ? window.claude.hot.ready(boot) : boot(window.claude.hot.data);
    } else {
      render();
    }
  }catch(e){ render(); }

})();
</script></body></html>
