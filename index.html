    return out.length ? out : [1];
  }
  function clearBetZone(getAmount, setAmount){
    if(getAmount()<=0) return;
    setAmount(0);
    render(); saveState();
  }

  // Pass/Don't Pass can only be placed (or pulled back) before a point is
  // established; once a point is on, the line bet rides untouched. Tapping the
  // side you don't currently have switches to it, starting fresh at 1 unit.
  function tapLineBet(type){
    if(state.rolling || state.roundComplete || !(state.phase==="comeout" && state.point===null)) return;
    if(state.lineBet && state.lineBet.type!==type) state.lineBet = null;
    addBetUnit(
      () => (state.lineBet && state.lineBet.type===type) ? state.lineBet.amount : 0,
      (v) => {
        if(v<=0){ state.lineBet = null; }
        else { state.lineBet = { type, amount: v, odds: (state.lineBet&&state.lineBet.type===type)?state.lineBet.odds:0 }; }
      });
  }
  function clearLineBet(type){
    if(state.rolling || state.roundComplete || !(state.phase==="comeout" && state.point===null)) return;
    if(!(state.lineBet && state.lineBet.type===type)) return;
    state.lineBet = null;
    render(); saveState();
  }

  // True while THIS scene's boss (a Director's Cut round only -- see
  // BOSS_BLINDS' four betBan entries) bars a whole bet type outright, for
  // the rest of the scene. Every tap*Bet function below checks this before
  // placing anything, and renderPlay checks it too so the banned zone shows
  // as closed rather than just silently refusing taps.
  function betBanned(type){
    const boss = state.tierIdx===2 ? BOSS_BLINDS.find(x=>x.id===state.bossId) : null;
    return !!(boss && boss.betBan===type);
  }

  // Field is a one-roll bet: it can be added to or pulled back before any
  // roll, come-out or point, independent of whatever the line bet is doing.
  function tapFieldBet(){
    if(state.rolling || state.roundComplete || state.phase==="select" || betBanned("field")) return;
    addBetUnit(() => state.fieldBet||0, (v) => { state.fieldBet = v; });
  }
  function clearFieldBet(){
    if(state.rolling || state.roundComplete || state.phase==="select") return;
    clearBetZone(() => state.fieldBet||0, (v) => { state.fieldBet = v; });
  }

  // The "back bet": true-odds money behind an existing line bet. Real craps
  // rules only let you take (or lay) odds once a point is on, and it rides
  // alongside the line bet, resolving together with it.
  const ODDS_PAYOUTS = { 4:[2,1], 10:[2,1], 5:[3,2], 9:[3,2], 6:[6,5], 8:[6,5] };
  function oddsWinnings(point, isPass, amount){
    const [num, den] = ODDS_PAYOUTS[point];
    return isPass ? Math.round(amount*num/den) : Math.round(amount*den/num);
  }
  function oddsLabel(point, type){
    const [num, den] = ODDS_PAYOUTS[point];
    return type==="pass" ? `${num}:${den}` : `${den}:${num}`;
  }
  // Unit-amount display compression -- Score and Payroll no longer compound
  // run-over-run (see the Score/Payroll split), but a long "keep rolling"
  // build stacking payout multipliers can still stretch a single number wide
  // enough to break the felt's tight layout. Anything 1000u or more gets
  // rendered as 1k/1m/1b (one decimal place, trimmed) instead of the raw
  // digit string; smaller numbers print exactly as before. Callers that
  // prepend their own +/- sign should pass Math.abs-free raw values -- this
  // already emits its own leading "-" for negatives, so a caller doing
  // `(n>=0?"+":"")+fmtU(n)` never double-signs.
  function fmtU(n){
    n = Math.round(n||0);
    // Endless (state.endlessMode, see actInfo/settleRound) never caps
    // Target's own growth curve, so this is the one place that has to keep
    // up with it however big it gets. `n||0` above already turns a stray
    // NaN into a clean 0; this catches the only other way a huge-but-legit
    // number could still go bad -- true overflow into +/-Infinity -- so the
    // HUD prints "∞" instead of the literal string "Infinity" if a number
    // somehow ever gets there, rather than however Math.round/toFixed would
    // otherwise mangle it. Neither branch should be reachable through
    // ordinary play (every real add-site keeps its inputs finite), this is
    // belt-and-suspenders so the display can never actually break.
    if(!isFinite(n)) return n<0 ? "-∞" : "∞";
    const neg = n<0;
    const abs = Math.abs(n);
    let out;
    // t (trillion) covers anything a genuinely long Endless run plausibly
    // reaches; past that, a fixed unit suffix would just keep needing a new
    // letter forever, so it switches to compact scientific notation instead
    // -- still a short, readable string at any magnitude, never a raw wall
    // of digits.
    if(abs>=1e15) out = abs.toExponential(2).replace("e+","e");
    else if(abs>=1e12) out = trimDec(abs/1e12)+"t";
    else if(abs>=1e9) out = trimDec(abs/1e9)+"b";
    else if(abs>=1e6) out = trimDec(abs/1e6)+"m";
    else if(abs>=1e3) out = trimDec(abs/1e3)+"k";
    else out = String(abs);
    return (neg?"-":"")+out;
  }
  function trimDec(x){
    let s = x.toFixed(1);
    if(s.endsWith(".0")) s = s.slice(0,-2);
    return s;
  }
  function tapOdds(){
    if(state.rolling || state.roundComplete || !state.lineBet || state.phase!=="point" || state.point===null || betBanned("odds")) return;
    addBetUnit(() => state.lineBet.odds||0, (v) => { state.lineBet.odds = v; });
  }
  function clearOdds(){
    if(state.rolling || state.roundComplete || !state.lineBet || state.phase!=="point" || state.point===null) return;
    clearBetZone(() => state.lineBet.odds||0, (v) => { state.lineBet.odds = v; });
  }

  function resolveLineBet(passWins, sum, isRepeatHand, roll){
    if(!state.lineBet) return;
    if(state.lineBet.type==="dontpass" && passWins===null){
      // bar the 12: push, stake and odds both return, no win or loss
      state.lastBetNote = { push:true, amount:state.lineBet.amount, odds:state.lineBet.odds||0, label:"Don't Pass", reason:"bar the 12" };
      state.lineBet = null;
      return;
    }
    const win = state.lineBet.type==="pass" ? passWins : !passWins;
    const odds = state.lineBet.odds||0;
    const oddsWin = (odds>0 && state.point) ? oddsWinnings(state.point, state.lineBet.type==="pass", odds) : 0;
    const label = state.lineBet.type==="pass"?"Pass Line":"Don't Pass";
    if(win){
      const paidBase = resolvePayout({ amount:state.lineBet.amount, betType:"line", number:state.point, rolledSum:sum, isRepeatHand, roll });
      const paidOdds = odds>0 ? resolvePayout({ amount:oddsWin, betType:"odds", number:state.point, rolledSum:sum, isRepeatHand, roll }) : 0;
      state.lastBetNote = { win:true, amount:paidBase, odds, oddsWin:paidOdds, label };
    } else {
      const lostBase = resolveLossAmount({ amount:state.lineBet.amount, betType:"line", number:state.point, rolledSum:sum, isRepeatHand, roll });
      const lostOdds = odds>0 ? resolveLossAmount({ amount:odds, betType:"odds", number:state.point, rolledSum:sum, isRepeatHand, roll }) : { amount:0, pushed:false };
      state.lastBetNote = lostBase.pushed
        ? { push:true, amount:state.lineBet.amount, odds, label, reason:"cushioned" }
        : { win:false, amount:lostBase.amount, odds: lostOdds.pushed?0:lostOdds.amount, label };
    }
    state.lineBet = null;
  }

  // Field is a single-roll bet: wins on 2,3,4,9,10,11,12 (2 pays double, 12 pays
  // triple), loses on 5,6,7,8. It never establishes a point, and it resolves
  // independently of the line bet on every roll it's live for. A win leaves the
  // same amount riding for the next roll -- only a loss clears the zone -- so a
  // hot Field bet keeps paying without needing to be re-tapped every time.
  const FIELD_PAYOUTS = { 2:2, 3:1, 4:1, 9:1, 10:1, 11:1, 12:3 };
  function resolveFieldBet(sum, isRepeatHand, roll){
    if(!state.fieldBet) return;
    const amount = state.fieldBet;
    const mult = FIELD_PAYOUTS[sum];
    if(mult){
      const paid = resolvePayout({ amount:amount*mult, stake:amount, betType:"field", number:null, rolledSum:sum, isRepeatHand, roll });
      const effMult = amount>0 ? +(paid/amount).toFixed(2) : mult;
      state.lastFieldNote = { win:true, amount:paid, label:"Field", extra: effMult>1?("pays "+effMult+":1"):null };
      // bet stays on the table after a win -- ride it into the next roll
    } else {
      const lost = resolveLossAmount({ amount, stake:amount, betType:"field", number:null, rolledSum:sum, isRepeatHand, roll });
      state.lastFieldNote = lost.pushed
        ? { push:true, amount, label:"Field" }
        : { win:false, amount:lost.amount, label:"Field" };
      state.fieldBet = 0;
    }
  }

  function tapHardBet(n){
    if(state.rolling || state.roundComplete || state.phase==="select" || betBanned("hard")) return;
    if(!state.hardBets) state.hardBets = { 4:0, 6:0, 8:0, 10:0 };
    addBetUnit(() => state.hardBets[n]||0, (v) => { state.hardBets[n] = v; });
  }
  function clearHardBet(n){
    if(state.rolling || state.roundComplete || state.phase==="select") return;
    if(!state.hardBets) return;
    clearBetZone(() => state.hardBets[n]||0, (v) => { state.hardBets[n] = v; });
  }

  // Hardway side bets (4/6/8/10) ride independently of the Pass Line: they win
  // if their number lands as a double before it lands "easy" or a 7 shows.
  // A seven clears every live hardway bet, not just the shooter's point. A
  // win leaves the same amount riding for the next roll instead of clearing
  // it -- only a loss (or a push) takes the bet off the table.
  //
  // This is called from doRoll BEFORE the come-out/point phase-transition
  // block runs (see doRoll), so state.phase here still reflects whichever
  // phase the roll that just happened was actually made in -- exactly what's
  // needed to tell a comeout natural seven (a win for the Pass Line, phase
  // still "comeout") apart from a point-phase seven-out (phase "point").
  // hardwaySurvivesComeoutNatural (Lovers, see CHARACTERS/its own comment
  // there) rides on exactly that distinction: it spares a live Hardway bet
  // on the former, same as the Pass Line itself is untouched by it, while a
  // real seven-out still clears it same as ever.
  const HARDWAY_PAYOUTS = { 4:7, 6:9, 8:9, 10:7 };
  function resolveHardways(a, b, sum, isRepeatHand, roll){
    const character = CHARACTERS[state.characterId];
    const comeoutNaturalSeven = sum===7 && state.phase==="comeout";
    const spareOnComeoutNatural = comeoutNaturalSeven && !!(character && character.hardwaySurvivesComeoutNatural);
    state.hardResolutions = [];
    [4,6,8,10].forEach(n=>{
      const amount = state.hardBets[n];
      if(!amount) return;
      if(a===b && sum===n){
        const paid = resolvePayout({ amount:amount*HARDWAY_PAYOUTS[n], stake:amount, betType:"hard", number:n, rolledSum:sum, isRepeatHand, roll });
        state.hardResolutions.push({ win:true, number:n, amount:paid });
        // bet stays on the table after a win
      } else if(spareOnComeoutNatural){
        // Lovers-only: this seven is a comeout natural, not a seven-out --
        // the bet rides on untouched, same as the Pass Line does.
      } else if(sum===n || sum===7){
        const lost = resolveLossAmount({ amount, stake:amount, betType:"hard", number:n, rolledSum:sum, isRepeatHand, roll });
        state.hardResolutions.push(lost.pushed ? { push:true, number:n, amount } : { win:false, number:n, amount:lost.amount });
        state.hardBets[n] = 0;
      }
    });
  }

  function tapPropBet(key){
    if(state.rolling || state.roundComplete || state.phase==="select") return;
    if(!state.propBets) state.propBets = { anySeven:0, anyCraps:0, snakeEyes:0, boxcars:0 };
    addBetUnit(() => state.propBets[key]||0, (v) => { state.propBets[key] = v; });
  }
  function clearPropBet(key){
    if(state.rolling || state.roundComplete || state.phase==="select") return;
    if(!state.propBets) return;
    clearBetZone(() => state.propBets[key]||0, (v) => { state.propBets[key] = v; });
  }

  // The one-roll proposition bets in the middle of the layout, alongside the
  // Hardways -- Any 7, Any Craps (2/3/12), and the two single-number long
  // shots, Snake Eyes (2) and Boxcars (12). Like Field, these resolve on
  // every single roll they're live for, but a win leaves the same amount
  // riding into the next roll -- only a loss clears the zone.
  const PROP_DEFS = [
    { key:"snakeEyes", name:"Snake Eyes", label:"2",        sub:"snake eyes",  payout:30, dice:[1,1] },
    { key:"anyCraps",  name:"Any Craps",  label:"ANY CRAPS",sub:"2, 3 or 12",  payout:7 },
    { key:"anySeven",  name:"Any 7",      label:"ANY 7",    sub:"any seven",   payout:4 },
    { key:"boxcars",   name:"Boxcars",    label:"12",       sub:"boxcars",     payout:30, dice:[6,6] },
  ];
  const PROP_NAMES = Object.fromEntries(PROP_DEFS.map(p=>[p.key, p.name]));
  const PROP_PAYOUTS = { snakeEyes:30, anyCraps:7, anySeven:4, boxcars:30 };
  const PROP_TESTS = {
    snakeEyes: (sum)=> sum===2,
    boxcars:   (sum)=> sum===12,
    anyCraps:  (sum)=> sum===2 || sum===3 || sum===12,
    anySeven:  (sum)=> sum===7,
  };
  function resolvePropBets(sum, isRepeatHand, roll){
    state.propResolutions = [];
    if(!state.propBets) return;
    Object.keys(state.propBets).forEach(key=>{
      const amount = state.propBets[key];
      if(!amount) return;
      const test = PROP_TESTS[key];
      if(test && test(sum)){
        const paid = resolvePayout({ amount:amount*PROP_PAYOUTS[key], stake:amount, betType:"prop", number:key, rolledSum:sum, isRepeatHand, roll });
        state.propResolutions.push({ win:true, key, amount:paid });
        // bet stays on the table after a win
      } else {
        const lost = resolveLossAmount({ amount, stake:amount, betType:"prop", number:key, rolledSum:sum, isRepeatHand, roll });
        state.propResolutions.push(lost.pushed ? { push:true, key, amount } : { win:false, key, amount:lost.amount });
        state.propBets[key] = 0;
      }
    });
  }

  // "Dealer bets": Place bets on 4/5/6/8/9/10 -- the dealer sets your chips in
  // the box for you, unlike Pass Line or Field, which you place yourself. A
  // number wins any way it lands (not just hard); a seven clears every live
  // place bet, same as the hardways.
  const PLACE_PAYOUTS = { 4:[9,5], 10:[9,5], 5:[7,5], 9:[7,5], 6:[7,6], 8:[7,6] };
  function tapPlaceBet(n){
    if(state.rolling || state.roundComplete || state.phase==="select" || betBanned("place")) return;
    if(state.phase!=="point") return; // Dealer Bets don't work in the come-out phase -- need a point on first.
    if(!state.placeBets) state.placeBets = { 4:0, 5:0, 6:0, 8:0, 9:0, 10:0 };
    addBetUnit(() => state.placeBets[n]||0, (v) => { state.placeBets[n] = v; });
  }
  function clearPlaceBet(n){
    if(state.rolling || state.roundComplete || state.phase==="select") return;
    if(state.phase!=="point") return;
    if(!state.placeBets) return;
    clearBetZone(() => state.placeBets[n]||0, (v) => { state.placeBets[n] = v; });
  }

  // Come: the real way to get new money working on a number once the
  // point's already on -- see resolveComeBets for the full mechanic. Like
  // Dealer Bets, only placeable once a point is on (making one on come-out
  // would just be a redundant second Pass Line). This only ever touches the
  // pending come-BOX amount (state.comeBet) -- once a roll has moved it onto
  // a number (state.comeBets[n]), it's a working bet, same as a real come
  // bet, and isn't something the player can just pull back off the table.
  function tapComeBet(){
    if(state.rolling || state.roundComplete || state.phase!=="point") return;
    if(!state.comeBet) state.comeBet = { amount:0 };
    addBetUnit(() => state.comeBet.amount||0, (v) => { state.comeBet.amount = v; });
  }
  function clearComeBet(){
    if(state.rolling || state.roundComplete || state.phase!=="point") return;
    if(!state.comeBet) return;
    clearBetZone(() => state.comeBet.amount||0, (v) => { state.comeBet.amount = v; });
  }

  // Don't Come: same placement rule as Come (only once a point is on), same
  // "only the pending box is pullable, an established lay rides until it
  // wins or loses" shape -- see resolveDontComeBets for the full mechanic.
  function tapDontComeBet(){
    if(state.rolling || state.roundComplete || state.phase!=="point") return;
    if(!state.dontComeBet) state.dontComeBet = { amount:0 };
    addBetUnit(() => state.dontComeBet.amount||0, (v) => { state.dontComeBet.amount = v; });
  }
  function clearDontComeBet(){
    if(state.rolling || state.roundComplete || state.phase!=="point") return;
    if(!state.dontComeBet) return;
    clearBetZone(() => state.dontComeBet.amount||0, (v) => { state.dontComeBet.amount = v; });
  }

  // Felt Upgrade, take two: instead of one flat table-wide level, every
  // individual bet zone on the layout has its own felt piece, bought
  // piecemeal in the shop (see pickFeltZone/buyFeltZone) and leveled up
  // independently -- +rate units per level, added only to a payout landing
  // on THAT zone (see resolvePayout), never the whole table at once. Each
  // zone still scales linearly with its own level, same as the old system;
  // what's new is that the RATE differs zone to zone, and it's not picked
  // arbitrarily -- it's read straight off the payout tables already above,
  // on the theory that a zone worth more to hit is worth more to upgrade:
  //   - Place bets mirror PLACE_PAYOUTS: 4/10 pay best (9:5, rarest to make)
  //     so their felt climbs fastest; 6/8 pay worst (7:6, most common) so
  //     theirs climbs slowest; 5/9 (7:5) sit in the middle.
  //   - Hardways mirror HARDWAY_PAYOUTS, which runs the OPPOSITE way: hard
  //     6/8 are the rarer, better-paying hardway (9:1) so THEIR felt climbs
  //     fastest, hard 4/10 (7:1) climb slower -- the same number can be a
  //     slow felt as a Place bet and a fast one as a Hardway.
  //   - Props mirror PROP_PAYOUTS: the 1-in-36 long shots (Snake Eyes,
  //     Boxcars, 30:1) climb fastest of anything on the board.
  //   - The Line (Pass and Don't Pass share one felt piece -- the table
  //     doesn't care which side you're on) and Field are the two most
  //     common resolutions in the game, so they're both the slowest climbers.
  const FELT_ZONES = [
    { id:"place_4",  betType:"place", number:4,  label:"Place 4",     group:"place",   rate:3 },
    { id:"place_5",  betType:"place", number:5,  label:"Place 5",     group:"place",   rate:2 },
    { id:"place_6",  betType:"place", number:6,  label:"Place 6",     group:"place",   rate:1 },
    { id:"place_8",  betType:"place", number:8,  label:"Place 8",     group:"place",   rate:1 },
    { id:"place_9",  betType:"place", number:9,  label:"Place 9",     group:"place",   rate:2 },
    { id:"place_10", betType:"place", number:10, label:"Place 10",    group:"place",   rate:3 },
    { id:"hard_4",   betType:"hard",  number:4,  label:"Hardway 4",   group:"hardway", rate:2 },
    { id:"hard_6",   betType:"hard",  number:6,  label:"Hardway 6",   group:"hardway", rate:3 },
    { id:"hard_8",   betType:"hard",  number:8,  label:"Hardway 8",   group:"hardway", rate:3 },
    { id:"hard_10",  betType:"hard",  number:10, label:"Hardway 10",  group:"hardway", rate:2 },
    { id:"prop_snakeEyes", betType:"prop", number:"snakeEyes", label:"Snake Eyes", group:"prop", rate:5 },
    { id:"prop_boxcars",   betType:"prop", number:"boxcars",   label:"Boxcars",    group:"prop", rate:5 },
    { id:"prop_anyCraps",  betType:"prop", number:"anyCraps",  label:"Any Craps",  group:"prop", rate:3 },
    { id:"prop_anySeven",  betType:"prop", number:"anySeven",  label:"Any 7",      group:"prop", rate:2 },
    { id:"field", betType:"field", number:null, label:"Field",    group:"field", rate:1 },
    { id:"line",  betType:"line",  number:null, label:"The Line", group:"line",  rate:1 },
    { id:"come",  betType:"come",  number:null, label:"Come",     group:"come",  rate:1 },
    { id:"dont_come", betType:"dontcome", number:null, label:"Don't Come", group:"dont_come", rate:1 },
  ];
  // Econ felt: the other half of the felt system, kept as its own array
  // rather than folded into FELT_ZONES above, specifically so its ids never
  // land in drawFeltOffer's normal bag (see pickFeltZone) -- these pay
  // Payroll, not Score, and stay rarer in the shop on purpose (see
  // RARE_FELT_CHANCE), same spirit as a rare die sitting in its own pool
  // apart from the common ones. Unlike a Score zone (which only ever fires
  // when a bet on that exact zone wins, via feltBonusFor/resolvePayout), an
  // Econ zone fires on a ROLL OUTCOME -- `matches` mirrors HAND_TYPES' own
  // `test(a,b)` shape -- independent of any bet riding on it at all (see
  // resolveOnRoll). Both kinds level up completely independently and both
  // can be owned at once; there's no exclusivity between "help Score" and
  // "help Econ" felt. costMult (read by feltCost) prices Econ zones a bit
  // steeper per level than a Score zone of the same rate, since Payroll is
  // the more valuable, more durable resource of the two.
  const ECON_FELT_ZONES = [
    { id:"econ_snake",   label:"On Snake Eyes",   group:"econ", rate:2, costMult:1.6, matches:(a,b,sum,hand)=>hand.id==="snake" },
    { id:"econ_boxcars", label:"On Boxcars",      group:"econ", rate:2, costMult:1.6, matches:(a,b,sum,hand)=>hand.id==="boxcars" },
    { id:"econ_seven",   label:"On a Natural 7",  group:"econ", rate:1, costMult:1.6, matches:(a,b,sum,hand)=>hand.id==="seven" },
    { id:"econ_double",  label:"On Any Double",   group:"econ", rate:1, costMult:1.6, matches:(a,b,sum,hand)=>a===b },
  ];
  const ALL_FELT_ZONES = [...FELT_ZONES, ...ECON_FELT_ZONES];
  const FELT_ZONE_BY_ID = Object.fromEntries(ALL_FELT_ZONES.map(z=>[z.id,z]));
  const FELT_GROUP_TINT = { place:"#9db6cf", hardway:"#c48bde", prop:"#c48bde", field:"var(--emerald-bright)", line:"var(--gold-bright)", come:"#8ec6e6", dont_come:"#e2584c", econ:"#d8a94c" };
  // Each of a shop visit's 3 felt slots has roughly a 1-in-6 shot at pulling
  // an Econ zone instead of a standard scoring one -- see pickFeltZone.
  const RARE_FELT_CHANCE = 0.16;

  // Line and odds payouts both land on the same physical spot on the felt
  // (the Pass Line), so they share the "line" zone; every other bet type
  // maps straight to one zone by its number.
  function feltZoneIdFor(betType, number){
    if(betType==="line" || betType==="odds") return "line";
    if(betType==="field") return "field";
    if(betType==="place") return "place_"+number;
    if(betType==="hard") return "hard_"+number;
    if(betType==="prop") return "prop_"+number;
    if(betType==="come") return "come";
    if(betType==="dontcome") return "dont_come";
    return null;
  }
  function feltLevelOf(zoneId){
    return (state.feltLevels && state.feltLevels[zoneId]) || 0;
  }
  // A zone's felt bonus this payout: +rate units for every level bought.
  function feltBonusFor(betType, number){
    const zoneId = feltZoneIdFor(betType, number);
    if(!zoneId) return 0;
    const zone = FELT_ZONE_BY_ID[zoneId];
    return zone ? feltLevelOf(zoneId) * zone.rate : 0;
  }
  // Small "+Nu" suffix for a zone tile's own payout-ratio text (point-pay/
  // hard-payout/field-pays) -- the static X:Y ratio never itself changes
  // with a felt upgrade (the bonus is a flat add-on, applied in
  // resolvePayout via feltBonusFor), so without this the printed odds would
  // silently go stale the moment a player levels that zone's felt. "" when
  // the zone has never been upgraded, same convention as feltLevelBadge.
  function feltPaySuffix(zoneId){
    const zone = FELT_ZONE_BY_ID[zoneId];
    const lvl = zone ? feltLevelOf(zoneId) : 0;
    if(!lvl) return "";
    return ` <span class="felt-bonus-tag">+${fmtU(lvl*zone.rate)}u</span>`;
  }
  // A faster-scaling zone (see rate above) costs more to upgrade too, on the
  // same linear per-level curve the old single Felt Upgrade used. An Econ
  // zone's own costMult (see ECON_FELT_ZONES) prices it steeper per level
  // than a Score zone of the same rate, since it's paying the more valuable
  // Payroll rather than Score.
  function feltCost(zoneId){
    const zone = FELT_ZONE_BY_ID[zoneId];
    if(!zone) return Infinity;
    const mult = zone.costMult || 1;
    const base = (3 + zone.rate*2) * mult, step = (2 + zone.rate) * mult;
    return Math.round(base + feltLevelOf(zoneId)*step);
  }
  function buyFeltZone(zoneId){
    const zone = FELT_ZONE_BY_ID[zoneId];
    if(!zone) return;
    const cost = feltCost(zoneId);
    if(state.payroll < cost) return;
    state.payroll -= cost;
    if(!state.feltLevels) state.feltLevels = {};
    state.feltLevels[zoneId] = (state.feltLevels[zoneId]||0) + 1;
    // Studio Legacy: a permanent, never-reset stack, earned only while it's
    // the equipped Film item at the moment of THIS purchase -- see its own
    // comment in EQUIPMENT_POOL.
    if(state.equipped.film && state.equipped.film.id==="film_studio_legacy"){
      state.studioLegacyStacks = (state.studioLegacyStacks||0) + 1;
    }
    render(); saveState();
  }
  // Shuffled draw-bag across every felt zone, same anti-repeat trick as the
  // equipment offer bags (drawEquipOffer) -- guarantees you see every zone
  // once before any of them repeat, instead of a plain random draw handing
  // back the same 2-3 zones shop visit after shop visit.
  function drawFeltOffer(){
    if(!state.feltOfferBag || !state.feltOfferBag.length){
      const bag = FELT_ZONES.map(z=>z.id);
      for(let i=bag.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [bag[i],bag[j]]=[bag[j],bag[i]]; }
      state.feltOfferBag = bag;
    }
    return state.feltOfferBag.pop();
  }
  // Same anti-repeat draw-bag trick, but drawing only from the small Econ
  // pool -- kept completely separate from drawFeltOffer's own bag so Econ
  // zones never dilute (or get diluted by) the standard scoring draw; see
  // pickFeltZone for how often this gets reached for at all.
  function drawEconFeltOffer(){
    if(!state.econFeltOfferBag || !state.econFeltOfferBag.length){
      const bag = ECON_FELT_ZONES.map(z=>z.id);
      for(let i=bag.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [bag[i],bag[j]]=[bag[j],bag[i]]; }
      state.econFeltOfferBag = bag;
    }
    return state.econFeltOfferBag.pop();
  }
  // Felt-piece color ramp: a zone's tile visibly shifts from its resting
  // color toward a hot gold-to-crimson glow as ITS level climbs, saturating
  // by FELT_COLOR_MAX so it reads at a glance without needing an unbounded
  // palette. Used both on the play-screen layout tiles and the shop cards.
  const FELT_COLOR_MAX = 6;
  const FELT_COLOR_STOPS = [ [110,195,158], [242,201,107], [226,88,76] ]; // emerald-bright -> gold-bright -> marquee-red-bright
  function feltGlowRGB(level){
    if(!level) return null;
    const t = Math.min(1, level/FELT_COLOR_MAX);
    const seg = t*(FELT_COLOR_STOPS.length-1);
    const i = Math.min(FELT_COLOR_STOPS.length-2, Math.floor(seg));
    const localT = seg - i;
    const c0 = FELT_COLOR_STOPS[i], c1 = FELT_COLOR_STOPS[i+1];
    return [
      Math.round(c0[0]+(c1[0]-c0[0])*localT),
      Math.round(c0[1]+(c1[1]-c0[1])*localT),
      Math.round(c0[2]+(c1[2]-c0[2])*localT),
    ];
  }
  function feltGlowColor(level){
    const rgb = feltGlowRGB(level);
    return rgb ? `rgb(${rgb[0]},${rgb[1]},${rgb[2]})` : null;
  }
  function feltGlowColorAlpha(level, alpha){
    const rgb = feltGlowRGB(level);
    return rgb ? `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${alpha})` : null;
  }
  // Small "LVL n" corner pill for a play-screen zone TILE -- position:absolute,
  // anchored against that tile's own position:relative (see .point-box/
  // .hard-tile/.zone-field/.zone-bar). "" when the zone has never been upgraded.
  function feltLevelBadge(zoneId){
    const lvl = feltLevelOf(zoneId);
    if(!lvl) return "";
    const glow = feltGlowColor(lvl);
    return `<span class="felt-lvl-badge mono" style="background:${glow}; box-shadow:0 0 8px ${glow};">LV${lvl}</span>`;
  }
  // Same "LVL n" readout, but flowing inline rather than absolutely
  // positioned -- for contexts like a shop card's title where there's no
  // positioned tile to anchor a corner badge against.
  function feltLevelPill(zoneId){
    const lvl = feltLevelOf(zoneId);
    if(!lvl) return "";
    const glow = feltGlowColor(lvl);
    return `<span class="felt-lvl-pill mono" style="background:${glow};">LV${lvl}</span>`;
  }
  // A zone tile's own felt piece visibly recolors as its level climbs. This
  // sets --felt-edge/--felt-fill (CSS custom properties, not a raw
  // box-shadow) so the tint layers on top of whatever selected/active/placed
  // box-shadow that tile's CSS already draws for its bet state, instead of
  // replacing it outright -- every .point-box/.hard-tile/.zone-field/
  // .zone-bar box-shadow rule includes these vars for exactly that reason.
  // "" when the zone has never been upgraded (vars fall back to transparent).
  function feltTileGlowStyle(zoneId){
    const lvl = feltLevelOf(zoneId);
    if(!lvl) return "";
    return `--felt-edge:${feltGlowColor(lvl)}; --felt-fill:${feltGlowColorAlpha(lvl,0.22)};`;
  }

  // Clears everything currently pullable, respecting the same rules each zone's
  // own tap already follows: a line bet only comes back off before a point is
  // on (once it's on it has to ride), and Dealer Bets/odds only come off while
  // they're "ON" (point phase). Nothing here is more permissive than tapping
  // each zone by hand would be -- it just does all of them in one go.
  function clearAllBets(){
    if(state.rolling || state.roundComplete || state.phase==="select") return;
    if(state.phase==="comeout" && state.point===null){
      state.lineBet = null;
    } else if(state.lineBet){
      state.lineBet.odds = 0;
    }
    state.fieldBet = 0;
    state.hardBets = { 4:0, 6:0, 8:0, 10:0 };
    state.propBets = { anySeven:0, anyCraps:0, snakeEyes:0, boxcars:0 };
    if(state.phase==="point"){
      state.placeBets = { 4:0, 5:0, 6:0, 8:0, 9:0, 10:0 };
      // Only the pending come-BOX amount clears here -- once a come bet's
      // moved onto a number (state.comeBets[n]) it's an established bet, and
      // (same as real craps) can't just be pulled back off the table the way
      // a Place bet can; it only ever comes off by winning or losing.
      state.comeBet = { amount:0 };
      state.dontComeBet = { amount:0 }; // same rule as the come box -- an established Don't Come lay isn't pullable either.
    }
    render(); saveState();
  }

  // Flips the Remove Bets toggle -- see removeMode's own comment in
  // freshState. Guarded the same way every other roll-adjacent control is
  // (no flipping modes mid-animation), but deliberately NOT guarded by
  // roomLeft()/roundComplete the way clearAllBets is -- turning remove mode
  // on is exactly what you want when the table's full and there's no room
  // left to add anything (see renderBetPanel), and it's harmless with
  // nothing on the table at all (every clear* function already no-ops on an
  // empty zone).
  function toggleRemoveMode(){
    if(state.rolling || state.roundComplete || state.phase==="select") return;
    state.removeMode = !state.removeMode;
    render(); saveState();
  }

  // "Place Same Bets": restores whatever was riding going into the LAST roll
  // (captured in lastRollSnapshot, right before it resolved) into any zone
  // that's currently empty -- so a losing pattern you still like doesn't need
  // retapping from scratch. Only fills empty zones (never stacks on top of a
  // bet you've already started rebuilding by hand) and only where that zone
  // is currently legal to bet, same as tapping it directly would require --
  // e.g. it won't resurrect a line bet once a point is already on.
  function rebetLast(){
    if(state.rolling || state.roundComplete || state.phase==="select") return;
    const snap = state.lastRollSnapshot;
    if(!snap) return;
    // roomLeft() is recomputed before EACH zone below (not captured once up
    // front) since it's a shared table-wide pool now -- refilling the line
    // bet first, say, eats into how much room the field or a hardway gets
    // refilled with right after, in this same call. A zone banned by this
    // scene's boss can never legitimately appear here in the first place
    // (its tap* function already refused to let snap hold a nonzero
    // balance for it), but every zone still rechecks betBanned() directly
    // as a defensive backstop rather than leaning on that invariant alone.
    if(snap.lineBet && !state.lineBet && state.phase==="comeout" && state.point===null){
      const room = roomLeft();
      if(room>0) state.lineBet = { type:snap.lineBet.type, amount:Math.min(room, snap.lineBet.amount), odds:0 };
    }
    if(snap.fieldBet>0 && !state.fieldBet && !betBanned("field")){
      const room = roomLeft();
      if(room>0) state.fieldBet = Math.min(room, snap.fieldBet);
    }
    if(snap.hardBets && !betBanned("hard")){
      [4,6,8,10].forEach(n=>{
        if(snap.hardBets[n]>0 && !state.hardBets[n]){
          const room = roomLeft();
          if(room>0) state.hardBets[n] = Math.min(room, snap.hardBets[n]);
        }
      });
    }
    if(snap.propBets){
      Object.keys(snap.propBets).forEach(k=>{
        if(snap.propBets[k]>0 && !state.propBets[k]){
          const room = roomLeft();
          if(room>0) state.propBets[k] = Math.min(room, snap.propBets[k]);
        }
      });
    }
    if(state.phase==="point" && snap.placeBets && !betBanned("place")){
      [4,5,6,8,9,10].forEach(n=>{
        if(snap.placeBets[n]>0 && !state.placeBets[n]){
          const room = roomLeft();
          if(room>0) state.placeBets[n] = Math.min(room, snap.placeBets[n]);
        }
      });
    }
    if(state.phase==="point" && snap.comeBet && snap.comeBet.amount>0 && !(state.comeBet && state.comeBet.amount) && !betBanned("come")){
      const room = roomLeft();
      if(!state.comeBet) state.comeBet = { amount:0 };
      if(room>0) state.comeBet.amount = Math.min(room, snap.comeBet.amount);
    }
    if(state.phase==="point" && snap.dontComeBet && snap.dontComeBet.amount>0 && !(state.dontComeBet && state.dontComeBet.amount) && !betBanned("dontcome")){
      const room = roomLeft();
      if(!state.dontComeBet) state.dontComeBet = { amount:0 };
      if(room>0) state.dontComeBet.amount = Math.min(room, snap.dontComeBet.amount);
    }
    render(); saveState();
  }
  // A win leaves the same amount riding on that number for the next roll --
  // only a seven (a loss, or a push if something's cushioning it) takes a
  // Dealer Bet off the table, matching the Hardways above.
  function resolvePlaceBets(sum, isRepeatHand, roll){
    state.placeResolutions = [];
    [4,5,6,8,9,10].forEach(n=>{
      const amount = state.placeBets[n];
      if(!amount) return;
      if(sum===n){
        const [num,den] = PLACE_PAYOUTS[n];
        const base = Math.round(amount*num/den);
        const paid = resolvePayout({ amount:base, stake:amount, betType:"place", number:n, rolledSum:sum, isRepeatHand, roll });
        state.placeResolutions.push({ win:true, number:n, amount:paid });
        // bet stays on the table after a win
      } else if(sum===7){
        const lost = resolveLossAmount({ amount, stake:amount, betType:"place", number:n, rolledSum:sum, isRepeatHand, roll });
        state.placeResolutions.push(lost.pushed ? { push:true, number:n, amount } : { win:false, number:n, amount:lost.amount });
        state.placeBets[n] = 0;
      }
    });
  }

  // Come: independent of the shooter's own point entirely -- an established
  // come-point bet (state.comeBets[n]) resolves on EVERY roll, not just
  // while phase==="point", because from that money's own perspective it's
  // always "in its point phase" the moment a number's been set, whatever
  // the table's own come-out/point cycle is doing around it (a 7 during the
  // shooter's OWN come-out still clears it, even though that same 7 is a
  // WIN for the Pass Line -- both true at once, same as real craps). Runs
  // before the come-BOX's own resolution below so a roll that both resolves
  // an existing come-point AND supplies a fresh come-out for a brand-new
  // come-box bet lands the old one before the new one moves in -- the order
  // a real dealer would work the layout in.
  function resolveComeBets(sum, isRepeatHand, roll){
    state.comeResolutions = [];
    state.comeBetNote = null;
    if(!state.comeBets) state.comeBets = { 4:0, 5:0, 6:0, 8:0, 9:0, 10:0 };
    [4,5,6,8,9,10].forEach(n=>{
      const amount = state.comeBets[n];
      if(!amount) return;
      if(sum===n){
        // Even money, same as a base Pass Line bet once its point is made --
        // no fractional payout ratio the way a Place bet gets -- and (unlike
        // a Place bet) the bet comes DOWN the moment it wins rather than
        // riding; a brand-new come bet is what gets you back in on it.
        const paid = resolvePayout({ amount, stake:amount, betType:"come", number:n, rolledSum:sum, isRepeatHand, roll });
        state.comeResolutions.push({ win:true, number:n, amount:paid });
        state.comeBets[n] = 0;
      } else if(sum===7){
        const lost = resolveLossAmount({ amount, stake:amount, betType:"come", number:n, rolledSum:sum, isRepeatHand, roll });
        state.comeResolutions.push(lost.pushed ? { push:true, number:n, amount } : { win:false, number:n, amount:lost.amount });
        state.comeBets[n] = 0;
      }
    });
    // The come BOX: whatever's fresh, not yet assigned a number. This roll
    // is its own private "come-out" for that money alone -- 7/11 wins,
    // 2/3/12 loses, a point number moves it onto comeBets[that number] --
    // entirely independent of what state.phase says the table itself is
    // doing, exactly how a real come bet placed mid-point behaves.
    if(!state.comeBet) state.comeBet = { amount:0 };
    const boxAmount = state.comeBet.amount;
    if(boxAmount>0){
      if(sum===7 || sum===11){
        const paid = resolvePayout({ amount:boxAmount, betType:"come", number:null, rolledSum:sum, isRepeatHand, roll });
        state.comeBetNote = { win:true, amount:paid };
        state.comeBet = { amount:0 };
      } else if(sum===2 || sum===3 || sum===12){
        const lost = resolveLossAmount({ amount:boxAmount, betType:"come", number:null, rolledSum:sum, isRepeatHand, roll });
        state.comeBetNote = lost.pushed ? { push:true, amount:boxAmount } : { win:false, amount:lost.amount };
        state.comeBet = { amount:0 };
      } else if(POINT_NUMBERS.includes(sum)){
        state.comeBets[sum] = (state.comeBets[sum]||0) + boxAmount;
        state.comeBetNote = { moved:true, number:sum, amount:boxAmount };
        state.comeBet = { amount:0 };
      }
    }
  }

  // Don't Come: the "don't" mirror of Come, right down to the box-then-point
  // shape -- only difference is which outcomes it's rooting for. The box's
  // own private come-out LOSES on 7/11 (opposite of Come), WINS on 2/3, and
  // PUSHES on 12 -- bar the 12, the exact same convention Don't Pass already
  // uses (see resolveLineBet) -- rather than losing to it. A point number
  // moves it onto dontComeBets[that number] as a lay against that number
  // ever repeating: it wins on ANY seven (independent of state.phase, same
  // as an established Come point) and loses only if its own number shows
  // first. That opposite trigger is exactly why an established Come point
  // and an established Don't Come point can both be live at once and pay
  // out in opposite directions on the very same roll -- no different than
  // Pass and Don't Pass already disagreeing over the shooter's own point.
  function resolveDontComeBets(sum, isRepeatHand, roll){
    state.dontComeResolutions = [];
    state.dontComeBetNote = null;
    if(!state.dontComeBets) state.dontComeBets = { 4:0, 5:0, 6:0, 8:0, 9:0, 10:0 };
    [4,5,6,8,9,10].forEach(n=>{
      const amount = state.dontComeBets[n];
      if(!amount) return;
      if(sum===7){
        const paid = resolvePayout({ amount, stake:amount, betType:"dontcome", number:n, rolledSum:sum, isRepeatHand, roll });
        state.dontComeResolutions.push({ win:true, number:n, amount:paid });
        state.dontComeBets[n] = 0;
      } else if(sum===n){
        const lost = resolveLossAmount({ amount, stake:amount, betType:"dontcome", number:n, rolledSum:sum, isRepeatHand, roll });
        state.dontComeResolutions.push(lost.pushed ? { push:true, number:n, amount } : { win:false, number:n, amount:lost.amount });
        state.dontComeBets[n] = 0;
      }
    });
    if(!state.dontComeBet) state.dontComeBet = { amount:0 };
    const dcBoxAmount = state.dontComeBet.amount;
    if(dcBoxAmount>0){
      if(sum===2 || sum===3){
        const paid = resolvePayout({ amount:dcBoxAmount, betType:"dontcome", number:null, rolledSum:sum, isRepeatHand, roll });
        state.dontComeBetNote = { win:true, amount:paid };
        state.dontComeBet = { amount:0 };
      } else if(sum===7 || sum===11){
        const lost = resolveLossAmount({ amount:dcBoxAmount, betType:"dontcome", number:null, rolledSum:sum, isRepeatHand, roll });
        state.dontComeBetNote = lost.pushed ? { push:true, amount:dcBoxAmount } : { win:false, amount:lost.amount };
        state.dontComeBet = { amount:0 };
      } else if(sum===12){
        // bar the 12: push, same as Don't Pass -- stake returns untouched.
        state.dontComeBetNote = { push:true, amount:dcBoxAmount };
        state.dontComeBet = { amount:0 };
      } else if(POINT_NUMBERS.includes(sum)){
        state.dontComeBets[sum] = (state.dontComeBets[sum]||0) + dcBoxAmount;
        state.dontComeBetNote = { moved:true, number:sum, amount:dcBoxAmount };
        state.dontComeBet = { amount:0 };
      }
    }
  }

  // Real craps rule: a die that leaves the table doesn't count -- the roll
  // itself never happened, so every bet on the table just pushes (see
  // doRoll, which checks this BEFORE resolving anything and skips every
  // resolve* call entirely on a hit -- no bet-zone state gets touched at
  // all, so skipping the resolves for that roll IS the push). Checked on
  // every roll now, not just seven-outs. The victim is swapped to a Standard
  // Die stand-in for the REST OF THIS SCENE ONLY -- its real kind is stashed
  // in state.sidelinedDice and restored next beginScreening() -- so
  // state.dicePool never shrinks and the select screen always shows exactly
  // 5 fully-pickable dice. Play stops cold: a prompt (renderDieLostPrompt)
  // interrupts before anything else renders, and behind it state.phase
  // drops back to "select" so you have to pick 2 new dice before rolling
  // again. Only a die that actually HAS something to lose is ever at risk
  // -- a die's own lossGuard field (Six, Sure Grip and any future compound
  // die pairing it in) changes the odds, but a plain Standard Die has no
  // ability to strip in the first place, so it's excluded from the victim
  // pool entirely (see the filter below) rather than "rolling off the
  // table" into... the exact same Standard Die. Body Double is not exempt
  // this way -- see DIE_KINDS' own comment, it carries no lossGuard of its
  // own and its kind isn't "standard", so it's exactly as vulnerable as any
  // other real die despite filling both active slots by itself.
  //
  // The victim pool excludes any die whose CURRENT kind is "standard" --
  // covers both a die that started the scene that way and one already
  // stripped down to a Standard stand-in by an earlier loss this scene
  // (state.sidelinedDice, restored next beginScreening()). Either way it has
  // nothing left to lose: rolling it "off the table" would just force the
  // same push-and-reselect interrupt for zero stakes, a pointless annoyance
  // rather than a real risk (reported by the user). Returns the DIE_KINDS
  // entry for whichever die got swapped out, or null if nothing happened
  // this roll (including "everyone left standing is already Standard, so
  // there was nothing at risk to check").
  function maybeLoseDie(sum){
    const active = getActiveDice().filter(d=>d.kind!=="standard" && !state.sidelinedDice.some(s=>s.uid===d.uid));
    if(!active.length) return null;
    const victim = active[Math.floor(Math.random()*active.length)];
    const kindDef = DIE_KINDS[victim.kind];
    // Base/Act-scaled rate is now just the floor -- the longer this scene
    // goes without a seven or a repeated sum (state.dieRiskStreak, see
    // freshState/beginScreening's per-scene reset and doRoll/doRetake's
    // snapshot), the more nervous the table gets and the more that floor
    // climbs, capped so a long clean streak can heat up but never makes a
    // die loss near-certain. lossGuard/dieLossMult still apply on top of
    // that capped number, same as they always applied to the flat base rate
    // -- so a lossGuard die still meaningfully cuts its own risk even at a
    // maxed-out streak, not just at the calmer, low-streak numbers.
    let chance = Math.min(DIE_LOSS_STREAK_CAP, dieLossChanceFor(state.ante) + state.dieRiskStreak*DIE_RISK_STREAK_GROWTH);
    if(kindDef && kindDef.lossGuard) chance *= kindDef.lossGuard;
    const character = CHARACTERS[state.characterId];
    if(character && character.dieLossMult) chance *= character.dieLossMult;
    if(Math.random() < chance){
      state.sidelinedDice.push({ uid: victim.uid, kind: victim.kind });
      victim.kind = "standard";
      state.selectedDiceIds = state.selectedDiceIds.filter(id=>id!==victim.uid);
      state.pendingSelect = [];
      state.dieLostPrompt = { name: kindDef.name };
      state.lastDieLostMsg = kindDef.name+" rolled off the table! The roll doesn't count &mdash; every bet pushes. A Standard Die fills in for the rest of this scene.";
      // Stash whatever phase the board was actually in (comeout or mid-point)
      // so confirmLineup can put it right back once the new lineup's picked
      // -- forcing "select" here is just to drive the picker UI, it isn't a
      // real trip back to the start of the scene, and the point/bets/board
      // underneath must come back exactly as they were (see confirmLineup).
      state.dieLostReturnPhase = state.phase;
      state.phase = "select";
      // Scene Stealer (Cast, permanent stack) and Hazard Pay (Lens,
      // immediate reward) both react to this exact same event -- different
      // slots on purpose, see each item's own comment in EQUIPMENT_POOL, so
      // a build can run both off one die-loss trigger.
      if(state.equipped.cast && state.equipped.cast.id==="cast_scene_stealer"){
        state.sceneStealerStacks = (state.sceneStealerStacks||0) + 1;
      }
      if(state.equipped.lens && state.equipped.lens.id==="lens_hazard_pay"){
        state.payroll += 5;
        gainHeat(1);
      }
      return kindDef;
    }
    // No die lost -- this was a real roll (a die-loss roll "never happened",
    // see doRoll's own comment at the call site, so it must not touch the
    // streak either way). A seven or a sum this scene has already seen
    // breaks the nerves and resets the clock back to the floor; anything
    // else is one more clean roll, so the streak grows and the sum joins
    // the seen list. Only 10 non-seven sums exist (2,3,4,5,6,8,9,10,11,12),
    // so dieRiskSeenSums self-caps there even before DIE_LOSS_STREAK_CAP
    // stops the chance itself from climbing any further.
    if(sum===7 || state.dieRiskSeenSums.includes(sum)){
      state.dieRiskStreak = 0;
      state.dieRiskSeenSums = [];
    } else {
      state.dieRiskStreak += 1;
      state.dieRiskSeenSums.push(sum);
    }
    return null;
  }

  // Retrigger pass (V72): runs once per roll after every bet has settled
  // (see doRoll). Each equipped perk with a retrigger() picks from this
  // roll's winning bets; each pick pays that bet's final payout again.
  function resolveRetriggers(roll){
    const wins = (roll.trace||[]).filter(t=>t.win && !t.roll && !t.retrigger && t.final>0);
    if(!wins.length) return;
    // Player's own drag order (see perkOrderSafe) -- only ever perks have a
    // retrigger(), so this is the one resolve step where that order is ALL
    // that decides which equipped item's extra pay lands first in the log.
    perkOrderSafe().forEach(slot=>{
      const item = state.equipped[slot];
      if(!item || !item.retrigger || slot===state.bossDisabledSlot) return;
      const picks = item.retrigger(wins, { state, pointMade: !!roll.pointMade, sum: roll.sum, comeout: roll.comeout }) || [];
      picks.forEach(w=>{
        state.score += w.final;
        roll.grossWin += w.final;
        roll.trace.push({ win:true, retrigger:true, betType:w.betType, bet:w.bet, base:w.final, src:{ label:item.name, key:slot }, steps:[], final:w.final });
      });
    });
  }

  // Vestigial safety net: sidelining never removes a die from
  // state.dicePool (only swaps its kind to Standard), so
  // state.dicePool.length never actually shrinks. Left in case an old save
  // somehow loaded with fewer than 5 dice.
  function restockIfNewAct(){
    const info = actInfo(state.ante);
    if(info.act !== state.lastAct){
      const missing = 5 - state.dicePool.length;
      for(let i=0;i<missing;i++){
        state.dicePool.push({ uid:"die"+state.nextDieUid, kind:"standard" });
        state.nextDieUid += 1;
      }
      state.lastAct = info.act;
    }
  }

  function doRoll(){
    if(state.rolling || state.phase==="select" || state.roundComplete) return;
    state.lastRollSnapshot = {
      phase: state.phase, point: state.point,
      lineBet: state.lineBet ? {...state.lineBet} : null,
      fieldBet: state.fieldBet, stake: state.stake,
      hardBets: {...state.hardBets},
      propBets: {...state.propBets},
      placeBets: {...state.placeBets},
      comeBet: {...state.comeBet},
      comeBets: {...state.comeBets},
      dontComeBet: {...state.dontComeBet},
      dontComeBets: {...state.dontComeBets},
      score: state.score,
      dicePool: state.dicePool.map(d=>({uid:d.uid,kind:d.kind})),
      selectedDiceIds: [...state.selectedDiceIds],
      rollsSincePoint: state.rollsSincePoint, plotArmorUsed: state.plotArmorUsed,
      // Heat/stuntDoubleUsed: only a seven-out ever touches either one (see
      // checkRoundEnd's cushion branch), but captured on every roll so a
      // Retake fully undoes that spend too, not just the bets -- otherwise
      // undoing a cushioned seven-out left you down a Heat checkpoint (or a
      // used-up Stunt Double) for a roll that, as far as the table's
      // concerned, never happened.
      heat: state.heat, stuntDoubleUsed: state.stuntDoubleUsed,
      // Franchise Fatigue's own flag (see its comment in freshState) --
      // captured the same way as heat/stuntDoubleUsed, right before this
      // roll happens, so a Retake can restore it to what it was BEFORE the
      // roll being undone rather than guessing.
      lastRollWasSeven: state.lastRollWasSeven,
      // Same full-time-jump-back treatment for the die-risk streak (see
      // maybeLoseDie) -- captured right before this roll happens so a
      // Retake restores it to whatever it was BEFORE the roll being undone,
      // not whatever it became once that roll's sum landed (or stays put
      // if the undone roll was itself a die-loss, which never touched it).
      dieRiskStreak: state.dieRiskStreak, dieRiskSeenSums: [...state.dieRiskSeenSums],
    };
    state.rolling = true;
    render();
    const dieAEl = document.getElementById('die-a');
    const dieBEl = document.getElementById('die-b');
    // Captured once, up front, rather than after the tumble -- the tint
    // used for the tumbling faces below (and stamped onto lastRoll once it
    // settles, see kindA/kindB) has to be THIS roll's active lineup, and it
    // can't change mid-animation regardless (selectedDiceIds is locked once
    // state.rolling is true, see wireCommon's roll button).
    const active = getActiveDice();
    const tintA = active[0] && DIE_KINDS[active[0].kind] ? DIE_KINDS[active[0].kind].tint : null;
    const tintB = active[1] && DIE_KINDS[active[1].kind] ? DIE_KINDS[active[1].kind].tint : null;
    let ticks = 0;
    const totalTicks = 7;
    // Options' Game Speed (see speedMult) shortens the tumble itself rather
    // than skipping it outright -- floored so Fastest still visibly rattles
    // a couple of ticks instead of the dice just silently snapping to rest.
    const tickMs = Math.max(18, Math.round(75*speedMult()));
    const iv = setInterval(()=>{
      ticks += 1;
      // Tumbling faces are tinted to whichever die is actually in that
      // slot (same color the Dice Select screen showed it in) -- so even
      // mid-tumble, before the roll settles, it's already clear which
      // physical die (special ability and all) is about to land which
      // value once the two faces stop matching by pure chance.
      if(dieAEl) dieAEl.innerHTML = dieFaceSVG(1+Math.floor(Math.random()*6), tintA);
      if(dieBEl) dieBEl.innerHTML = dieFaceSVG(1+Math.floor(Math.random()*6), tintB);
      if(ticks>=totalTicks){
        clearInterval(iv);
        let a = rollOneDie(active[0], 'a');
        let b = rollOneDie(active[1], 'b');
        const script = state.equipped.script;
        // Cold Open: the first roll of every scene is guaranteed to land as a
        // double -- but only on a value BOTH active dice can actually show
        // (see dieFaces). A Tri Die + a Typecast: Sixes, say, can never
        // naturally agree on a double at all, so there's nothing to force;
        // the natural rollOneDie result above is left standing instead of
        // reaching for an impossible (or face-violating) value.
        if(script && script.id==="script_cold_open" && state.rollNumber===0){
          const facesA = dieFaces(active[0]), facesB = dieFaces(active[1]);
          const shared = facesA.filter(v=>facesB.includes(v));
          if(shared.length){ const v = shared[Math.floor(Math.random()*shared.length)]; a = v; b = v; }
        }
        // Chekhov's Gun: once 3 rolls have passed without resolving the point
        // either way, the 4th is guaranteed to hit it -- again only among
        // combinations each active die can actually roll (see dieFaces); if
        // the two dice in play can't combine to hit the point at all, the
        // natural roll stands instead of forcing a face-violating result.
        if(script && script.id==="script_chekhov" && state.phase==="point" && state.rollsSincePoint===3){
          const facesA = dieFaces(active[0]), facesB = dieFaces(active[1]);
          const opts = [];
          facesA.forEach(x=>{ const y=state.point-x; if(facesB.includes(y)) opts.push([x,y]); });
          if(opts.length){ const pair = opts[Math.floor(Math.random()*opts.length)]; a = pair[0]; b = pair[1]; }
        }
        // Franchise Fatigue: if the last roll that actually happened (not
        // one erased by a die going off the table -- see the lostDie branch
        // below, "this roll never happened", which leaves lastRollWasSeven
        // untouched on purpose) summed to seven, this roll is guaranteed not
        // to -- again only among combinations each active die can actually
        // show. Unlike Chekhov's Gun this isn't gated to the point phase --
        // a come-out natural can't be followed by another natural seven
        // either, and a seven-out can't be followed by an immediate second
        // one. Resets every scene (see beginScreening), same as every other
        // Script item that shapes the roll itself.
        if(script && script.id==="script_franchise_fatigue" && state.lastRollWasSeven){
          const facesA = dieFaces(active[0]), facesB = dieFaces(active[1]);
          const opts = [];
          facesA.forEach(x=>{ facesB.forEach(y=>{ if(x+y!==7) opts.push([x,y]); }); });
          if(opts.length){ const pair = opts[Math.floor(Math.random()*opts.length)]; a = pair[0]; b = pair[1]; }
        }
        // The hand is flavor now -- color commentary on how the dice landed,
        // shown in the callout below -- not a second scoring system. The
        // only thing that actually pays out is the real bets resolved below,
        // via resolvePayout/resolveLossAmount/resolveOnRoll.
        const hand = classify(a,b);
        const isRepeatHand = !!(state.lastRoll && state.lastRoll.hand && state.lastRoll.hand.id===hand.id);
        const sum = a+b;
        state.rolling = false;

        // Real craps rule, checked before anything else resolves: a die can
        // go off the table on ANY roll, not just a seven-out. When it does,
        // this roll never happened -- every bet on the table pushes (nothing
        // below gets touched at all, see maybeLoseDie) and rollNumber /
        // rollsSincePoint don't advance either, so Cold Open and Chekhov's
        // Gun stay lined up on the next REAL roll.
        const lostDie = maybeLoseDie(sum);
        if(lostDie){
          state.lastRoll = { a, b, hand, noRoll:true, kindA: active[0] && active[0].kind, kindB: active[1] && active[1].kind };
          state.lastBetNote = null;
          state.lastFieldNote = null;
          state.scriptNote = null;
          state.castNote = null;
          state.bossNote = null;
          state.log.unshift({ t: lostDie.name+" off the table ("+a+"-"+b+")", s: "push" });
          if(state.log.length>8) state.log.length=8;
          render(); saveState();
          return;
        }

        // grossWin/grossLoss are this roll's running totals, for the Dailies
        // log line; isDouble is stamped once here (a===b) so resolvePayout/
        // resolveLossAmount's ctx can read it back for a boss twist like
        // Doubles Off the Table, without threading a,b through every single
        // resolve* call site individually.
        const roll = { grossWin:0, grossLoss:0, isDouble: a===b };
        state.rollNumber += 1;
        // kindA/kindB: which actual die (by kind, not just position) landed
        // each face -- read() by renderPlay's dice-tray/dice-well so a
        // settled roll (and a re-render well after this tick loop's own
        // tintA/tintB have gone out of scope) still colors each die to
        // match Dice Select instead of falling back to the era's plain
        // theme color once it's not actively tumbling any more.
        state.lastRoll = { a, b, hand, kindA: active[0] && active[0].kind, kindB: active[1] && active[1].kind };
        state.lastRollWasSeven = sum===7; // Franchise Fatigue's own lookback -- see its comment in freshState

        state.lastBetNote = null;
        state.lastFieldNote = null;
        state.lastDieLostMsg = null;
        state.scriptNote = null;
        state.castNote = null;
        state.bossNote = null;
        state.placeResolutions = []; // resolvePlaceBets only runs in the "point" branch below -- reset here too so a come-out roll doesn't show a stale result left over from a prior point
        let sevenOut = false;
        // Encore: announce the pattern the moment it's recognized -- the
        // payout doubling itself happens per-bet, below, wherever
        // resolvePayout sees isRepeatHand.
        if(script && script.id==="script_encore" && isRepeatHand){
          state.scriptNote = "Encore: same result twice — winning bets pay double.";
        }

        resolveOnRoll(a, b, sum, hand, isRepeatHand, active, roll);
        resolveHardways(a, b, sum, isRepeatHand, roll);
        if(state.phase==="point") resolvePlaceBets(sum, isRepeatHand, roll); // Dealer Bets are dormant on come-out rolls -- they neither win nor lose until a point is on.
        resolveFieldBet(sum, isRepeatHand, roll); // Field is live on every roll, come-out or point alike.
        resolvePropBets(sum, isRepeatHand, roll); // Props (Any 7, Any Craps, Snake Eyes, Boxcars) are also live on every roll.
        resolveComeBets(sum, isRepeatHand, roll); // Come bets are their own private come-out cycle -- live on every roll, point or come-out alike, independent of state.phase.
        resolveDontComeBets(sum, isRepeatHand, roll); // Don't Come mirrors Come's independence from state.phase -- also live on every roll.
        if(state.phase==="comeout"){
          if(sum===7 || sum===11){
            resolveLineBet(true, sum, isRepeatHand, roll);
          } else if(sum===2 || sum===3 || sum===12){
            resolveLineBet(sum===12 ? null : false, sum, isRepeatHand, roll);
          } else if(POINT_NUMBERS.includes(sum)){
            state.point = sum;
            state.phase = "point";
            state.rollsSincePoint = 0;
            // Pass/Don't Pass bet rides through the point untouched.
          }
        } else if(state.phase==="point"){
          if(sum===state.point){
            roll.pointMade = true; // read by Callback's retrigger
            resolveLineBet(true, sum, isRepeatHand, roll);
            state.point = null;
            state.phase = "comeout";
            state.rollsSincePoint = 0;
          } else if(sum===7){
            if(script && script.id==="script_plot_armor" && !state.plotArmorUsed){
              // Plot Armor: this seven is spared once per scene -- the point
              // and every side bet ride on untouched.
              state.plotArmorUsed = true;
              state.scriptNote = "Plot Armor: the seven survives — the point rides on.";
            } else {
              // Seven-out: the point's gone and every live bet loses. Whether
              // the scene itself survives this is checkRoundEnd's call, below
              // -- short of the target it comes down to Heat (see there).
              resolveLineBet(false, sum, isRepeatHand, roll);
              state.point = null;
              state.phase = "comeout";
              sevenOut = true;
            }
          } else {
            state.rollsSincePoint = (state.rollsSincePoint||0) + 1;
          }
        }

        roll.sum = sum; roll.comeout = !!(state.lastRollSnapshot && state.lastRollSnapshot.phase==="comeout");
        resolveRetriggers(roll);
        const net = roll.grossWin - roll.grossLoss;
        state.lastRoll.netThisRoll = net;

        // Heat has several ways to build beyond just clearing the scene now
        // -- a rare roll, a hardway hit, a hot streak, or one big payout can
        // each kick in a checkpoint too (still doubled by Word of Mouth via
        // gainHeat). All independent, so more than one can fire on the same
        // roll. A seven-out usually breaks the streak and nothing else --
        // every live line/hardway/place/field bet loses on a 7, so net is
        // never positive from those alone. The one exception is an Any 7
        // prop bet, which wins BECAUSE of the seven and can push net positive
        // (even into Big Payout range) on the same roll a crap-out happens;
        // checkRoundEnd appends its own cushion note rather than overwriting
        // this one for exactly that reason.
        const heatNotes = [];
        if(hand.id==="snake" || hand.id==="boxcars"){
          const g = gainHeat(1);
          if(g>0) heatNotes.push((hand.id==="snake"?"Snake eyes":"Boxcars")+" &mdash; +"+g+" heat");
        }
        if((state.hardResolutions||[]).some(r=>r.win)){
          const g = gainHeat(1);
          if(g>0) heatNotes.push("Hardway hit &mdash; +"+g+" heat");
        }
        if(sevenOut){
          state.winStreak = 0;
        } else if(net>0){
          state.winStreak = (state.winStreak||0) + 1;
          if(state.winStreak % 3 === 0){
            const g = gainHeat(1);
            if(g>0) heatNotes.push("Hot streak &times;"+state.winStreak+" &mdash; +"+g+" heat");
          }
        } else if(net<0){
          state.winStreak = 0;
        }
        if(net>=BIG_WIN_HEAT_THRESHOLD){
          const g = gainHeat(1);
          if(g>0) heatNotes.push("Big payout &mdash; +"+g+" heat");
        }
        if(heatNotes.length) state.castNote = heatNotes.join(" &middot; ");

        // Payroll gained this roll (Per Diem Die, Econ felt zones) is tracked
        // completely separately from the Score net above -- it's a different
        // currency, so it gets its own clause on the log line rather than
        // being folded into net/s, which would misleadingly imply it came
        // out of the same pool as the bet payouts.
        let logLine = a+"-"+b+" ("+sum+")";
        if(roll.payrollGain>0) logLine += " &middot; +"+fmtU(roll.payrollGain)+"u payroll";
        state.log.unshift({ t: logLine, s: (net>=0?"+":"")+fmtU(net)+"u" });
        if(state.log.length>8) state.log.length=8;

        render(); saveState();
        checkRoundEnd(sevenOut, roll);
        checkBudgetOut();
        checkRollCapOut();
        // Cosmetic only: pop-ups, particles, stings and Easter eggs read the
        // settled result here and never write a number back.
        try{ afterRollFx({ a, b, sum, hand, net, sevenOut, heatBefore: state.lastRollSnapshot ? state.lastRollSnapshot.heat : null, trace: roll.trace || [] }); }catch(e){}
      }
    }, tickMs);
  }

  // The Time Traveler's free-first-Retake-of-the-scene trait means a
  // Retake can still be available with retakesLeft at 0 -- checked here
  // instead of inlining the character lookup at every call site (doRetake
  // itself, and the Retake button's own disabled attribute in renderPlay).
  function canRetake(){
    if(state.retakesLeft>0) return true;
    const character = CHARACTERS[state.characterId];
    return !!(character && character.freeRetakeEachScene && !state.freeRetakeUsedThisScene);
  }

  function doRetake(){
    if(!canRetake() || !state.lastRoll || state.rolling || state.roundComplete) return;
    const snap = state.lastRollSnapshot;
    if(snap){
      state.phase = snap.phase; state.point = snap.point;
      state.lineBet = snap.lineBet ? {...snap.lineBet} : null;
      state.fieldBet = snap.fieldBet; state.stake = snap.stake;
      state.hardBets = {...snap.hardBets};
      state.propBets = snap.propBets ? {...snap.propBets} : { anySeven:0, anyCraps:0, snakeEyes:0, boxcars:0 };
      state.placeBets = {...snap.placeBets};
      state.comeBet = snap.comeBet ? {...snap.comeBet} : { amount:0 };
      state.comeBets = snap.comeBets ? {...snap.comeBets} : { 4:0, 5:0, 6:0, 8:0, 9:0, 10:0 };
      state.dontComeBet = snap.dontComeBet ? {...snap.dontComeBet} : { amount:0 };
      state.dontComeBets = snap.dontComeBets ? {...snap.dontComeBets} : { 4:0, 5:0, 6:0, 8:0, 9:0, 10:0 };
      state.score = snap.score;
      state.dicePool = snap.dicePool.map(d=>({...d}));
      state.selectedDiceIds = [...snap.selectedDiceIds];
      state.rollsSincePoint = snap.rollsSincePoint||0;
      state.plotArmorUsed = snap.plotArmorUsed||false;
      // Undo whatever that seven-out's Heat cushion spent too (see the
      // snapshot in doRoll) -- a Retake is a full time-jump back to before
      // the roll, not just a bet refund, so a cushioned checkpoint or a
      // used-up Stunt Double comes back right along with the score and bets.
      if(snap.heat!=null) state.heat = snap.heat;
      state.stuntDoubleUsed = !!snap.stuntDoubleUsed;
      // Same full-time-jump-back treatment for Franchise Fatigue's flag --
      // restored to whatever it was BEFORE the roll now being undone, not
      // left at whatever it became once that roll landed. Kept as its own
      // field rather than reading it back off state.lastRoll (see that
      // field's own comment in freshState for why) so this doesn't need to
      // touch state.lastRoll's unconditional reset just below at all.
      state.lastRollWasSeven = !!snap.lastRollWasSeven;
      // Same full-time-jump-back restore for the die-risk streak (see
      // maybeLoseDie/doRoll's snapshot above) -- a Retake undoes whatever
      // that roll's sum did to the streak (grew it, or reset it on a seven
      // or a repeat) right along with the bets and score.
      state.dieRiskStreak = snap.dieRiskStreak||0;
      state.dieRiskSeenSums = snap.dieRiskSeenSums ? [...snap.dieRiskSeenSums] : [];
    }
    const character = CHARACTERS[state.characterId];
    if(character && character.freeRetakeEachScene && !state.freeRetakeUsedThisScene){
      state.freeRetakeUsedThisScene = true; // the time-jump: this one's free, no Retake spent
      state.timeTravelerBoostPending = true; // Time Traveler's own payout hook -- the next bet that wins after this pays 50% more, see CHARACTERS
    } else {
      state.retakesLeft -= 1;
    }
    state.rollNumber -= 1;
    state.lastRoll = null;
    state.lastBetNote = null;
    state.lastFieldNote = null;
    state.lastDieLostMsg = null;
    state.scriptNote = null;
    state.castNote = null;
    state.bossNote = null;
    state.hardResolutions = [];
    state.propResolutions = [];
    state.placeResolutions = [];
    state.comeResolutions = [];
    state.comeBetNote = null;
    state.dontComeResolutions = [];
    state.dontComeBetNote = null;
    state.log.shift();
    render();
    doRoll();
  }

  function settleRound(early){
    // early (whether you wrapped with rolls to spare) no longer swings the
    // payout -- Heat is the resource worth banking for now, see heatBonus.
    const base = shopBaseFor(state.ante, state.tierIdx);
    // 2u per checkpoint banked -- the same rate Breakout Role pays out on a
    // crap-out cushion, so banking Heat and spending it read as comparably
    // worthwhile. First-balance pass, easy to retune here.
    const heatBonus = state.heat * 2;
    const interest = interestFor();
    const payout = base + heatBonus + interest;
    addPayroll(payout);
    state.screeningsWon += 1;
    state.lastPayout = { base, heatBonus, interest, total:payout };
    // advance blind/ante
    state.tierIdx += 1;
    if(state.tierIdx>2){
      state.tierIdx = 0;
      state.ante += 1;
      state.highestAnte = state.ante;
      restockIfNewAct();
      // The boss just cleared (tier 2) no longer has anything to preview --
      // null it back out until beginScreening's own tierIdx-0 draw picks
      // the NEXT ante's boss (not until "Next Scene" is actually clicked
      // from the shop this settleRound is about to open, see enterShop
      // below). The one shop visit in between deliberately shows no boss
      // banner (renderShop/renderBlindSelect both check state.bossId) --
      // same as it always used to, since that ante genuinely hasn't started
      // yet and there's nothing real to prepare for.
      state.bossId = null;
    }
    // Ante 9+ only ends the run the FIRST time through -- once Endless has
    // been switched on (see the win screen's "Keep Rolling" button and
    // enterShop below), wrapping Ante 8 just rolls straight into the next
    // ante's shop like any other, instead of hitting this branch again.
    if(state.ante>MAX_ANTE && !state.endlessMode){
      state.won = true;
      state.screen = "end";
      // Era progression lives outside the run save entirely (see
      // maybeUnlockNextEra) -- winning here is the one and only place a
      // character's own Era record can advance.
      const unlockedId = maybeUnlockNextEra(state.characterId, state.difficulty);
      state.eraUnlockNote = unlockedId ? DIFFICULTIES[unlockedId].name+" unlocked for "+(CHARACTERS[state.characterId] ? CHARACTERS[state.characterId].name : "this lead")+"!" : null;
      // Casting gauntlet: the SAME win can also reveal the next lead on the
      // roster, if this was Era 1 played as your current newest cast member
      // -- see maybeUnlockNextCharacter.
      const unlockedCharId = maybeUnlockNextCharacter(state.characterId, state.difficulty);
      state.characterUnlockNote = unlockedCharId ? CHARACTERS[unlockedCharId].name+" joins the cast!" : null;
      render(); saveState();
      return;
    }
    enterShop();
  }

  // The shop-transition tail shared by a normal scene clear (settleRound,
  // right above) and by clicking "Keep Rolling" on the win screen
  // (renderEnd) -- turning Endless on doesn't replay any part of the scene
  // that was already cleared, it just lets THIS run straight into the next
  // ante's shop instead of stopping at the win screen.
  function enterShop(){
    // Put back any die that rolled off the table this scene BEFORE the shop
    // offers get rolled -- see restoreSidelinedDice(). Both this call and
    // rollShopOffers() (right below) need state.dicePool holding everyone's
    // real kind, not last scene's Standard stand-in: this one so the shop's
    // die picker shows your dice as themselves, rollShopOffers so a
    // die-tied perk's ownership check (dieOwnedFor, called from
    // drawEquipOffer) isn't fooled into thinking you don't own a die you
    // actually do, just because it had a rough night last scene.
    restoreSidelinedDice();
    state.shopOffers = rollShopOffers();
    state.shopRerollCost = rerollBaseCostFor();
    state.retakeBuyCost = RETAKE_SHOP_BASE_COST;
    state.pendingDiceBuy = null;
    state.screen = "shop";
    render(); saveState();
  }

  // Skip Scene: available only on a Read Through or Rehears-Roll (never the
  // Director's Cut boss round -- that one still has to be played) for a
  // build that's comfortably clearing its Target and finds the manual play
  // tedious. Auto-clears the round as a win and pays the same shop-base/
  // interest a real clear does -- but NOT the Heat bonus, and it doesn't
  // bank a Heat checkpoint either (contrast settleRound/onSceneCleared).
  // That's deliberate, and it's the actual balance lever, not just the
  // missed shop screen: gainHeat() above this comment is fed almost
  // entirely by things that only happen while a scene is actually being
  // played -- a rare roll, a hardway hit, a hot streak, a big payout (see
  // the resolveOnRoll call sites) -- and heatBonus (state.heat*2) at
  // settleRound is a real clear cashing in whatever Heat that play, plus
  // every prior one, already banked. A paired empirical A/B run of this
  // vs. real play (same seeds, same bet sizing, no perks) found Skip Scene
  // as originally written -- full Heat bonus AND a free checkpoint, zero
  // bust risk -- clearing 10x more rounds and banking 4x more Payroll than
  // playing for real, which made it a strictly dominant way to grind
  // Payroll/Heat with nothing at risk, not just a tedium-saver. Cutting the
  // Heat side out closes that gap (skip still gets you underlying shop-base
  // pay, so it's never a total loss to use), and leaves the real cost of
  // skipping being twofold: still no equipment/dice/felt purchases this
  // round (see below), and now also no share of whatever Heat that round
  // could have generated -- which was always going to matter for the
  // Director's Cut boss round two skips later still has to be played for
  // real, cushion and all.
  function skipRound(){
    if(state.screen!=="play") return;
    if(state.tierIdx===2) return; // Director's Cut always has to be played
    if(state.rolling || state.dieLostPrompt) return;
    const base = shopBaseFor(state.ante, state.tierIdx);
    const heatBonus = 0; // no Heat cashed in -- see comment above; nothing was played to earn it
    const interest = interestFor();
    const payout = base + heatBonus + interest;
    addPayroll(payout);
    state.screeningsWon += 1;
    state.lastPayout = { base, heatBonus, interest, total:payout };
    // no gainHeat() here any more -- a skipped scene banks no checkpoint,
    // same reasoning as the heatBonus cut just above
    // tierIdx can only be 0 or 1 on the way in here (the guard above refuses
    // a Director's Cut skip), so this only ever advances within the SAME
    // ante -- it can never wrap into a new ante, restock a new Act, or end
    // the run. Beating the boss round for real is still the only way to
    // finish an ante or win the run; unlike settleRound(), there's no
    // ante-wraparound or run-win branch to reach here.
    state.tierIdx += 1;
    // No shop offers rolled here -- that's the point. Straight to the next
    // round's "Next Up" preview, same screen a real settleRound() lands on
    // once the shop's done, minus the shop itself.
    state.screen = "blindselect";
    beginScreening();
    render(); saveState();
  }

  // Draw up to n DISTINCT items from pool (never the same card twice in one
  // shop visit). Returns fewer than n only if the pool itself is that small.
  function sampleUnique(pool, n){
    const bag = pool.slice();
    const out = [];
    while(out.length<n && bag.length){
      const i = Math.floor(Math.random()*bag.length);
      out.push(bag.splice(i,1)[0]);
    }
    return out;
  }

  // Picks ONE die kind, same tiered-chance shape the old per-visit dice
  // roller used (Legendary shot first, then Ultra-rare, then Rare, common
  // as the eventual fallback) -- now called once per shop slot that rolls
  // "die" instead of always drawing exactly 2. `exclude` keeps this visit's
  // other die slot(s) from offering the same kind twice.
  function pickDieKind(exclude){
    exclude = exclude || [];
    let pick = null;
    if(Math.random()<LEGENDARY_DIE_CHANCE){
      pick = sampleUnique(DICE_SHOP_LEGENDARY_POOL.filter(k=>!exclude.includes(k)), 1)[0];
    }
    if(!pick && Math.random()<ULTRA_RARE_DIE_CHANCE){
      pick = sampleUnique(DICE_SHOP_ULTRA_RARE_POOL.filter(k=>!exclude.includes(k)), 1)[0];
    }
    if(!pick && Math.random()<RARE_DIE_CHANCE){
      pick = sampleUnique(DICE_SHOP_RARE_POOL.filter(k=>!exclude.includes(k)), 1)[0];
    }
    if(!pick) pick = sampleUnique(DICE_SHOP_POOL.filter(k=>!exclude.includes(k)), 1)[0];
    return pick || null;
  }

  // Picks ONE felt zone offer, same Econ-then-Score shape the old
  // multi-offer felt roller used to run per-slot -- an independent
  // RARE_FELT_CHANCE shot at an Econ
  // zone, falling back to a standard scoring zone. `exclude` keeps this
  // visit's other felt slot(s) from repeating a zone. guard is a pure
  // infinite-loop safeguard (20 zones total, never realistically reached
  // drawing for just one of 3 shop slots).
  function pickFeltZone(exclude){
    exclude = exclude || [];
    let guard = 0;
    while(guard<50){
      guard++;
      let id = null;
      if(Math.random()<RARE_FELT_CHANCE) id = drawEconFeltOffer();
      if(!id || exclude.includes(id)) id = drawFeltOffer();
      if(id && !exclude.includes(id)) return id;
    }
    return null;
  }

  function startBuyDie(idx){
    const offer = state.shopOffers[idx];
    if(!offer || offer.kind!=="die") return;
    const def = DIE_KINDS[offer.dieKind];
    if(!def || state.payroll < def.cost) return;
    state.pendingDiceBuy = idx;
    render();
  }

  function cancelBuyDie(){
    state.pendingDiceBuy = null;
    render();
  }

  function completeBuyDie(dieUid){
    if(state.pendingDiceBuy==null) return;
    const idx = state.pendingDiceBuy;
    const offer = state.shopOffers[idx];
    const kind = offer && offer.kind==="die" ? offer.dieKind : null;
    const def = kind ? DIE_KINDS[kind] : null;
    if(!def || state.payroll<def.cost) return;
    const die = state.dicePool.find(d=>d.uid===dieUid);
    if(!die) return;
    state.payroll -= def.cost;
    die.kind = kind;
    // New Talent: a permanent, never-reset stack, earned only while it's
    // the equipped Lens item at the moment of THIS purchase -- see its own
    // comment in EQUIPMENT_POOL.
    if(state.equipped.lens && state.equipped.lens.id==="lens_new_talent"){
      state.newTalentStacks = (state.newTalentStacks||0) + 1;
    }
    // If this die is currently a Standard Die stand-in for the scene that
    // just ended (it rolled off the table -- see maybeLoseDie), it still has
    // an entry in state.sidelinedDice remembering what it used to be, so
